<style>
  .zs { display: flex; flex-direction: column; height: 100vh; }
  .zs-kopf { display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: var(--flaeche); border-bottom: 1px solid var(--linie); }
  .zs-kopf h1 { margin: 0; font-size: 20px; font-weight: 600; }
  .zs-kopf .unter { margin: 0; }
  .zs-kopf .kopf-status { margin-left: auto; min-width: 90px; text-align: right; }
  .zs-inhalt { flex: 1; overflow-y: auto; padding: 16px 28px 40px; }
  .zs-innen { max-width: 820px; margin: 0 auto; }
  .zs-werkzeug { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .zs-tipp { color: var(--text-2); font-size: 12.5px; margin: 0 0 14px; }

  .zs-liste { position: relative; }
  .zs-zeile { display: grid; grid-template-columns: 22px 180px 1fr auto; gap: 8px; align-items: start; padding: 6px 8px; margin-bottom: 6px; background: var(--flaeche); border-radius: var(--radius); box-shadow: var(--schatten); }
  .zs-zeile.abschnitt-zeile { grid-template-columns: 22px 1fr auto; background: transparent; box-shadow: none; border-bottom: 2px solid #d7c7f5; border-radius: 0; margin-top: 16px; }
  .zs-griff { cursor: grab; color: var(--text-3); padding-top: 7px; text-align: center; user-select: none; }
  .zs-griff:active { cursor: grabbing; }
  .zs-zeile input, .zs-zeile textarea { width: 100%; border: 1px solid transparent; border-radius: 6px; padding: 5px 7px; font: inherit; font-size: 14px; line-height: 1.45; background: transparent; outline: 0; resize: none; overflow: hidden; }
  .zs-zeile input:hover, .zs-zeile textarea:hover { border-color: var(--linie); }
  .zs-zeile input:focus, .zs-zeile textarea:focus { border-color: var(--akzent); box-shadow: 0 0 0 3px var(--akzent-hell); background: var(--flaeche); }
  .zs-zeile .zs-datum { font-weight: 700; color: #8430ce; }
  .abschnitt-zeile .zs-titel { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #8430ce; }
  .zs-knoepfe { display: flex; gap: 2px; padding-top: 3px; opacity: .35; transition: opacity .15s; }
  .zs-zeile:hover .zs-knoepfe, .zs-zeile:focus-within .zs-knoepfe { opacity: 1; }
  .zs-knoepfe .mini.gefahr { color: #c5221f; font-weight: 600; }
  .zs-zeile.zieht { opacity: .35; }
  .zs-zeile.ziel-vor { box-shadow: 0 -3px 0 var(--akzent), var(--schatten); }
  .zs-zeile.ziel-nach { box-shadow: 0 3px 0 var(--akzent), var(--schatten); }
  .zs-zeile.verschoben { box-shadow: 0 0 0 2px #b794f6; }
  .zs-hinweis { grid-column: 2 / -1; font-size: 12px; color: #6b3fa0; }
  .zs-leer { text-align: center; color: var(--text-2); padding: 40px 0; }
</style>
<script>
/**
 * Ansicht „zeitstrahl“ im großen Fenster: alle Ereignisse und Zeitabschnitte
 * untereinander, direkt bearbeitbar und am Griff ⠿ verschiebbar (oder Alt+↑/↓).
 *
 * Die Reihenfolge legt der Autor fest – viele Angaben sind relativ
 * („zwei Tage vor dem Krieg“). Auf Wunsch schlägt die KI eine Reihenfolge vor.
 * Gespeichert wird wie im Steckbrief nur das Geänderte (bwWerteSetzen, bwReihenfolgeSetzen);
 * die Seitenleiste gleicht sich über fensterMelden_ ab.
 */
BWFenster.registriere('zeitstrahl', (function () {
  var F, t, h, th;
  var liste = [];            // Ereignisse und Abschnitte in ihrer Reihenfolge
  var offen = {}, timer = null;
  var vorschlag = null, kiLaeuft = false;
  var loeschFrage = null, zieh = null;

  function start(f) {
    F = f; t = F.t; h = F.h; th = F.th;
    var zeit = F.daten.eintraege.filter(function (e) { return e.art === 'zeit'; });
    var jahr = F.C.haeufigstesJahr(zeit.map(function (e) { return e.name; }));
    liste = F.C.zeitReihe(zeit, jahr);
    render();
    F.el.addEventListener('input', eingabe);
    F.el.addEventListener('click', klick);
    F.el.addEventListener('keydown', taste);
    F.el.addEventListener('mousedown', function (ev) {
      // Nur am Griff ziehen – sonst ließe sich in den Feldern kein Text markieren.
      var g = ev.target.closest('.zs-griff');
      if (g) g.closest('.zs-zeile').draggable = true;
    });
    F.el.addEventListener('dragstart', ziehStart);
    F.el.addEventListener('dragover', ziehUeber);
    F.el.addEventListener('drop', ziehAblegen);
    F.el.addEventListener('dragend', ziehEnde);
  }

  function istAbschnitt(z) { return z.status === 'abschnitt'; }

  function anzeige() {
    if (!vorschlag) return liste;
    var nach = {};
    vorschlag.reihenfolge.forEach(function (id, i) { nach[id] = i; });
    return liste.slice().sort(function (a, b) { return (nach[a.id] != null ? nach[a.id] : 1e9) - (nach[b.id] != null ? nach[b.id] : 1e9); });
  }

  function render() {
    var n = liste.filter(function (z) { return !istAbschnitt(z); }).length;
    var html = '<div class="zs"><header class="zs-kopf"><div><h1>📅 ' + th('zeit.fenster.titel') + '</h1>' +
      '<div class="unter">' + th('zeit.fenster.anzahl', { n: n }) + '</div></div>' +
      '<span class="kopf-status" id="fenster-status"></span>' +
      (F.kiSichtbar() && n > 2 && !vorschlag ? '<button class="knopf ki" data-aktion="ki"' + (kiLaeuft ? ' disabled' : '') + ' title="' + th('zeit.ki.info') + '">' +
        (kiLaeuft ? th('zeit.ki.laeuft') : th('zeit.ki')) + '</button>' : '') +
      '<button class="knopf primaer" data-aktion="fertig">' + th('fertig') + '</button></header>' +
      '<main class="zs-inhalt"><div class="zs-innen">';
    if (vorschlag) {
      var verschoben = verschobene();
      html += '<div class="vorschlag-box"><h4>' + th('ki.vorschlag') + '</h4><div class="unter" style="margin:0 0 6px">' +
        (verschoben.length ? th('zeit.ki.verschoben', { n: verschoben.length }) : th('zeit.ki.passt')) + '</div><div class="ki-leiste">' +
        (verschoben.length ? '<button class="knopf primaer klein" data-aktion="ki-ja">' + th('ki.uebernehmen') + '</button>' : '') +
        '<button class="knopf klein" data-aktion="ki-nein">' + th(verschoben.length ? 'ki.verwerfen' : 'schliessen') + '</button></div></div>';
    } else {
      html += '<div class="zs-werkzeug"><button class="knopf klein" data-aktion="neu">＋ ' + th('zeit.fenster.neu') + '</button>' +
        '<button class="knopf klein" data-aktion="neu-abschnitt">＋ ' + th('zeit.fenster.neuAbschnitt') + '</button></div>' +
        '<p class="zs-tipp">' + th('zeit.fenster.tipp') + '</p>';
    }
    var hinweise = {};
    if (vorschlag) vorschlag.hinweise.forEach(function (x) { hinweise[x.id] = x.text; });
    var zeilen = anzeige();
    html += zeilen.length ? '<div class="zs-liste">' + zeilen.map(function (z) { return zeile(z, hinweise[z.id]); }).join('') + '</div>'
      : '<div class="zs-leer"><div class="gross">📅</div>' + th('zeit.leer') + '</div>';
    F.el.innerHTML = html + '</div></main></div>';
    Array.prototype.forEach.call(F.el.querySelectorAll('textarea'), autoHoehe);
    F.zeigeStatus();
  }

  function verschobene() {
    return liste.filter(function (z, i) { return vorschlag.reihenfolge.indexOf(z.id) !== i; });
  }

  function zeile(z, hinweis) {
    var bearbeitbar = !vorschlag;
    var zu = bearbeitbar ? '' : ' disabled';
    var verschoben = vorschlag && vorschlag.reihenfolge.indexOf(z.id) !== liste.indexOf(z);
    var knoepfe = bearbeitbar ? '<span class="zs-knoepfe">' +
      '<button class="mini" data-aktion="danach" title="' + th('zeit.fenster.danach') + '">＋</button>' +
      '<button class="mini" data-aktion="art" title="' + th(istAbschnitt(z) ? 'zeit.alsEreignis' : 'zeit.alsAbschnitt') + '">' + (istAbschnitt(z) ? '•' : '§') + '</button>' +
      '<button class="mini' + (loeschFrage === z.id ? ' gefahr' : '') + '" data-aktion="loeschen" title="' + th('menue.loeschen') + '">' + (loeschFrage === z.id ? th('zeit.fenster.wirklich') : '🗑') + '</button>' +
      '</span>' : '<span></span>';
    var griff = '<span class="zs-griff" title="' + th('zeit.ziehen') + '">' + (bearbeitbar ? '⠿' : '') + '</span>';
    var html;
    if (istAbschnitt(z)) {
      html = '<div class="zs-zeile abschnitt-zeile' + (verschoben ? ' verschoben' : '') + '" data-id="' + h(z.id) + '">' + griff +
        '<input class="zs-titel" data-wert="name" value="' + h(z.name || z.text) + '" placeholder="' + th('zeit.fenster.abschnittPlatz') + '"' + zu + '>' + knoepfe;
    } else {
      html = '<div class="zs-zeile' + (verschoben ? ' verschoben' : '') + '" data-id="' + h(z.id) + '">' + griff +
        '<textarea class="zs-datum" data-wert="name" rows="1" placeholder="' + th('zeit.wann') + '"' + zu + '>' + h(z.name) + '</textarea>' +
        '<textarea data-wert="text" rows="1" placeholder="' + th('zeit.was') + '"' + zu + '>' + h(z.text) + '</textarea>' + knoepfe;
    }
    if (hinweis) html += '<div class="zs-hinweis">✨ ' + h(hinweis) + '</div>';
    return html + '</div>';
  }

  function autoHoehe(ta) {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 2 + 'px';
  }

  function eintrag(id) { return liste.filter(function (z) { return z.id === id; })[0]; }

  /* Bearbeiten: kurz verzögert speichern, nur das Geänderte */

  function eingabe(ev) {
    var el = ev.target, w = el.dataset.wert;
    if (!w) return;
    if (el.tagName === 'TEXTAREA') autoHoehe(el);
    var id = el.closest('.zs-zeile').dataset.id;
    var z = eintrag(id);
    z[w] = el.value;
    if (istAbschnitt(z) && w === 'name') z.text = '';
    offen[id] = offen[id] || {};
    offen[id][w] = el.value;
    if (istAbschnitt(z)) offen[id].text = '';
    clearTimeout(timer);
    timer = setTimeout(senden, 700);
  }

  function senden() {
    clearTimeout(timer);
    var alle = offen;
    offen = {};
    return Promise.all(Object.keys(alle).map(function (id) {
      return F.sichere('bwWerteSetzen', id, alle[id]).catch(function () {
        offen[id] = Object.assign(alle[id], offen[id] || {}); // beim nächsten Mal erneut
      });
    }));
  }

  /* Reihenfolge */

  function reihenfolgeSpeichern() {
    return F.sichere('bwReihenfolgeSetzen', liste.map(function (z) { return z.id; }), true);
  }

  function verschiebe(id, zielId, danach) {
    var ids = F.C.verschiebe(liste.map(function (z) { return z.id; }), id, zielId, danach);
    liste = ids.map(eintrag);
    render();
    reihenfolgeSpeichern();
  }

  function taste(ev) {
    // Enter im Datum: weiter zum Text (ein Datum hat keine Absätze)
    if (ev.key === 'Enter' && ev.target.classList.contains('zs-datum')) {
      ev.preventDefault();
      var text = ev.target.closest('.zs-zeile').querySelector('[data-wert="text"]');
      if (text) text.focus();
      return;
    }
    // Alt+↑/↓: die Zeile mit dem Cursor verschieben
    if (!ev.altKey || (ev.key !== 'ArrowUp' && ev.key !== 'ArrowDown') || vorschlag) return;
    var reihe = ev.target.closest && ev.target.closest('.zs-zeile');
    if (!reihe) return;
    ev.preventDefault();
    var id = reihe.dataset.id, i = liste.indexOf(eintrag(id));
    var nachbar = liste[i + (ev.key === 'ArrowUp' ? -1 : 1)];
    if (!nachbar) return;
    var feld = ev.target.dataset.wert;
    senden();
    verschiebe(id, nachbar.id, ev.key === 'ArrowDown');
    var neu = F.el.querySelector('.zs-zeile[data-id="' + id + '"] [data-wert="' + feld + '"]');
    if (neu) neu.focus();
  }

  function ziehStart(ev) {
    var reihe = ev.target.closest && ev.target.closest('.zs-zeile');
    if (!reihe || !reihe.draggable) return;
    zieh = reihe.dataset.id;
    ev.dataTransfer.effectAllowed = 'move';
    ev.dataTransfer.setData('text/plain', zieh);
    setTimeout(function () { reihe.classList.add('zieht'); }, 0);
  }

  function ziehZiel(ev) {
    var reihe = ev.target.closest && ev.target.closest('.zs-zeile');
    if (!zieh || !reihe || reihe.dataset.id === zieh) return null;
    var r = reihe.getBoundingClientRect();
    return { el: reihe, id: reihe.dataset.id, danach: ev.clientY > r.top + r.height / 2 };
  }

  function markierungWeg() {
    Array.prototype.forEach.call(F.el.querySelectorAll('.ziel-vor, .ziel-nach'), function (x) { x.classList.remove('ziel-vor', 'ziel-nach'); });
  }

  function ziehUeber(ev) {
    if (!zieh) return;
    ev.preventDefault();
    var z = ziehZiel(ev);
    markierungWeg();
    if (z) z.el.classList.add(z.danach ? 'ziel-nach' : 'ziel-vor');
  }

  function ziehAblegen(ev) {
    var z = ziehZiel(ev);
    markierungWeg();
    if (!z) return;
    ev.preventDefault();
    var id = zieh;
    zieh = null;
    senden();
    verschiebe(id, z.id, z.danach);
  }

  function ziehEnde() {
    zieh = null;
    markierungWeg();
    Array.prototype.forEach.call(F.el.querySelectorAll('.zs-zeile'), function (x) { x.classList.remove('zieht'); x.draggable = false; });
  }

  /* Neu, Art wechseln, Löschen */

  function neu(abschnitt, nachId) {
    senden();
    var z = { art: 'zeit', name: '', text: '', status: abschnitt ? 'abschnitt' : '' };
    F.sichere('bwSpeichern', z, { melden: true }).then(function (gespeichert) {
      var i = nachId ? liste.indexOf(eintrag(nachId)) + 1 : liste.length;
      liste.splice(i, 0, gespeichert);
      F.daten.eintraege.push(gespeichert);
      render();
      reihenfolgeSpeichern();
      var feld = F.el.querySelector('.zs-zeile[data-id="' + gespeichert.id + '"] [data-wert="name"]');
      if (feld) { feld.focus(); feld.scrollIntoView({ block: 'nearest' }); }
    });
  }

  function artWechseln(id) {
    var z = eintrag(id);
    senden();
    if (istAbschnitt(z)) { z.status = ''; }
    else { z.status = 'abschnitt'; if (!z.name) { z.name = z.text; z.text = ''; } }
    render();
    F.sichere('bwWerteSetzen', id, { status: z.status, name: z.name, text: z.text });
  }

  function loeschen(id) {
    if (loeschFrage !== id) {
      // Erst nachfragen: der Knopf wird kurz zu „Löschen?“
      loeschFrage = id;
      render();
      setTimeout(function () { if (loeschFrage === id) { loeschFrage = null; render(); } }, 3000);
      return;
    }
    loeschFrage = null;
    delete offen[id];
    liste = liste.filter(function (z) { return z.id !== id; });
    render();
    F.sichere('bwFensterLoeschen', id);
  }

  /* KI: Reihenfolge vorschlagen */

  function kiFragen() {
    senden();
    kiLaeuft = true;
    render();
    F.rufe('bwKiZeitOrdnen', liste.map(function (z) { return { id: z.id, datum: z.name, text: z.text, abschnitt: istAbschnitt(z) }; }))
      .then(function (v) {
        kiLaeuft = false;
        vorschlag = { reihenfolge: v.reihenfolge, hinweise: v.hinweise || [] };
        render();
      }, function (err) {
        kiLaeuft = false;
        render();
        F.toast((err && err.message) || String(err), { fehler: true });
      });
  }

  function klick(ev) {
    var b = ev.target.closest('[data-aktion]');
    if (!b) return;
    var was = b.dataset.aktion;
    var reihe = b.closest('.zs-zeile');
    var id = reihe && reihe.dataset.id;
    if (was === 'fertig') F.schliessen();
    else if (was === 'neu') neu(false);
    else if (was === 'neu-abschnitt') neu(true);
    else if (was === 'danach') neu(false, id);
    else if (was === 'art') artWechseln(id);
    else if (was === 'loeschen') loeschen(id);
    else if (was === 'ki') kiFragen();
    else if (was === 'ki-nein') { vorschlag = null; render(); }
    else if (was === 'ki-ja') {
      liste = vorschlag.reihenfolge.map(eintrag).filter(Boolean)
        .concat(liste.filter(function (z) { return vorschlag.reihenfolge.indexOf(z.id) < 0; }));
      vorschlag = null;
      render();
      reihenfolgeSpeichern().then(function () { F.toast(t('zeit.ki.uebernommen')); });
    }
  }

  return { start: start, vorSchliessen: senden };
})());
</script>
