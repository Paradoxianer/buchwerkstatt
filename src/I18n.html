  var aktuell = 'de';

  function setze(sprache) {
    aktuell = T[sprache] ? sprache : 'en';
    return aktuell;
  }

  /** Text zum Schlüssel, Platzhalter {x} werden ersetzt (ohne HTML-Maskierung). */
  function t(schluessel, werte) {
    var text = T[aktuell][schluessel];
    if (text === undefined) text = T.en[schluessel];
    if (text === undefined) text = T.de[schluessel];
    if (text === undefined) return schluessel;
    if (typeof text !== 'string') return text;
    return text.replace(/\{(\w+)\}/g, function (m, k) { return werte && werte[k] != null ? werte[k] : m; });
  }

  function locale() {
    var s = SPRACHEN.filter(function (x) { return x.id === aktuell; })[0];
    return s ? s.locale : 'en-GB';
  }

  /** Welche Sprache gilt bei „Automatisch“? Google-Konto, dann Browser, sonst Englisch. */
  function automatisch(kontoSprache) {
    var kandidaten = [kontoSprache, (navigator.language || '').slice(0, 2)];
    for (var i = 0; i < kandidaten.length; i++) {
      var k = String(kandidaten[i] || '').toLowerCase();
      if (T[k]) return k;
    }
    return 'en';
  }

  return {
    SPRACHEN: SPRACHEN,
    registriere: registriere,
    t: t,
    setze: setze,
    sprache: function () { return aktuell; },
    locale: locale,
    automatisch: automatisch,
    zahl: function (n) { return Number(n || 0).toLocaleString(locale()); }
  };
