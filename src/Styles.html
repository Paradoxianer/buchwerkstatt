<style>
  :root {
    --text: #202124;
    --text-2: #5f6368;
    --text-3: #80868b;
    --linie: #e3e5e8;
    --flaeche: #ffffff;
    --grund: #f6f7f9;
    --akzent: #1a73e8;
    --akzent-hell: #e8f0fe;
    --gefahr: #c5221f;
    --radius: 10px;
    --schatten: 0 1px 2px rgba(60, 64, 67, .12), 0 1px 3px rgba(60, 64, 67, .08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.45 "Google Sans Text", Roboto, Arial, sans-serif;
    color: var(--text);
    background: var(--grund);
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* Kopf */
  .kopf { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--flaeche); border-bottom: 1px solid var(--linie); }
  .kopf-titel { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kopf-status { font-size: 11px; color: var(--text-3); white-space: nowrap; }

  /* Karte unter dem Cursor */
  .spot { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--flaeche); border-bottom: 1px solid var(--linie); cursor: pointer; animation: rein .2s ease; }
  .spot:hover { background: var(--grund); }
  .spot-icon { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--hell, #eee); flex: none; }
  .spot-text { flex: 1; min-width: 0; }
  .spot-name { font-weight: 600; }
  .spot-info { font-size: 11px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spot-pfeil { color: var(--text-3); }
  @keyframes rein { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  .ansicht { flex: 1; overflow-y: auto; padding: 10px 10px 16px; }
  .laden { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--text-2); padding-top: 60px; }
  .kreisel { width: 22px; height: 22px; border: 3px solid var(--linie); border-top-color: var(--akzent); border-radius: 50%; animation: dreh 0.8s linear infinite; }
  @keyframes dreh { to { transform: rotate(360deg); } }

  /* Untere Leiste */
  .leiste { display: grid; grid-template-columns: repeat(6, 1fr); background: var(--flaeche); border-top: 1px solid var(--linie); }
  .leiste button { border: 0; background: none; padding: 6px 0 5px; font-size: 10px; color: var(--text-2); display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .leiste button span { font-size: 16px; line-height: 1.1; filter: grayscale(1); opacity: .7; }
  .leiste button.aktiv { color: var(--akzent); font-weight: 600; }
  .leiste button.aktiv span { filter: none; opacity: 1; }

  /* Eingabe */
  .eingabe { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius); box-shadow: var(--schatten); position: relative; }
  .eingabe:focus-within { border-color: var(--akzent); box-shadow: 0 0 0 3px var(--akzent-hell); }
  .eingabe textarea { display: block; width: 100%; border: 0; outline: 0; resize: none; padding: 10px 10px 4px; min-height: 58px; max-height: 220px; background: transparent; }
  .eingabe-fuss { display: flex; align-items: center; gap: 6px; padding: 4px 6px 6px 10px; min-height: 34px; }
  .vorschau { flex: 1; min-width: 0; font-size: 11.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vorschau b { color: var(--text); }
  .pin { border: 0; background: none; font-size: 13px; padding: 4px; border-radius: 6px; opacity: .35; filter: grayscale(1); }
  .pin.an { opacity: 1; filter: none; }
  .pin:hover { background: var(--grund); }

  .knopf { border: 1px solid var(--linie); background: var(--flaeche); border-radius: 18px; padding: 5px 12px; font-weight: 500; white-space: nowrap; }
  .knopf:hover { background: var(--grund); }
  .knopf.primaer { background: var(--akzent); border-color: var(--akzent); color: #fff; }
  .knopf.primaer:hover { background: #1765cc; }
  .knopf.primaer:disabled { background: #a8c7fa; border-color: #a8c7fa; cursor: default; }
  .knopf.klein { padding: 3px 9px; font-size: 12px; }
  .knopf.gefahr { color: var(--gefahr); }
  .knopf.ki { background: linear-gradient(135deg, #f3e8fd, #e8f0fe); border-color: #d7c7f5; }
  .knopf.ki:hover { background: linear-gradient(135deg, #ead9fc, #dbe7fd); }
  .knopf:disabled { opacity: .55; cursor: default; }
  .link { border: 0; background: none; color: var(--akzent); padding: 0; font-weight: 500; }
  .link:hover { text-decoration: underline; }
  .zurueck { border: 0; background: none; color: var(--text-2); padding: 4px 6px 4px 0; font-weight: 500; }

  /* Vorschläge beim Tippen */
  .vorschlaege { position: absolute; left: 6px; right: 6px; z-index: 20; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.14); overflow: hidden; }
  .vorschlag { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; }
  .vorschlag.aktiv, .vorschlag:hover { background: var(--akzent-hell); }
  .vorschlag small { color: var(--text-3); margin-left: auto; }

  /* Filter */
  .filter { display: flex; align-items: center; gap: 6px; margin: 12px 0 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--linie); background: var(--flaeche); border-radius: 14px; padding: 3px 10px; font-size: 12px; color: var(--text-2); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .chip.aktiv { background: var(--akzent-hell); border-color: #c2d7fb; color: #174ea6; font-weight: 600; }
  .suche { flex: 1; min-width: 80px; border: 1px solid var(--linie); border-radius: 14px; padding: 3px 10px; background: var(--flaeche); outline: 0; font-size: 12px; }
  .suche:focus { border-color: var(--akzent); }

  /* Notizkarten */
  .liste { display: flex; flex-direction: column; gap: 8px; }
  .notiz { background: var(--flaeche); border-radius: var(--radius); box-shadow: var(--schatten); border-left: 3px solid var(--c, #9aa0a6); padding: 8px 10px; position: relative; }
  .notiz.hier { box-shadow: 0 0 0 2px #fbbc04, var(--schatten); }
  .notiz.provisorisch { opacity: .6; }
  .notiz-kopf { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-2); margin-bottom: 3px; }
  .notiz-kopf .art { font-weight: 600; color: var(--c); }
  .notiz-kopf .titel { color: var(--text); font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .notiz-kopf .rechts { margin-left: auto; display: flex; gap: 2px; align-items: center; }
  .stelle { border: 0; background: var(--grund); border-radius: 10px; padding: 1px 7px; font-size: 11px; color: var(--text-2); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stelle:hover { background: #fef7e0; color: #b06000; }
  .mini { border: 0; background: none; border-radius: 6px; padding: 2px 5px; color: var(--text-3); font-size: 13px; line-height: 1; }
  .mini:hover { background: var(--grund); color: var(--text); }
  .notiz-text { word-wrap: break-word; }
  .notiz textarea { width: 100%; border: 1px solid var(--akzent); border-radius: 6px; padding: 6px; resize: vertical; min-height: 60px; outline: 0; }

  .ref { display: inline; border: 0; padding: 0 3px; margin: 0 -1px; border-radius: 4px; font: inherit; font-weight: 600; color: var(--c, var(--akzent)); background: color-mix(in srgb, var(--c, #1a73e8) 11%, transparent); }
  .ref:hover { background: color-mix(in srgb, var(--c, #1a73e8) 22%, transparent); }
  .ref.neu { color: var(--text-2); background: none; border: 1px dashed #bdc1c6; font-weight: 500; }

  .leer { text-align: center; color: var(--text-2); padding: 22px 12px; }
  .leer .gross { font-size: 26px; margin-bottom: 6px; }
  .hilfe { background: #fef7e0; border: 1px solid #feefc3; border-radius: var(--radius); padding: 10px 12px; margin-bottom: 10px; font-size: 12.5px; position: relative; }
  .hilfe code { background: rgba(255,255,255,.7); padding: 0 4px; border-radius: 4px; font-family: inherit; font-weight: 600; }
  .hilfe ul { margin: 6px 0 0; padding-left: 16px; }
  .hilfe li { margin: 2px 0; }
  .hilfe .mini { position: absolute; top: 4px; right: 4px; }

  /* Welt */
  .gruppe { margin-bottom: 14px; }
  .gruppe-kopf { display: flex; align-items: center; gap: 6px; margin: 4px 2px 6px; font-weight: 600; color: var(--text-2); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  .gruppe-kopf .zahl { font-weight: 400; color: var(--text-3); }
  .gruppe-kopf .knopf { margin-left: auto; text-transform: none; letter-spacing: 0; }
  .zeile { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: var(--flaeche); padding: 8px 10px; border-radius: 8px; box-shadow: var(--schatten); margin-bottom: 6px; }
  .zeile:hover { background: #fbfbfc; box-shadow: 0 1px 4px rgba(60,64,67,.2); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 600; color: var(--c); background: var(--hell); font-size: 13px; }
  .zeile-text { min-width: 0; flex: 1; }
  .zeile-name { font-weight: 600; }
  .zeile-info { font-size: 11.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zeile .zahl { font-size: 11px; color: var(--text-3); }
  .neu-zeile { display: flex; gap: 6px; margin-bottom: 8px; }
  .neu-zeile input { flex: 1; border: 1px solid var(--akzent); border-radius: 8px; padding: 6px 8px; outline: 0; }

  /* Karte */
  .karte-kopf { display: flex; align-items: flex-start; gap: 10px; margin: 6px 0 10px; }
  .karte-kopf .avatar { width: 42px; height: 42px; font-size: 18px; }
  .karte-name { font-size: 17px; font-weight: 600; border: 0; background: none; padding: 0; width: 100%; outline: 0; border-bottom: 1px solid transparent; }
  .karte-name:hover, .karte-name:focus { border-bottom-color: var(--linie); }
  .karte-art { font-size: 11px; color: var(--c); font-weight: 600; }
  .feld-alias { width: 100%; border: 0; border-bottom: 1px solid transparent; background: none; font-size: 12px; color: var(--text-2); padding: 1px 0; outline: 0; }
  .feld-alias:hover, .feld-alias:focus { border-bottom-color: var(--linie); }
  .block { background: var(--flaeche); border-radius: var(--radius); box-shadow: var(--schatten); padding: 10px; margin-bottom: 10px; }
  .block-titel { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .block-titel .rechts { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .felder { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: start; }
  .felder label { color: var(--text-2); font-size: 12px; padding-top: 4px; white-space: nowrap; }
  .felder textarea, .freitext { border: 1px solid transparent; border-radius: 6px; padding: 3px 5px; background: none; resize: none; outline: 0; width: 100%; min-height: 24px; overflow: hidden; }
  .felder textarea:hover, .freitext:hover { background: var(--grund); }
  .felder textarea:focus, .freitext:focus { border-color: var(--akzent); background: var(--flaeche); }
  .freitext { min-height: 70px; }
  .freitext-ansicht { min-height: 24px; padding: 3px 5px; border-radius: 6px; cursor: text; word-wrap: break-word; }
  .freitext-ansicht:hover { background: var(--grund); }
  .freitext-ansicht.leer-text { color: var(--text-3); }
  .ki-leiste { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .verbunden { display: flex; flex-wrap: wrap; gap: 5px; }
  .bez { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
  .bez .art-text { color: var(--text-2); font-size: 12px; }
  .bez .mini { margin-left: auto; }
  .bez-neu { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .bez-neu input, .bez-neu select { border: 1px solid var(--linie); border-radius: 6px; padding: 3px 6px; min-width: 0; flex: 1; outline: 0; }
  .bez-neu input:focus, .bez-neu select:focus { border-color: var(--akzent); }
  .unter { margin: 8px 0 4px; font-size: 11px; color: var(--text-3); }

  /* KI-Vorschlag */
  .vorschlag-box { border: 1px solid #d7c7f5; background: #faf6ff; border-radius: var(--radius); padding: 10px; margin-bottom: 10px; }
  .vorschlag-box h4 { margin: 0 0 6px; font-size: 13px; }
  .vorschlag-feld { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; border-top: 1px solid #ede4fb; }
  .vorschlag-feld:first-of-type { border-top: 0; }
  .vorschlag-feld input[type=checkbox] { margin-top: 3px; }
  .vorschlag-feld .alt { color: var(--text-3); text-decoration: line-through; font-size: 11.5px; }
  .vorschlag-feld b { font-size: 12px; color: var(--text-2); font-weight: 600; }
  .befund { padding: 6px 0; border-top: 1px solid #ede4fb; }
  .befund:first-of-type { border-top: 0; }
  .befund q { display: block; color: var(--text-2); font-size: 11.5px; margin-top: 2px; }

  /* Zeitstrahl */
  .zeitstrahl { position: relative; padding-left: 18px; }
  .zeitstrahl::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: #d7c7f5; border-radius: 2px; }
  .ereignis { position: relative; margin-bottom: 8px; }
  .ereignis::before { content: ""; position: absolute; left: -16px; top: 12px; width: 10px; height: 10px; border-radius: 50%; background: #fff; border: 2px solid #8430ce; }
  .ereignis .datum { font-size: 11px; font-weight: 700; color: #8430ce; }

  /* Pinnwand */
  .spalte { margin-bottom: 14px; }
  .idee { background: #fffbe6; border-radius: 4px 4px 4px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.12); padding: 8px 10px; margin-bottom: 8px; transform: rotate(-.4deg); }
  .idee:nth-child(even) { background: #eef7ff; transform: rotate(.5deg); }
  .idee:nth-child(3n) { background: #fdeff4; }
  .idee.verworfen { opacity: .55; }
  .idee-fuss { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }

  /* Ziel */
  .ring-box { display: flex; align-items: center; gap: 14px; }
  .ring { width: 92px; height: 92px; flex: none; }
  .zahl-gross { font-size: 22px; font-weight: 700; }
  .balken { display: flex; align-items: flex-end; gap: 3px; height: 90px; margin-top: 8px; }
  .balken div { flex: 1; background: #c2d7fb; border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
  .balken div.erreicht { background: #34a853; }
  .balken div.heute { outline: 2px solid var(--akzent); outline-offset: 1px; }
  .balken-achse { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-3); margin-top: 3px; }
  .zielfelder { display: grid; grid-template-columns: 1fr auto; gap: 6px 8px; align-items: center; }
  .zielfelder input { width: 90px; border: 1px solid var(--linie); border-radius: 6px; padding: 4px 6px; text-align: right; outline: 0; }
  .fortschritt { height: 8px; background: var(--grund); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .fortschritt div { height: 100%; background: var(--akzent); border-radius: 4px; }

  /* Einstellungen */
  .einst-art { border: 1px solid var(--linie); border-radius: 8px; padding: 8px; margin-bottom: 8px; background: var(--flaeche); }
  .einst-art summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 6px; }
  .einst-art summary::-webkit-details-marker { display: none; }
  .einst-art summary::after { content: "▾"; margin-left: auto; color: var(--text-3); }
  .einst-art[open] summary::after { content: "▴"; }
  .einst-zeile { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
  .einst-zeile label { font-size: 11.5px; color: var(--text-2); }
  .einst-zeile input, .einst-zeile textarea, .einst-zeile select { border: 1px solid var(--linie); border-radius: 6px; padding: 5px 7px; outline: 0; width: 100%; }
  .einst-zeile input:focus, .einst-zeile textarea:focus { border-color: var(--akzent); }
  .schalter { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; }
  .schalter input { margin-top: 2px; }
  .schalter small { display: block; color: var(--text-2); }
  .links a { display: block; color: var(--akzent); text-decoration: none; padding: 3px 0; }
  .links a:hover { text-decoration: underline; }

  /* Hinweise */
  .toast { position: fixed; left: 10px; right: 10px; bottom: 58px; z-index: 50; background: #323232; color: #fff; padding: 9px 12px; border-radius: 8px; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.25); animation: rein .2s ease; }
  .toast.fehler { background: #a50e0e; }
  .toast span { flex: 1; }
  .toast button { border: 0; background: none; color: #8ab4f8; font-weight: 600; padding: 2px 4px; }
  .menue { position: absolute; right: 6px; top: 26px; z-index: 30; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.14); min-width: 150px; overflow: hidden; }
  .menue button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 12px; }
  .menue button:hover { background: var(--grund); }
  .menue button.gefahr { color: var(--gefahr); }
  .auswahl-menue { position: fixed; z-index: 60; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.18); overflow: hidden; min-width: 170px; }
  .auswahl-menue .kopfzeile { padding: 6px 12px; font-size: 11px; color: var(--text-3); border-bottom: 1px solid var(--linie); }
  .auswahl-menue button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 12px; }
  .auswahl-menue button:hover { background: var(--akzent-hell); }
  [hidden] { display: none !important; }
</style>
