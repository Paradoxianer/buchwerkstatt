<style>
  .lk { display: flex; flex-direction: column; height: 100vh; }
  .lk-kopf { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--flaeche); border-bottom: 1px solid var(--linie); }
  .lk-kopf h1 { margin: 0; font-size: 20px; font-weight: 600; white-space: nowrap; }
  .lk-kopf select, .lk-kopf .lk-name { border: 1px solid var(--linie); border-radius: 6px; padding: 5px 7px; background: var(--flaeche); outline: 0; }
  .lk-kopf .lk-name { width: 180px; font-weight: 600; }
  .lk-kopf .lk-name:focus { border-color: var(--akzent); box-shadow: 0 0 0 3px var(--akzent-hell); }
  .lk-kopf .kopf-status { margin-left: auto; min-width: 90px; text-align: right; }
  .lk-kopf .mini.gefahr { color: var(--gefahr); font-weight: 600; }

  .lk-haupt { flex: 1; display: grid; grid-template-columns: 230px 1fr; min-height: 0; }
  .lk-seite { border-right: 1px solid var(--linie); background: var(--flaeche); overflow-y: auto; padding: 10px 12px 20px; }
  .lk-seite h4 { margin: 14px 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-2); }
  .lk-seite .unter { font-size: 12px; }
  .lk-chip { display: flex; align-items: center; gap: 6px; width: 100%; padding: 5px 8px; margin-bottom: 4px; border: 1px solid var(--linie); border-left: 4px solid var(--c, #188038); border-radius: 8px; background: var(--flaeche); text-align: left; cursor: grab; user-select: none; touch-action: none; }
  .lk-chip:hover { background: var(--grund); }
  .lk-chip.drauf { cursor: pointer; border-left-style: dotted; }
  .lk-chip.fokus { box-shadow: 0 0 0 3px var(--akzent-hell); border-color: var(--akzent); }
  .lk-chip .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lk-neu { display: flex; gap: 4px; margin: 6px 0 2px; }
  .lk-neu input { flex: 1; min-width: 0; border: 1px solid var(--linie); border-radius: 6px; padding: 4px 7px; outline: 0; }
  .lk-neu input:focus { border-color: var(--akzent); }

  .lk-flaeche { position: relative; overflow: hidden; background: #e9e4d8; }
  .lk-scroll { position: absolute; inset: 0; overflow: auto; cursor: grab; }
  .lk-scroll.schiebt { cursor: grabbing; }
  .lk-bild { position: relative; margin: 0 auto; background-size: 100% 100%; background-repeat: no-repeat; box-shadow: 0 1px 8px rgba(0, 0, 0, .25); }
  .lk-bild.ohne { background-color: #fbf7ee; background-image: linear-gradient(rgba(120, 100, 60, .08) 1px, transparent 1px), linear-gradient(90deg, rgba(120, 100, 60, .08) 1px, transparent 1px); background-size: 40px 40px; }
  .lk-werkzeug { position: absolute; top: 10px; right: 12px; display: flex; gap: 4px; z-index: 5; background: var(--flaeche); border-radius: 8px; box-shadow: var(--schatten); padding: 3px; align-items: center; }
  .lk-werkzeug .zoom { min-width: 44px; text-align: center; font-size: 12px; color: var(--text-2); }
  .lk-tipp { position: absolute; left: 12px; bottom: 10px; z-index: 5; font-size: 12px; color: var(--text-2); background: rgba(255, 255, 255, .85); border-radius: 6px; padding: 3px 8px; pointer-events: none; }

  /* Fähnchen: Fußpunkt = Ort auf der Karte */
  .lk-pin { position: absolute; width: 0; height: 0; z-index: 2; touch-action: none; }
  .lk-pin .stange { position: absolute; left: -1px; bottom: 0; width: 2px; height: 30px; background: #3c3c3c; }
  .lk-pin .fuss { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: #3c3c3c; box-shadow: 0 0 0 2px rgba(255, 255, 255, .8); }
  .lk-pin .fahne { position: absolute; left: 1px; bottom: 14px; white-space: nowrap; padding: 2px 9px 2px 6px; background: var(--c, #188038); color: #fff; font-size: 12px; font-weight: 600; border-radius: 0 4px 4px 0; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); cursor: grab; user-select: none; clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 50%, 100% 100%, 0 100%); padding-right: 14px; }
  .lk-pin.links .fahne { left: auto; right: 1px; border-radius: 4px 0 0 4px; padding: 2px 6px 2px 14px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 6px 50%); }
  .lk-pin:hover, .lk-pin.offen { z-index: 4; }
  .lk-pin.offen .fahne { outline: 2px solid #fff; }
  .lk-pin.zieht .fahne { cursor: grabbing; opacity: .85; }
  .lk-pin.neu .fahne { animation: lk-hupf .5s ease 2; }
  @keyframes lk-hupf { 50% { transform: translateY(-6px); } }

  .lk-info { position: absolute; z-index: 6; width: 260px; background: var(--flaeche); border-radius: var(--radius); box-shadow: 0 4px 18px rgba(0, 0, 0, .25); padding: 10px 12px; cursor: auto; border-top: 4px solid var(--c, #188038); }
  .lk-info h3 { margin: 0 0 4px; font-size: 15px; display: flex; gap: 6px; align-items: center; }
  .lk-info h3 span { flex: 1; }
  .lk-info .feld { font-size: 12px; margin: 2px 0; }
  .lk-info .feld b { color: var(--text-2); font-weight: 600; }
  .lk-info .text { font-size: 12.5px; margin: 6px 0; white-space: pre-wrap; max-height: 120px; overflow-y: auto; }
  .lk-info .verb { font-size: 12px; color: var(--text-2); margin: 6px 0; }
  .lk-info .ki-leiste { margin-top: 8px; }

  .lk-geist { position: fixed; z-index: 50; pointer-events: none; transform: translate(-1px, -44px); }
  .lk-eingabe { position: absolute; z-index: 6; transform: translate(-50%, 8px); display: flex; gap: 4px; background: var(--flaeche); padding: 6px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0, 0, 0, .25); }
  .lk-eingabe input { width: 170px; border: 1px solid var(--linie); border-radius: 6px; padding: 4px 7px; outline: 0; }

  .lk-leer { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .lk-leer > div { max-width: 420px; background: var(--flaeche); border-radius: var(--radius); box-shadow: var(--schatten); padding: 26px 30px; }
  .lk-leer .gross { font-size: 44px; }
  .lk-leer h2 { margin: 6px 0; font-size: 18px; }
  .lk-leer .ki-leiste { justify-content: center; margin-top: 14px; }
  .lk-laedt { position: absolute; inset: 0; display: grid; place-items: center; z-index: 7; background: rgba(233, 228, 216, .7); }
</style>
<script>
/**
 * Ansicht „landkarte“ im großen Fenster: eine eigene Karte (Zeichnung, Scan, Foto)
 * als Hintergrund, darauf die Orte – und auf Wunsch andere Karten – als Fähnchen.
 *
 * Fähnchen zieht man aus der Liste links auf die Karte und dort herum; ein Klick
 * zeigt die Infos, ein Doppelklick auf die Karte legt einen neuen Ort an.
 * Positionen sind Anteile (0…1) der Bildgröße – so passen sie bei jedem Zoom
 * und auch nach dem Tausch gegen ein schärferes Bild desselben Ausschnitts.
 * Gespeichert wird je Fähnchen (bwLandkartePunkt), nicht die ganze Karte.
 */
BWFenster.registriere('landkarte', (function () {
  var F, t, h, th;
  var karten = [], aktiv = null, bilder = {};
  var zoom = 1, filter = 'orte', offen = null, fokus = null, neuAn = null;
  var laedt = false, loeschFrage = null, zieh = null;
  var OHNE = { breite: 1600, hoehe: 1000 };   // Fläche ohne Bild
  var BILD_MAX = 2400;                          // längste Kante beim Hochladen

  function start(f, param) {
    F = f; t = F.t; h = F.h; th = F.th;
    fokus = param.id || null;
    F.el.innerHTML = '<div class="laden"><div class="kreisel"></div></div>';
    F.rufe('bwLandkartenLaden').then(function (liste) {
      karten = liste;
      var gemerkt = merke();
      var mit = fokus && karten.filter(function (k) { return k.orte[fokus]; })[0];
      aktiv = mit || karten.filter(function (k) { return k.id === gemerkt; })[0] || karten[0] || null;
      if (mit) offen = fokus;
      zeigeKarte(true);
    }, function (err) { F.toast(String(err.message || err), { fehler: true }); });
    F.el.addEventListener('click', klick);
    F.el.addEventListener('change', aenderung);
    F.el.addEventListener('keydown', taste);
    F.el.addEventListener('pointerdown', drueck);
    F.el.addEventListener('dblclick', doppelklick);
    F.el.addEventListener('wheel', rad, { passive: false });
    window.addEventListener('resize', function () { if (aktiv) render(); });
  }

  function merke(id) {
    try {
      if (id === undefined) return localStorage.getItem('bw-landkarte');
      localStorage.setItem('bw-landkarte', id);
    } catch (err) { return null; }
  }

  /* -------------------------------------------------------------- */
  /* Daten                                                           */
  /* -------------------------------------------------------------- */

  function groesse() {
    return aktiv && aktiv.bild && aktiv.breite ? { breite: aktiv.breite, hoehe: aktiv.hoehe } : OHNE;
  }

  /** Das Bild der aktiven Karte holen (einmal je Karte), dann einpassen und zeichnen. */
  function zeigeKarte(einpassen) {
    if (aktiv) merke(aktiv.id);
    if (!aktiv || !aktiv.bild || bilder[aktiv.id]) {
      if (einpassen) zoom = passend();
      render();
      if (offen) zeigeAufKarte(offen);
      return;
    }
    laedt = true;
    render();
    var k = aktiv;
    F.rufe('bwLandkarteBild', k.id).then(function (bild) {
      bilder[k.id] = bild;
      if (aktiv !== k) return;
      laedt = false;
      zoom = passend();
      render();
      if (offen) zeigeAufKarte(offen);
    }, function (err) {
      laedt = false;
      render();
      F.toast(String(err.message || err), { fehler: true });
    });
  }

  function eintraege() {
    return F.daten.eintraege.filter(function (e) {
      return filter === 'alle' ? F.istKarte(e) : e.art === 'ort';
    }).sort(function (a, b) { return a.name.localeCompare(b.name, F.I.locale()); });
  }

  /** Fähnchen auf der aktiven Karte – nur von Einträgen, die es noch gibt. */
  function punkte() {
    if (!aktiv) return [];
    return Object.keys(aktiv.orte).map(function (id) { return F.eintragVon[id]; }).filter(Boolean);
  }

  function artVon(e) { return F.artVon[e.art] || { icon: '📍', farbe: '#188038' }; }

  /* -------------------------------------------------------------- */
  /* Zeichnen                                                        */
  /* -------------------------------------------------------------- */

  function render() {
    var scroll = F.el.querySelector('.lk-scroll');
    var alt = scroll ? { l: scroll.scrollLeft, o: scroll.scrollTop } : null;
    var html = '<div class="lk"><header class="lk-kopf"><h1>🗺️ ' + th('lk.titel') + '</h1>';
    if (karten.length) {
      html += '<select data-aktion="wahl" title="' + th('lk.wahl') + '">' + karten.map(function (k) {
        return '<option value="' + h(k.id) + '"' + (k === aktiv ? ' selected' : '') + '>' + h(k.name || t('lk.ohneName')) + '</option>';
      }).join('') + '<option value="+">＋ ' + th('lk.neu') + '</option></select>' +
        '<input class="lk-name" data-aktion="name" value="' + h(aktiv.name) + '" placeholder="' + th('lk.name') + '" title="' + th('lk.name') + '">' +
        '<button class="mini' + (loeschFrage ? ' gefahr' : '') + '" data-aktion="loeschen" title="' + th('lk.loeschen') + '">' + (loeschFrage ? th('zeit.fenster.wirklich') : '🗑') + '</button>';
    }
    html += '<span class="kopf-status" id="fenster-status"></span>' +
      '<button class="knopf primaer" data-aktion="fertig">' + th('fertig') + '</button></header>' +
      '<div class="lk-haupt"><aside class="lk-seite">' + seite() + '</aside><main class="lk-flaeche">' + flaeche() + '</main></div></div>' +
      '<input type="file" accept="image/*" id="lk-datei" hidden>';
    F.el.innerHTML = html;
    scroll = F.el.querySelector('.lk-scroll');
    if (scroll && alt) { scroll.scrollLeft = alt.l; scroll.scrollTop = alt.o; }
    var eing = F.el.querySelector('.lk-eingabe input');
    if (eing) eing.focus();
    F.zeigeStatus();
  }

  function seite() {
    var alle = eintraege(), drauf = aktiv ? aktiv.orte : {};
    var frei = alle.filter(function (e) { return !drauf[e.id]; });
    var gesetzt = punkte().sort(function (a, b) { return a.name.localeCompare(b.name, F.I.locale()); });
    var html = '<div class="filter" style="padding:0">' +
      '<button class="chip' + (filter === 'orte' ? ' aktiv' : '') + '" data-filter="orte">' + th('lk.filter.orte') + '</button>' +
      '<button class="chip' + (filter === 'alle' ? ' aktiv' : '') + '" data-filter="alle">' + th('lk.filter.alle') + '</button></div>' +
      '<h4>' + th('lk.offen') + '</h4>';
    if (aktiv) {
      html += frei.length ? frei.map(function (e) { return chip(e, false); }).join('')
        : '<div class="unter">' + th(alle.length ? 'lk.alleDrauf' : 'lk.keineOrte') + '</div>';
      html += '<div class="lk-neu"><input id="lk-neu-name" placeholder="' + th('lk.neuerOrt.platz') + '"><button class="knopf klein" data-aktion="neu-ort" title="' + th('lk.neuerOrt') + '">＋</button></div>';
    } else {
      html += '<div class="unter">' + th('lk.erstKarte') + '</div>';
    }
    if (gesetzt.length) html += '<h4>' + th('lk.drauf') + '</h4>' + gesetzt.map(function (e) { return chip(e, true); }).join('');
    return html;
  }

  function chip(e, drauf) {
    var a = artVon(e);
    return '<button class="lk-chip' + (drauf ? ' drauf' : '') + (fokus === e.id ? ' fokus' : '') + '" data-chip="' + h(e.id) + '" style="--c:' + a.farbe + '" title="' + th(drauf ? 'lk.zeigen' : 'lk.ziehen') + '">' +
      '<span>' + a.icon + '</span><span class="n">' + h(e.name) + '</span></button>';
  }

  function flaeche() {
    if (!aktiv) {
      return '<div class="lk-leer"><div><div class="gross">🗺️</div><h2>' + th('lk.leer.titel') + '</h2>' +
        '<div class="unter">' + th('lk.leer.text') + '</div><div class="ki-leiste">' +
        '<button class="knopf primaer" data-aktion="bild">🖼️ ' + th('lk.bild') + '</button>' +
        '<button class="knopf" data-aktion="ohne-bild">' + th('lk.ohneBild') + '</button></div></div></div>';
    }
    var g = groesse(), bild = aktiv.bild ? bilder[aktiv.id] : null;
    var html = '<div class="lk-werkzeug">' +
      '<button class="mini" data-aktion="raus" title="' + th('lk.zoomRaus') + '">−</button>' +
      '<span class="zoom">' + Math.round(zoom * 100) + ' %</span>' +
      '<button class="mini" data-aktion="rein" title="' + th('lk.zoomRein') + '">＋</button>' +
      '<button class="mini" data-aktion="einpassen" title="' + th('lk.einpassen') + '">⤢</button>' +
      '<button class="knopf klein" data-aktion="bild">🖼️ ' + th(aktiv.bild ? 'lk.bildTauschen' : 'lk.bild') + '</button></div>' +
      '<div class="lk-scroll"><div class="lk-bild' + (bild ? '' : ' ohne') + '" style="width:' + Math.round(g.breite * zoom) + 'px;height:' + Math.round(g.hoehe * zoom) + 'px;' +
      (bild ? 'background-image:url(\'' + bild + '\')' : '') + '">' +
      punkte().map(pin).join('') + (offen && aktiv.orte[offen] && F.eintragVon[offen] ? info(F.eintragVon[offen]) : '') +
      (neuAn ? '<div class="lk-eingabe" style="left:' + neuAn[0] * 100 + '%;top:' + neuAn[1] * 100 + '%"><input id="lk-hier-name" placeholder="' + th('lk.neuerOrt.platz') + '">' +
        '<button class="knopf primaer klein" data-aktion="neu-hier">＋</button></div>' : '') +
      '</div></div>' +
      '<div class="lk-tipp">' + th('lk.tipp') + '</div>';
    if (laedt) html += '<div class="lk-laedt"><div class="kreisel"></div></div>';
    return html;
  }

  function pin(e) {
    var p = aktiv.orte[e.id], a = artVon(e);
    // Ganz rechts weht das Fähnchen nach links, damit der Name nicht abgeschnitten wird.
    return '<div class="lk-pin' + (offen === e.id ? ' offen' : '') + (p[0] > 0.85 ? ' links' : '') + '" data-pin="' + h(e.id) + '" style="left:' + p[0] * 100 + '%;top:' + p[1] * 100 + '%;--c:' + a.farbe + '">' +
      '<span class="stange"></span><span class="fuss"></span><span class="fahne">' + a.icon + ' ' + h(e.name) + '</span></div>';
  }

  /** Die Infos zum Fähnchen: Stern-Felder, Text, Verbindungen. */
  function info(e) {
    var p = aktiv.orte[e.id], a = artVon(e);
    var kurz = ((F.daten.kurzeArten || {})[F.I.sprache()] || {})[a.id];
    var felder = F.C.obenFelder(a, kurz, e.felder || {}).filter(function (n) { return (e.felder || {})[n]; });
    var verbunden = (F.graph.raus[e.id] || []).concat(F.graph.rein[e.id] || [])
      .map(function (id) { return F.eintragVon[id]; })
      .filter(function (x, i, l) { return F.istKarte(x) && l.indexOf(x) === i; })
      .map(function (x) { return artVon(x).icon + ' ' + x.name; });
    // Rechts vom Fähnchen, am rechten Rand nach links; unten nach oben klappen.
    var links = p[0] > 0.6, oben = p[1] > 0.55;
    var stil = (links ? 'right:' + (100 - p[0] * 100) + '%;margin-right:8px;' : 'left:' + p[0] * 100 + '%;margin-left:8px;') +
      (oben ? 'bottom:' + (100 - p[1] * 100) + '%;margin-bottom:34px;' : 'top:' + p[1] * 100 + '%;margin-top:8px;');
    return '<div class="lk-info" style="' + stil + '--c:' + a.farbe + '">' +
      '<h3>' + a.icon + '<span>' + h(e.name) + '</span><button class="mini" data-aktion="info-zu" title="' + th('schliessen') + '">✕</button></h3>' +
      felder.map(function (n) { return '<div class="feld"><b>' + h(n) + ':</b> ' + h(e.felder[n]) + '</div>'; }).join('') +
      (e.text ? '<div class="text">' + h(e.text) + '</div>' : '') +
      (verbunden.length ? '<div class="verb">' + th('lk.verbunden') + ': ' + h(verbunden.join(', ')) + '</div>' : '') +
      (!felder.length && !e.text && !verbunden.length ? '<div class="unter">' + th('lk.nochNichts') + '</div>' : '') +
      '<div class="ki-leiste"><button class="knopf klein" data-aktion="wegnehmen">' + th('lk.wegnehmen') + '</button></div></div>';
  }

  /* -------------------------------------------------------------- */
  /* Zoom und Ausschnitt                                             */
  /* -------------------------------------------------------------- */

  function passend() {
    var f = F.el.querySelector('.lk-flaeche');
    var b = f ? f.clientWidth : window.innerWidth - 230, hh = f ? f.clientHeight : window.innerHeight - 56;
    var g = groesse();
    return Math.max(0.1, Math.min(2, (b - 24) / g.breite, (hh - 24) / g.hoehe));
  }

  /** Zoomt um den Punkt (Bildschirmkoordinaten) – ohne Punkt um die Mitte. */
  function zoomeAuf(neu, px, py) {
    var s = F.el.querySelector('.lk-scroll');
    neu = Math.max(0.1, Math.min(4, neu));
    if (!s) { zoom = neu; render(); return; }
    var r = s.getBoundingClientRect();
    var ox = px != null ? px - r.left : s.clientWidth / 2, oy = py != null ? py - r.top : s.clientHeight / 2;
    var bild = s.querySelector('.lk-bild'), br = bild.getBoundingClientRect();
    var ax = (r.left + ox - br.left) / br.width, ay = (r.top + oy - br.top) / br.height;
    zoom = neu;
    render();
    s = F.el.querySelector('.lk-scroll');
    bild = s.querySelector('.lk-bild');
    s.scrollLeft = bild.offsetLeft + ax * bild.offsetWidth - ox;
    s.scrollTop = bild.offsetTop + ay * bild.offsetHeight - oy;
  }

  /** Bildschirmpunkt → Anteil auf der Karte, oder null außerhalb. */
  function aufKarte(x, y, auchDraussen) {
    var bild = F.el.querySelector('.lk-bild');
    if (!bild) return null;
    var r = bild.getBoundingClientRect();
    var ax = (x - r.left) / r.width, ay = (y - r.top) / r.height;
    var flaeche = F.el.querySelector('.lk-flaeche').getBoundingClientRect();
    var drin = x >= flaeche.left && x <= flaeche.right && y >= flaeche.top && y <= flaeche.bottom && ax >= 0 && ax <= 1 && ay >= 0 && ay <= 1;
    if (!drin && !auchDraussen) return null;
    return [Math.min(1, Math.max(0, ax)), Math.min(1, Math.max(0, ay))];
  }

  /** Mitte des sichtbaren Ausschnitts als Anteil. */
  function mitte() {
    var f = F.el.querySelector('.lk-flaeche').getBoundingClientRect();
    return aufKarte(f.left + f.width / 2, f.top + f.height / 2, true) || [0.5, 0.5];
  }

  /** Scrollt das Fähnchen in die Mitte. */
  function zeigeAufKarte(id) {
    var s = F.el.querySelector('.lk-scroll'), p = aktiv && aktiv.orte[id];
    if (!s || !p) return;
    var bild = s.querySelector('.lk-bild');
    s.scrollLeft = bild.offsetLeft + p[0] * bild.offsetWidth - s.clientWidth / 2;
    s.scrollTop = bild.offsetTop + p[1] * bild.offsetHeight - s.clientHeight / 2;
  }

  /* -------------------------------------------------------------- */
  /* Ziehen: Fähnchen, Chips aus der Liste, Karte verschieben        */
  /* -------------------------------------------------------------- */

  function drueck(ev) {
    if (ev.button !== 0) return;
    // Offene Eingaben (Kartenname) erst abschließen – preventDefault unten verhindert sonst das blur.
    var fokusEl = document.activeElement;
    if (fokusEl && fokusEl.blur && fokusEl.matches('input') && !ev.target.closest('input, .lk-eingabe')) fokusEl.blur();
    var pinEl = ev.target.closest('.lk-pin'), chipEl = ev.target.closest('.lk-chip');
    var scroll = ev.target.closest('.lk-scroll');
    if (pinEl && !ev.target.closest('.lk-info')) {
      zieh = { art: 'pin', id: pinEl.dataset.pin, el: pinEl, x: ev.clientX, y: ev.clientY, bewegt: false };
    } else if (chipEl && !chipEl.classList.contains('drauf') && aktiv) {
      zieh = { art: 'chip', id: chipEl.dataset.chip, x: ev.clientX, y: ev.clientY, bewegt: false };
    } else if (scroll && !ev.target.closest('.lk-info, .lk-eingabe')) {
      zieh = { art: 'schieben', el: scroll, x: ev.clientX, y: ev.clientY, l: scroll.scrollLeft, o: scroll.scrollTop, bewegt: false };
    } else {
      return;
    }
    ev.preventDefault();
    document.addEventListener('pointermove', bewege);
    document.addEventListener('pointerup', loslassen);
  }

  function bewege(ev) {
    if (!zieh) return;
    var dx = ev.clientX - zieh.x, dy = ev.clientY - zieh.y;
    if (!zieh.bewegt && Math.abs(dx) + Math.abs(dy) < 5) return;
    if (!zieh.bewegt) {
      zieh.bewegt = true;
      if (zieh.art === 'pin') zieh.el.classList.add('zieht');
      if (zieh.art === 'schieben') zieh.el.classList.add('schiebt');
      if (zieh.art === 'chip') {
        var e = F.eintragVon[zieh.id], a = artVon(e);
        zieh.geist = document.createElement('div');
        zieh.geist.className = 'lk-pin lk-geist';
        zieh.geist.style.setProperty('--c', a.farbe);
        zieh.geist.innerHTML = '<span class="stange"></span><span class="fuss"></span><span class="fahne">' + a.icon + ' ' + h(e.name) + '</span>';
        document.body.appendChild(zieh.geist);
      }
    }
    if (zieh.art === 'schieben') {
      zieh.el.scrollLeft = zieh.l - dx;
      zieh.el.scrollTop = zieh.o - dy;
    } else if (zieh.art === 'pin') {
      var p = aufKarte(ev.clientX, ev.clientY, true);
      zieh.el.style.left = p[0] * 100 + '%';
      zieh.el.style.top = p[1] * 100 + '%';
      zieh.pos = p;
    } else {
      // Der Geist sitzt mit dem Fuß unter dem Mauszeiger.
      zieh.geist.style.left = ev.clientX + 'px';
      zieh.geist.style.top = ev.clientY + 44 + 'px';
    }
  }

  function loslassen(ev) {
    document.removeEventListener('pointermove', bewege);
    document.removeEventListener('pointerup', loslassen);
    var z = zieh;
    zieh = null;
    if (!z) return;
    if (z.geist) z.geist.remove();
    if (z.art === 'schieben') {
      z.el.classList.remove('schiebt');
      if (!z.bewegt && (offen || neuAn)) { offen = null; neuAn = null; render(); }
      return;
    }
    if (z.art === 'pin') {
      if (!z.bewegt) { offen = offen === z.id ? null : z.id; neuAn = null; render(); return; }
      setze(z.id, z.pos);
      return;
    }
    // Chip: auf die Karte gezogen – oder nur angeklickt, dann in die Mitte.
    var p = z.bewegt ? aufKarte(ev.clientX, ev.clientY) : mitte();
    if (p) { offen = z.id; setze(z.id, p, true); }
  }

  function setze(id, p, neu) {
    var k = aktiv, alt = k.orte[id];
    k.orte[id] = [Math.round(p[0] * 10000) / 10000, Math.round(p[1] * 10000) / 10000];
    fokus = null;
    render();
    if (neu) { var el = F.el.querySelector('.lk-pin[data-pin="' + id + '"]'); if (el) el.classList.add('neu'); }
    F.sichere('bwLandkartePunkt', k.id, id, k.orte[id]).catch(function () {
      if (alt) k.orte[id] = alt; else delete k.orte[id];
      if (aktiv === k) render();
    });
  }

  function wegnehmen(id) {
    var k = aktiv, alt = k.orte[id];
    delete k.orte[id];
    offen = null;
    render();
    F.sichere('bwLandkartePunkt', k.id, id, null).catch(function () { k.orte[id] = alt; if (aktiv === k) render(); });
  }

  /* -------------------------------------------------------------- */
  /* Klicks und Eingaben                                             */
  /* -------------------------------------------------------------- */

  function klick(ev) {
    var f = ev.target.closest('[data-filter]');
    if (f) { filter = f.dataset.filter; render(); return; }
    var c = ev.target.closest('.lk-chip.drauf');
    if (c) { offen = c.dataset.chip; neuAn = null; render(); zeigeAufKarte(offen); return; }
    var b = ev.target.closest('button[data-aktion]');
    if (!b) return;
    var aktion = b.dataset.aktion;
    if (aktion === 'fertig') F.schliessen();
    else if (aktion === 'rein') zoomeAuf(zoom * 1.25);
    else if (aktion === 'raus') zoomeAuf(zoom / 1.25);
    else if (aktion === 'einpassen') { zoom = passend(); render(); }
    else if (aktion === 'bild') bildWaehlen();
    else if (aktion === 'ohne-bild') neueKarte();
    else if (aktion === 'info-zu') { offen = null; render(); }
    else if (aktion === 'wegnehmen') wegnehmen(offen);
    else if (aktion === 'neu-ort') neuerOrt(F.el.querySelector('#lk-neu-name'), null);
    else if (aktion === 'neu-hier') neuerOrt(F.el.querySelector('#lk-hier-name'), neuAn);
    else if (aktion === 'loeschen') karteLoeschen();
  }

  function aenderung(ev) {
    var el = ev.target;
    if (el.dataset.aktion === 'wahl') {
      if (el.value === '+') { neueKarte(); return; }
      aktiv = karten.filter(function (k) { return k.id === el.value; })[0] || aktiv;
      offen = null; neuAn = null; loeschFrage = null;
      zeigeKarte(true);
    } else if (el.dataset.aktion === 'name') {
      var k = aktiv, name = el.value.trim();
      if (!name || name === k.name) { el.value = k.name; return; }
      k.name = name;
      render();
      F.sichere('bwLandkarteSpeichern', { id: k.id, name: name });
    }
  }

  function taste(ev) {
    if (ev.key === 'Enter' && ev.target.id === 'lk-neu-name') { ev.preventDefault(); neuerOrt(ev.target, null); }
    else if (ev.key === 'Enter' && ev.target.id === 'lk-hier-name') { ev.preventDefault(); neuerOrt(ev.target, neuAn); }
    else if (ev.key === 'Enter' && ev.target.classList.contains('lk-name')) ev.target.blur();
    else if (ev.key === 'Escape' && (neuAn || offen)) { neuAn = null; offen = null; render(); }
  }

  function doppelklick(ev) {
    if (!aktiv || ev.target.closest('.lk-pin, .lk-info, .lk-eingabe, .lk-werkzeug')) return;
    var p = aufKarte(ev.clientX, ev.clientY);
    if (!p) return;
    neuAn = p;
    offen = null;
    render();
  }

  function rad(ev) {
    if (!aktiv || !(ev.ctrlKey || ev.metaKey) || !ev.target.closest('.lk-flaeche')) return;
    ev.preventDefault();
    zoomeAuf(zoom * (ev.deltaY < 0 ? 1.15 : 1 / 1.15), ev.clientX, ev.clientY);
  }

  /** Neuer Ort – aus der Liste (mitten auf die Karte) oder per Doppelklick an diese Stelle. */
  function neuerOrt(input, p) {
    var name = input ? input.value.trim() : '';
    if (!name) { neuAn = null; render(); return; }
    var da = F.daten.eintraege.filter(function (e) { return e.art === 'ort' && e.name.toLowerCase() === name.toLowerCase(); })[0];
    var ziel = p || mitte();
    neuAn = null;
    if (da) { offen = da.id; setze(da.id, ziel, true); return; }
    var k = aktiv;
    F.sichere('bwSpeichern', { art: 'ort', name: name, text: '', aliase: [], felder: {} }, { melden: true }).then(function (e) {
      F.daten.eintraege.push(e);
      F.berechne();
      if (aktiv !== k) return;
      offen = e.id;
      setze(e.id, ziel, true);
      var feld = F.el.querySelector('#lk-neu-name');
      if (feld && !p) feld.focus();
    });
  }

  function neueKarte() {
    var name = t('lk.standardName', { n: karten.length + 1 });
    return F.sichere('bwLandkarteSpeichern', { name: name }).then(function (k) {
      karten.push(k);
      aktiv = k;
      offen = null; neuAn = null; loeschFrage = null;
      zeigeKarte(true);
      return k;
    });
  }

  function karteLoeschen() {
    if (loeschFrage !== aktiv.id) {
      loeschFrage = aktiv.id;
      render();
      setTimeout(function () { if (loeschFrage) { loeschFrage = null; render(); } }, 3000);
      return;
    }
    var k = aktiv;
    loeschFrage = null;
    karten = karten.filter(function (x) { return x !== k; });
    aktiv = karten[0] || null;
    offen = null;
    zeigeKarte(true);
    F.sichere('bwLandkarteLoeschen', k.id).catch(function () { karten.push(k); render(); });
  }

  /* -------------------------------------------------------------- */
  /* Bild hochladen                                                  */
  /* -------------------------------------------------------------- */

  function bildWaehlen() {
    var input = F.el.querySelector('#lk-datei');
    input.onchange = function () {
      var datei = input.files && input.files[0];
      if (!datei) return;
      var leser = new FileReader();
      leser.onload = function () { bildSpeichern(leser.result, datei.name.replace(/\.[^.]+$/, '')); };
      leser.readAsDataURL(datei);
    };
    input.click();
  }

  function bildSpeichern(src, dateiname) {
    var img = new Image();
    img.onload = function () {
      var f = Math.min(1, BILD_MAX / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * f); c.height = Math.round(img.naturalHeight * f);
      var g = c.getContext('2d');
      g.fillStyle = '#fff';
      g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      // Höchstens ≈ 1,9 MB – erst die Qualität senken, dann die Größe.
      var url = c.toDataURL('image/jpeg', 0.85);
      for (var q = 0.75; url.length > 1900000 && q > 0.4; q -= 0.1) url = c.toDataURL('image/jpeg', q);
      while (url.length > 1900000 && c.width > 600) {
        var k = document.createElement('canvas');
        k.width = Math.round(c.width * 0.8); k.height = Math.round(c.height * 0.8);
        k.getContext('2d').drawImage(c, 0, 0, k.width, k.height);
        c = k;
        url = c.toDataURL('image/jpeg', 0.7);
      }
      var breite = c.width, hoehe = c.height;
      var bereit = aktiv ? Promise.resolve(aktiv) : F.sichere('bwLandkarteSpeichern', { name: dateiname || t('lk.standardName', { n: 1 }) }).then(function (k) { karten.push(k); aktiv = k; return k; });
      laedt = true;
      render();
      bereit.then(function (karte) {
        return F.sichere('bwLandkarteBildSetzen', karte.id, url, breite, hoehe).then(function (neu) {
          karte.bild = true; karte.breite = neu.breite; karte.hoehe = neu.hoehe;
          bilder[karte.id] = url;
          laedt = false;
          if (aktiv === karte) { zoom = passend(); render(); }
        });
      }).catch(function () { laedt = false; render(); });
    };
    img.onerror = function () { F.toast(t('bild.ungueltig'), { fehler: true }); };
    img.src = src;
  }

  return { start: start };
})());
</script>
