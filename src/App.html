<script>
/**
 * Oberfläche der Seitenleiste.
 *
 * Aufbau: ein Zustand (S), daraus abgeleitete Verzeichnisse (berechne()),
 * und je Ansicht eine render-Funktion. Gespeichert wird sofort und ohne
 * „Speichern“-Knöpfe – oben rechts steht, ob alles gesichert ist.
 *
 * Alle Texte kommen aus I18n.html (t('schluessel')). Die KI ist optional:
 * Ohne API-Schlüssel (oder wenn ausgeschaltet) taucht sie nirgends auf.
 */
(function () {
  var C = BWCore;
  var I = BWI18n;
  var t = I.t;
  var h = C.escapeHtml;
  /** Übersetzter Text, fertig maskiert für HTML. */
  function th(schluessel, werte) { return h(t(schluessel, werte)); }

  var S = {
    buch: '', tabelleUrl: '', ordnerUrl: '', kontoSprache: '', standardArten: {}, kurzeArten: {}, bilder: {}, bildKi: null,
    einst: null, eintraege: [], beziehungen: [], ki: { aktiv: false },
    cursor: null, textstellen: {}, stat: null,
    ansicht: 'notizen', karteId: null, verlauf: [],
    filter: merke('filter') || 'alle', suche: '', weltSuche: '', zeitMit: '',
    neuIn: null, bearbeiten: null, kiVorschlag: null, kiBefunde: null, vorkommen: null,
    blaetterOffen: {},
    gruppeAuf: merke('gruppen') || {}, fensterZeit: 0
  };
  var D = { index: null, artVon: {}, eintragVon: {}, graph: null, jahr: 0 };
  var tmpZaehler = 0;

  /* -------------------------------------------------------------- */
  /* Server                                                          */
  /* -------------------------------------------------------------- */

  function rufe(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, fehler) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fehler);
      r[fn].apply(r, args);
    });
  }

  var laufend = 0;
  function sichere(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    laufend++;
    zeigeStatus();
    return rufe.apply(null, [fn].concat(args)).then(function (x) {
      laufend--;
      zeigeStatus();
      return x;
    }, function (err) {
      laufend--;
      zeigeStatus();
      toast(fehlertext(err), { fehler: true });
      throw err;
    });
  }

  function fehlertext(err) {
    var text = (err && err.message) || String(err);
    return text.replace(/^Exception:\s*/, '').replace(/^Error:\s*/, '');
  }

  function zeigeStatus() {
    var el = document.getElementById('status');
    if (laufend > 0) {
      el.textContent = t('status.speichert');
    } else if (S.stat && S.einst) {
      var ziel = tagesziel();
      el.textContent = ziel
        ? t('status.woerter', { n: I.zahl(S.stat.heute), ziel: I.zahl(ziel) })
        : t('status.woerterOhneZiel', { n: I.zahl(S.stat.heute) });
      el.title = t('status.titel');
    } else {
      el.textContent = '';
    }
  }

  /* -------------------------------------------------------------- */
  /* Kleine Helfer                                                   */
  /* -------------------------------------------------------------- */

  function merke(k, v) {
    try {
      if (arguments.length > 1) localStorage.setItem('bw-' + k, JSON.stringify(v));
      else return JSON.parse(localStorage.getItem('bw-' + k));
    } catch (err) { return null; }
  }

  function $(sel, wurzel) { return (wurzel || document).querySelector(sel); }
  function $$(sel, wurzel) { return Array.prototype.slice.call((wurzel || document).querySelectorAll(sel)); }

  function art(id) { return D.artVon[id] || notizArt(); }
  function notizArt() { return Object.assign({}, C.NOTIZ_ART, { name: t('vorschau.notiz').replace(/^📝\s*/, '') }); }
  function istKarte(e) { return !!(e && art(e.art).karte); }
  function karten() { return S.eintraege.filter(function (e) { return istKarte(e) && e.name; }); }
  function eintrag(id) { return D.eintragVon[id]; }
  function erstesWort(artId) {
    var a = (S.einst.arten || []).filter(function (x) { return x.id === artId; })[0];
    return a && a.woerter && a.woerter[0] ? a.woerter[0] : (a ? a.name : artId);
  }

  /** KI-Knöpfe nur, wenn ein Schlüssel da ist und sie nicht ausgeschaltet wurden. */
  function kiSichtbar() { return S.ki.aktiv && S.einst.kiAnzeigen !== false; }

  function initialen(name) {
    var teile = String(name || '?').trim().split(/\s+/);
    return h((teile[0][0] || '?') + (teile.length > 1 ? teile[teile.length - 1][0] : '')).toUpperCase();
  }

  function stilFarbe(a) { return '--c:' + a.farbe + ';--hell:' + a.hell; }

  /** Bild der Karte, sonst die Initialen. */
  function avatarHtml(e) {
    var bild = S.bilder[e.id];
    return bild ? '<img src="' + h(bild) + '" alt="">' : initialen(e.name);
  }

  function textHtml(text) { return C.textMitVerweisen(text, D.index, D.eintragVon, D.artVon); }

  function stelle(e) {
    var s = e.anker ? S.textstellen[e.anker] : null;
    return {
      kapitel: s ? s.kapitel : e.kapitel,
      pos: s ? s.pos : null,
      tab: s ? s.tab : (e.anker || '').split('|')[0],
      text: s && s.text != null ? s.text : e.ankertext
    };
  }

  /**
   * Pin oben rechts an jeder Notiz:
   * angeheftet → Kapitel (und Wort), Klick springt hin; sonst ein blasser Pin zum Anheften.
   */
  function stelleKnopf(e) {
    if (e.provisorisch) return '';
    if (!e.anker) {
      return '<button class="pin-los" data-anheften="' + h(e.id) + '" title="' + th('pin.heften.titel') + '" aria-label="' + th('pin.heften') + '">📌</button>';
    }
    var s = stelle(e);
    var k = s.kapitel || t('stelle');
    return '<button class="stelle" data-stelle="' + h(e.id) + '" title="' + th('stelle.titel') + '">📌 ' +
      (s.text ? '„' + h(C.ausschnitt(s.text, 18)) + '“' : h(k)) + '</button>';
  }

  /** Heftet einen Eintrag an die aktuelle Stelle im Text (markiertes Wort oder Absatz). */
  function anheften(e) {
    if (!e || e.provisorisch) return;
    sichere('bwAnheften', e.id).then(function (s) {
      if (!s) { toast(t('pin.keinCursor'), { dauer: 6000 }); return; }
      e.anker = s.anker;
      e.kapitel = s.kapitel;
      e.ankertext = s.ankertext;
      S.textstellen[s.anker] = { kapitel: s.kapitel, pos: s.pos, tab: s.tab, text: s.ankertext };
      render();
      toast(s.ankertext ? t('pin.anWort', { text: s.ankertext })
        : s.kapitel ? t('pin.anAbsatz', { kapitel: s.kapitel }) : t('pin.anAbsatzOhne'));
    });
  }

  function loesen(e) {
    var alt = { anker: e.anker, kapitel: e.kapitel, ankertext: e.ankertext };
    e.anker = e.kapitel = e.ankertext = '';
    render();
    sichere('bwLoesen', e.id).then(function () { toast(t('pin.geloest')); }, function () {
      Object.assign(e, alt);
      render();
    });
  }

  function berechne() {
    D.artVon = C.artenMap(S.einst);
    D.artVon.notiz = notizArt();
    D.eintragVon = {};
    S.eintraege.forEach(function (e) { D.eintragVon[e.id] = e; });
    D.index = C.baueIndex(S.eintraege, C.alleArten(S.einst));
    D.graph = C.verbindungen(S.eintraege, D.index, S.beziehungen);
    D.jahr = C.haeufigstesJahr(S.eintraege.filter(function (e) { return e.art === 'zeit'; }).map(function (e) { return e.name; }));
  }

  function finde(artId, name) {
    var n = String(name || '').trim().toLowerCase();
    return karten().filter(function (e) {
      if (artId && e.art !== artId) return false;
      return e.name.toLowerCase() === n || (e.aliase || []).some(function (a) { return a.toLowerCase() === n; });
    })[0];
  }

  function autoHoehe(ta) {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 2 + 'px';
  }

  /* -------------------------------------------------------------- */
  /* Hinweise                                                        */
  /* -------------------------------------------------------------- */

  var toastTimer = null, toastOpt = null;
  function toast(text, opt) {
    opt = opt || {};
    var el = document.getElementById('toast');
    clearTimeout(toastTimer);
    // Ein verdrängter Hinweis (z. B. „Gelöscht · Rückgängig“) wird jetzt abgeschlossen.
    if (toastOpt && toastOpt.beiEnde) {
      var ende = toastOpt.beiEnde;
      toastOpt.beiEnde = null;
      ende();
    }
    toastOpt = opt;
    el.className = 'toast' + (opt.fehler ? ' fehler' : '');
    el.innerHTML = '<span>' + h(text) + '</span>' +
      (opt.aktion ? '<button data-toast="aktion">' + h(opt.aktion) + '</button>' : '') +
      '<button data-toast="zu" title="' + th('schliessen') + '">✕</button>';
    el.hidden = false;
    el.onclick = function (ev) {
      var b = ev.target.closest('[data-toast]');
      if (!b) return;
      if (b.dataset.toast === 'aktion' && opt.beiAktion) opt.beiAktion();
      if (opt.beiEnde && b.dataset.toast === 'zu') opt.beiEnde();
      opt.beiEnde = null;
      el.hidden = true;
    };
    // Fehler bleiben stehen, bis man sie wegklickt – sonst sind sie weg, bevor man sie lesen kann.
    if (opt.fehler && !opt.dauer) return;
    toastTimer = setTimeout(function () {
      el.hidden = true;
      if (opt.beiEnde) opt.beiEnde();
      opt.beiEnde = null;
    }, opt.dauer || 4000);
  }

  /** optionen: [{ html, tun }] – html ist bereits maskiert. */
  function auswahlMenue(x, y, kopf, optionen) {
    schliesseMenues();
    var m = document.createElement('div');
    m.className = 'auswahl-menue';
    m.innerHTML = (kopf ? '<div class="kopfzeile">' + h(kopf) + '</div>' : '') +
      optionen.map(function (o, i) { return '<button data-i="' + i + '">' + o.html + '</button>'; }).join('');
    document.body.appendChild(m);
    var breite = m.offsetWidth, hoehe = m.offsetHeight;
    m.style.left = Math.max(6, Math.min(x, window.innerWidth - breite - 6)) + 'px';
    m.style.top = Math.max(6, Math.min(y, window.innerHeight - hoehe - 6)) + 'px';
    m.onclick = function (ev) {
      var b = ev.target.closest('[data-i]');
      if (!b) return;
      schliesseMenues();
      optionen[Number(b.dataset.i)].tun();
    };
  }

  function schliesseMenues() {
    $$('.auswahl-menue, .menue').forEach(function (m) { m.remove(); });
  }

  function gefahr(text) { return '<span style="color:var(--gefahr)">' + h(text) + '</span>'; }

  /* -------------------------------------------------------------- */
  /* Speichern                                                       */
  /* -------------------------------------------------------------- */

  /** Speichert einen Eintrag; ist er neu, erscheint er sofort (vorläufig) in der Liste. */
  function speichere(e, optionen) {
    var neu = !e.id;
    if (neu) {
      e.id = 'tmp' + (++tmpZaehler);
      e.provisorisch = true;
      e.erstellt = e.erstellt || jetztText();
      S.eintraege.push(e);
    }
    var vorher = verweiseVon(e);
    berechne();
    var daten = Object.assign({}, e);
    delete daten.provisorisch;
    return sichere('bwSpeichern', daten, optionen || {}).then(function (gespeichert) {
      var altId = e.id;
      Object.keys(gespeichert).forEach(function (k) {
        if (k !== 'pos' && k !== 'tab') e[k] = gespeichert[k];
      });
      delete e.provisorisch;
      if (gespeichert.anker && gespeichert.pos != null) {
        S.textstellen[gespeichert.anker] = { kapitel: gespeichert.kapitel, pos: gespeichert.pos, tab: gespeichert.tab };
      }
      if (altId !== e.id) {
        // vorläufige ID überall ersetzen
        S.beziehungen.forEach(function (b) {
          if (b.von === altId) b.von = e.id;
          if (b.nach === altId) b.nach = e.id;
        });
        if (S.karteId === altId) S.karteId = e.id;
      }
      berechne();
      blaetterVormerken(vorher.concat(verweiseVon(e)));
      return e;
    }, function (err) {
      if (neu) {
        S.eintraege = S.eintraege.filter(function (x) { return x !== e; });
        berechne();
      }
      throw err;
    });
  }

  function verweiseVon(e) {
    var ids = D.index ? C.verweisIds(e, D.index) : [];
    if (istKarte(e)) ids.push(e.id);
    return ids;
  }

  function jetztText() {
    var d = new Date();
    function z(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
  }

  /** Löschen mit „Rückgängig“: erst nach ein paar Sekunden wirklich weg. */
  function loesche(e, frage) {
    var tun = function () {
      var betroffen = verweiseVon(e).concat((D.graph.rein[e.id] || []));
      S.eintraege = S.eintraege.filter(function (x) { return x !== e; });
      var bez = S.beziehungen.filter(function (b) { return b.von === e.id || b.nach === e.id; });
      S.beziehungen = S.beziehungen.filter(function (b) { return bez.indexOf(b) < 0; });
      berechne();
      if (S.karteId === e.id) zurueck();
      else render();
      var rueckgaengig = false;
      toast(t('geloescht', { name: istKarte(e) ? '„' + e.name + '“' : art(e.art).name }), {
        aktion: t('rueckgaengig'), dauer: 6000,
        beiAktion: function () {
          rueckgaengig = true;
          S.eintraege.push(e);
          S.beziehungen = S.beziehungen.concat(bez);
          berechne();
          render();
        },
        beiEnde: function () {
          if (rueckgaengig) return;
          sichere('bwLoeschen', e.id).then(function () {
            blaetterVormerken(betroffen.filter(function (id) { return id !== e.id; }));
          });
        }
      });
    };
    if (!frage) return tun();
    auswahlMenue(window.innerWidth / 2 - 90, 120, frage, [
      { html: th('loeschen.ja'), tun: tun },
      { html: th('abbrechen'), tun: function () {} }
    ]);
  }

  function speichereEinstellungen() {
    berechne();
    return sichere('bwEinstellungenSpeichern', S.einst);
  }

  /* -------------------------------------------------------------- */
  /* Sprache                                                         */
  /* -------------------------------------------------------------- */

  function wendeSpracheAn() {
    var gewaehlt = S.einst && S.einst.sprache;
    I.setze(gewaehlt && gewaehlt !== 'auto' ? gewaehlt : I.automatisch(S.kontoSprache));
    document.documentElement.lang = I.sprache();
    $$('#leiste button').forEach(function (b) {
      var k = b.dataset.nav === 'pinnwand' ? 'ideen' : b.dataset.nav === 'einstellungen' ? 'mehr' : b.dataset.nav;
      b.lastChild.textContent = t('nav.' + k);
      b.title = t('nav.' + k + '.titel');
    });
  }

  /**
   * Beim Sprachwechsel die Standard-Arten mitnehmen: Name, Schlüsselwörter und
   * Felder werden nur ersetzt, wenn sie noch dem Standard der alten Sprache entsprechen.
   */
  function wechsleSprache(neu) {
    var alt = I.sprache();
    S.einst.sprache = neu;
    wendeSpracheAn();
    var vorher = S.standardArten[alt] || [], nachher = S.standardArten[I.sprache()] || [];
    var gleich = function (a, b) { return JSON.stringify(a) === JSON.stringify(b); };
    S.einst.arten.forEach(function (a) {
      var v = vorher.filter(function (x) { return x.id === a.id; })[0];
      var n = nachher.filter(function (x) { return x.id === a.id; })[0];
      if (!v || !n) return;
      ['name', 'mehrzahl', 'woerter', 'felder'].forEach(function (f) {
        if (gleich(a[f], v[f])) a[f] = JSON.parse(JSON.stringify(n[f]));
      });
      var kurzVorher = (S.kurzeArten[alt] || {})[a.id], kurzNachher = (S.kurzeArten[I.sprache()] || {})[a.id];
      if (kurzVorher && kurzNachher && gleich(a.felder, kurzVorher)) a.felder = kurzNachher.slice();
    });
    speichereEinstellungen();
    zeigeStatus();
    render();
  }

  /* -------------------------------------------------------------- */
  /* Personenblätter (Google Docs pro Karte)                         */
  /* -------------------------------------------------------------- */

  var blattTimer = null;
  function blaetterVormerken(ids) {
    if (!S.einst.blaetterAuto) return;
    ids.forEach(function (id) {
      var e = eintrag(id);
      if (e && istKarte(e) && String(id).indexOf('tmp') !== 0) S.blaetterOffen[id] = true;
    });
    clearTimeout(blattTimer);
    blattTimer = setTimeout(blaetterSenden, 8000);
  }

  function blaetterSenden(alle) {
    var ids = alle ? karten().map(function (e) { return e.id; }) : Object.keys(S.blaetterOffen);
    S.blaetterOffen = {};
    var blaetter = ids.map(eintrag).filter(function (e) { return e && istKarte(e); }).map(baueBlatt);
    if (!blaetter.length) return Promise.resolve();
    return sichere('bwBlaetterSync', blaetter).then(function (ergebnis) {
      Object.keys(ergebnis).forEach(function (id) { if (eintrag(id)) eintrag(id).blatt = ergebnis[id]; });
      if (!S.ordnerUrl) rufe('bwLaden').then(function (d) { S.ordnerUrl = d.ordnerUrl; });
      if (S.ansicht === 'karte') renderKopfMenue();
    });
  }

  function stuecke(text) {
    text = String(text || '');
    var out = [], pos = 0;
    C.findeVerweise(text, D.index).forEach(function (v) {
      if (v.start > pos) out.push({ t: text.slice(pos, v.start) });
      out.push(v.neu ? { t: v.text } : { t: v.text, z: v.ids[0] });
      pos = v.ende;
    });
    if (pos < text.length) out.push({ t: text.slice(pos) });
    return out;
  }

  function baueBlatt(e) {
    var a = art(e.art);
    var abschnitte = [];
    var werte = e.felder || {};
    // Ein Abschnitt pro Bereich des Steckbriefs; leere Abschnitte lässt das Blatt weg.
    C.steckbrief(a.felder, werte, t('karte.weitere')).forEach(function (g) {
      abschnitte.push({
        titel: g.titel || t('blatt.steckbrief'),
        zeilen: g.felder.filter(function (f) { return String(werte[f.name] || '').trim(); })
          .map(function (f) { return [{ t: f.name + ': ', fett: true }].concat(stuecke(werte[f.name])); })
      });
    });
    abschnitte.push({ titel: t('blatt.beschreibung'), zeilen: String(e.text || '').split('\n').filter(Boolean).map(stuecke) });
    abschnitte.push({
      titel: t('blatt.beziehungen'),
      zeilen: S.beziehungen.filter(function (b) { return b.von === e.id || b.nach === e.id; }).map(function (b) {
        var anderer = eintrag(b.von === e.id ? b.nach : b.von);
        if (!anderer) return [];
        var artText = b.art || t('karte.verbundenMit');
        return b.von === e.id
          ? [{ t: artText + ' ' }, { t: anderer.name, z: anderer.id }]
          : [{ t: anderer.name, z: anderer.id }, { t: ' ' + t('blatt.ist', { art: artText, name: e.name }) }];
      }).filter(function (z) { return z.length; })
    });
    abschnitte.push({
      titel: t('blatt.verbunden'),
      zeilen: verbundeneKarten(e.id).map(function (v) { return [{ t: art(v.e.art).icon + ' ' }, { t: v.e.name, z: v.e.id }]; })
    });
    abschnitte.push({
      titel: t('blatt.notizen'),
      zeilen: notizenZu(e.id).map(function (n) {
        var k = stelle(n).kapitel;
        return (k ? [{ t: k + ' – ', fett: true }] : []).concat(stuecke(n.text));
      })
    });
    abschnitte.push({
      titel: t('blatt.zeitstrahl'),
      zeilen: ereignisseZu(e.id).map(function (z) { return [{ t: z.name + ': ', fett: true }].concat(stuecke(z.text)); })
    });
    return {
      id: e.id,
      blattId: e.blatt,
      titel: e.name,
      untertitel: a.name + ((e.aliase || []).length ? ' · ' + t('blatt.auch') + ': ' + e.aliase.join(', ') : ''),
      fusszeile: t('blatt.fuss'),
      abschnitte: abschnitte
    };
  }

  /* -------------------------------------------------------------- */
  /* Abfragen                                                        */
  /* -------------------------------------------------------------- */

  /** Notizen und Ideen, die eine Karte erwähnen (älteste zuerst). */
  function notizenZu(id) {
    return (D.graph.rein[id] || []).map(eintrag).filter(function (e) {
      return e && !istKarte(e) && e.art !== 'zeit';
    }).sort(nachStelle);
  }

  function ereignisseZu(id) {
    return C.zeitReihe((D.graph.rein[id] || []).map(eintrag).filter(function (e) { return e && e.art === 'zeit' && e.status !== 'abschnitt'; }), D.jahr);
  }

  /** Karten, die mit dieser verbunden sind – direkt oder weil sie gemeinsam erwähnt werden. */
  function verbundeneKarten(id) {
    var punkte = {};
    function zaehle(andereId, gewicht) {
      if (andereId === id) return;
      var e = eintrag(andereId);
      if (!e || !istKarte(e)) return;
      punkte[andereId] = (punkte[andereId] || 0) + gewicht;
    }
    (D.graph.raus[id] || []).forEach(function (x) { zaehle(x, 2); });
    (D.graph.rein[id] || []).forEach(function (x) {
      zaehle(x, 2);
      (D.graph.raus[x] || []).forEach(function (y) { zaehle(y, 1); });
    });
    return Object.keys(punkte).map(function (k) { return { e: eintrag(k), punkte: punkte[k] }; })
      .sort(function (a, b) { return b.punkte - a.punkte || a.e.name.localeCompare(b.e.name); });
  }

  function nachStelle(a, b) {
    var pa = stelle(a).pos, pb = stelle(b).pos;
    if (pa != null && pb != null && pa !== pb) return pa - pb;
    return String(a.erstellt).localeCompare(String(b.erstellt));
  }

  function nachDatum(a, b) {
    var da = C.parseDatum(a.name, D.jahr), db = C.parseDatum(b.name, D.jahr);
    if (da != null && db != null && da !== db) return da - db;
    if (da == null && db != null) return 1;
    if (db == null && da != null) return -1;
    return String(a.erstellt).localeCompare(String(b.erstellt));
  }

  /* -------------------------------------------------------------- */
  /* Navigation                                                      */
  /* -------------------------------------------------------------- */

  function geheZu(ansicht) {
    S.verlauf = [];
    S.ansicht = ansicht;
    S.karteId = null;
    S.kiVorschlag = S.kiBefunde = S.vorkommen = null;
    render();
    $('#ansicht').scrollTop = 0;
    if (ansicht === 'ziel') ladeStatistik();
  }

  function oeffneKarte(id) {
    if (!eintrag(id)) return;
    S.verlauf.push({ ansicht: S.ansicht, karteId: S.karteId, scroll: $('#ansicht').scrollTop });
    S.ansicht = 'karte';
    S.karteId = id;
    S.kiVorschlag = S.kiBefunde = S.vorkommen = null;
    render();
    $('#ansicht').scrollTop = 0;
  }

  function zurueck() {
    var z = S.verlauf.pop() || { ansicht: 'notizen' };
    S.ansicht = z.ansicht;
    S.karteId = z.karteId;
    S.kiVorschlag = S.kiBefunde = S.vorkommen = null;
    if (S.ansicht === 'karte' && !eintrag(S.karteId)) return zurueck();
    render();
    if (z.scroll) $('#ansicht').scrollTop = z.scroll;
  }

  function springe(e) {
    if (!e.anker) return;
    sichere('bwZuTextstelle', e.anker).then(function (ok) {
      if (!ok) toast(t('stelle.weg'));
    });
  }

  function render() {
    var el = $('#ansicht');
    var fokus = document.activeElement && document.activeElement.id === 'neu';
    var f = {
      notizen: renderNotizen, welt: renderWelt, karte: renderKarte, zeit: renderZeit,
      pinnwand: renderPinnwand, ziel: renderZiel, einstellungen: renderEinstellungen
    }[S.ansicht];
    $$('#leiste button').forEach(function (b) {
      b.classList.toggle('aktiv', b.dataset.nav === (S.ansicht === 'karte' ? 'welt' : S.ansicht));
    });
    if (S.ansicht === 'notizen' && $('#neu') && $('#neu').dataset.sprache === I.sprache()) {
      // Eingabefeld behalten (Fokus, Text), nur die Liste neu zeichnen.
      renderNotizListe();
      return;
    }
    el.innerHTML = f();
    $$('textarea[data-auto]', el).forEach(autoHoehe);
    if (S.ansicht === 'karte') renderKopfMenue();
    if (S.ansicht === 'notizen') {
      vorbereitenEingabe();
      renderNotizListe();
      if (fokus) $('#neu').focus();
    }
  }

  /* -------------------------------------------------------------- */
  /* Ansicht: Notizen                                                */
  /* -------------------------------------------------------------- */

  function renderNotizen() {
    var hilfe = S.einst.hinweisGesehen ? '' : hilfeHtml();
    var beispiel = t('neu.beispiel', { wort: erstesWort('person') });
    return '<div class="eingabe">' +
      '<textarea id="neu" rows="2" data-sprache="' + I.sprache() + '" placeholder="' + th('neu.platzhalter', { beispiel: beispiel }) + '" aria-label="' + th('neu.aria') + '"></textarea>' +
      '<div id="vorschlaege" class="vorschlaege" hidden></div>' +
      '<div class="eingabe-fuss">' +
      '<div class="vorschau" id="vorschau"></div>' +
      '<button class="pin' + (S.einst.anheften ? ' an' : '') + '" id="pin" title="' + th('pin.titel') + '">📌</button>' +
      '<button class="knopf primaer klein" id="speichern" disabled>' + th('speichern') + '</button>' +
      '</div></div>' + hilfe +
      '<div class="filter">' +
      '<button class="chip" data-filter="hier">📍 ' + th('filter.hier') + '</button>' +
      '<button class="chip" data-filter="alle">' + th('filter.alle') + '</button>' +
      '<input class="suche" id="suche" type="search" placeholder="' + th('suchen') + '" value="' + h(S.suche) + '">' +
      '</div><div class="liste" id="liste"></div>';
  }

  function hilfeHtml() {
    var zeile = function (id) {
      return '<li><code>' + h(erstesWort(id)) + ' ' + th('hilfe.bsp.' + id) + ': …</code> ' + th('hilfe.' + id) + '</li>';
    };
    return '<div class="hilfe" id="hilfe"><button class="mini" data-aktion="hilfe-zu" title="' + th('hilfe.aus') + '">✕</button>' +
      '<b>' + th('hilfe.titel') + '</b> ' + th('hilfe.intro') + '<ul>' +
      zeile('person') + zeile('ort') + zeile('ding') + zeile('zeit') +
      '<li><code>' + h(erstesWort('idee')) + ': …</code> ' + th('hilfe.idee') + '</li>' +
      '<li><code>@Lena</code> ' + th('hilfe.at') + '</li></ul>' +
      '<div style="margin-top:6px">' + th('hilfe.ende') + '</div></div>';
  }

  function renderNotizListe() {
    var liste = $('#liste');
    if (!liste) return;
    $$('[data-filter]').forEach(function (b) { b.classList.toggle('aktiv', b.dataset.filter === S.filter); });
    var hierChip = $('[data-filter="hier"]');
    if (hierChip) {
      var k = S.cursor && S.cursor.kapitel;
      hierChip.textContent = '📍 ' + (k ? C.ausschnitt(k, 22) : t('filter.hier'));
      hierChip.title = t('filter.hier.titel');
    }
    var eintraege = S.eintraege.slice();
    var leerText = '';
    if (S.filter === 'hier') {
      if (!S.cursor) {
        liste.innerHTML = '<div class="leer"><div class="gross">👆</div>' + th('liste.klick') + '</div>';
        return;
      }
      eintraege = eintraege.filter(function (e) {
        if (!e.anker && !e.provisorisch) return false;
        var s = stelle(e);
        return e.provisorisch || (s.kapitel === S.cursor.kapitel && (!S.cursor.tab || !s.tab || s.tab === S.cursor.tab));
      }).sort(nachStelle);
      leerText = S.cursor.kapitel ? th('liste.leerHier', { kapitel: S.cursor.kapitel }) : th('liste.leerStelle');
    } else {
      eintraege.sort(function (a, b) { return String(b.erstellt).localeCompare(String(a.erstellt)); });
      leerText = th('liste.leer');
    }
    if (S.suche) {
      var q = S.suche.toLowerCase();
      eintraege = eintraege.filter(function (e) {
        return (e.name + ' ' + e.text + ' ' + (e.aliase || []).join(' ') + ' ' + e.kapitel).toLowerCase().indexOf(q) >= 0;
      });
      leerText = th('liste.nichts', { q: S.suche });
    }
    if (!eintraege.length) {
      liste.innerHTML = '<div class="leer"><div class="gross">🗒️</div>' + leerText + '</div>';
      return;
    }
    liste.innerHTML = eintraege.map(notizHtml).join('');
    $$('textarea[data-auto]', liste).forEach(autoHoehe);
  }

  function bearbeitenHtml(e) {
    return '<textarea data-auto data-bearbeiten="' + h(e.id) + '">' + h(alsEingabe(e)) + '</textarea>' +
      '<div class="ki-leiste"><button class="knopf primaer klein" data-aktion="bearbeiten-ok" data-id="' + h(e.id) + '">' + th('fertig') + '</button>' +
      '<button class="knopf klein" data-aktion="bearbeiten-abbruch">' + th('abbrechen') + '</button></div>';
  }

  function notizHtml(e) {
    var a = art(e.art);
    var hier = S.cursor && S.filter === 'hier' && stelle(e).pos != null && Math.floor(stelle(e).pos) === S.cursor.pos;
    // Mit Namen reicht das Symbol als Art-Kennzeichen – so bleibt Platz für den Namen.
    var kopf = '<span title="' + h(a.name) + '">' + a.icon + '</span>' + (e.name ? '' : '<span class="art">' + h(a.name) + '</span>');
    if (istKarte(e)) {
      kopf += '<button class="ref titel" data-id="' + h(e.id) + '" style="--c:' + a.farbe + '">' + h(e.name) + '</button>';
    } else if (e.name) {
      kopf += '<span class="titel" style="color:' + a.farbe + '">' + h(e.name) + '</span>';
    }
    if (e.art === 'idee' && e.status && e.status !== 'offen') kopf += '<span>· ' + th('idee.status.' + e.status) + '</span>';
    var inhalt;
    if (S.bearbeiten === e.id) {
      inhalt = bearbeitenHtml(e);
    } else {
      var text = istKarte(e) ? C.ausschnitt(e.text, 160) : e.text;
      inhalt = '<div class="notiz-text">' + (text ? textHtml(text) : '<span style="color:var(--text-3)">–</span>') + '</div>';
    }
    return '<div class="notiz' + (hier ? ' hier' : '') + (e.provisorisch ? ' provisorisch' : '') + '" style="' + stilFarbe(a) + '" data-eintrag="' + h(e.id) + '">' +
      '<div class="notiz-kopf">' + kopf + '<span class="rechts">' + stelleKnopf(e) +
      '<button class="mini" data-menue="' + h(e.id) + '" title="' + th('mehr') + '">⋯</button></span></div>' + inhalt + '</div>';
  }

  /** So sieht ein Eintrag als Eingabetext aus (zum Bearbeiten). */
  function alsEingabe(e) {
    if (e.art === 'notiz') return e.text;
    return erstesWort(e.art) + (e.name ? ' ' + e.name : '') + ': ' + e.text;
  }

  function notizMenue(id, knopf) {
    var e = eintrag(id);
    if (!e) return;
    var r = knopf.getBoundingClientRect();
    var optionen = [];
    if (istKarte(e)) optionen.push({ html: th('menue.karte'), tun: function () { oeffneKarte(id); } });
    else optionen.push({ html: th('menue.bearbeiten'), tun: function () { S.bearbeiten = id; render(); var ta = $('[data-bearbeiten]'); if (ta) { ta.focus(); ta.selectionStart = ta.value.length; } } });
    if (e.anker) {
      optionen.push({ html: th('menue.stelle'), tun: function () { springe(e); } });
      optionen.push({ html: th('pin.neu'), tun: function () { anheften(e); } });
      optionen.push({ html: th('pin.loesen'), tun: function () { loesen(e); } });
    } else if (!e.provisorisch) {
      optionen.push({ html: '📌 ' + th('pin.heften'), tun: function () { anheften(e); } });
    }
    if (e.art === 'notiz') {
      optionen.push({ html: th('menue.pinnwand'), tun: function () { e.art = 'idee'; e.status = 'offen'; speichere(e).then(render); render(); } });
    }
    if (e.art === 'zeit' && S.ansicht === 'zeit' && !S.zeitKi) {
      optionen.push({ html: th('zeit.frueher'), tun: function () { zeitSchritt(id, -1); } });
      optionen.push({ html: th('zeit.spaeter'), tun: function () { zeitSchritt(id, 1); } });
      optionen.push({ html: th(e.status === 'abschnitt' ? 'zeit.alsEreignis' : 'zeit.alsAbschnitt'), tun: function () {
        e.status = e.status === 'abschnitt' ? '' : 'abschnitt';
        speichere(e).then(render);
        render();
      } });
      optionen.push({ html: '⤢ ' + th('zeit.fenster'), tun: zeitFenster });
    }
    optionen.push({ html: gefahr(t('menue.loeschen')), tun: function () {
      loesche(e, istKarte(e) ? t('loeschen.frage', { name: e.name }) : null);
    } });
    auswahlMenue(r.right - 180, r.bottom + 2, null, optionen);
  }

  function bearbeitenFertig(id) {
    var e = eintrag(id);
    var ta = $('[data-bearbeiten="' + id + '"]');
    if (!e || !ta) return;
    var p = C.parseNotiz(ta.value, C.alleArten(S.einst));
    if (art(p.art).karte) {
      // Aus einer Notiz wird hier keine Karte – der Text bleibt, wie er ist.
      p = { art: e.art === 'notiz' ? 'notiz' : e.art, name: e.art === 'notiz' ? '' : e.name, text: ta.value.trim() };
    }
    var vorher = verweiseVon(e);
    e.art = p.art;
    e.name = p.name;
    e.text = p.text;
    if (e.art === 'idee' && !e.status) e.status = 'offen';
    S.bearbeiten = null;
    blaetterVormerken(vorher);
    speichere(e).then(render);
    render();
  }

  /* Eingabefeld: Vorschau, Vorschläge, Speichern */

  function vorbereitenEingabe() {
    var ta = $('#neu');
    var entwurf = merke('entwurf');
    if (entwurf) ta.value = entwurf;
    autoHoehe(ta);
    aktualisiereVorschau();
    ta.addEventListener('input', function () {
      autoHoehe(ta);
      merke('entwurf', ta.value);
      aktualisiereVorschau();
      aktualisiereVorschlaege();
    });
    ta.addEventListener('keydown', tastenImEingabefeld);
    ta.addEventListener('blur', function () { setTimeout(function () { $('#vorschlaege') && ($('#vorschlaege').hidden = true); }, 150); });
    ta.addEventListener('click', aktualisiereVorschlaege);
    $('#speichern').onclick = speichereNeu;
    $('#pin').onclick = function () {
      S.einst.anheften = !S.einst.anheften;
      this.classList.toggle('an', S.einst.anheften);
      aktualisiereVorschau();
      speichereEinstellungen();
      toast(t(S.einst.anheften ? 'pin.an' : 'pin.aus'));
    };
    $('#suche').addEventListener('input', function () {
      S.suche = this.value.trim();
      renderNotizListe();
    });
  }

  function aktualisiereVorschau() {
    var ta = $('#neu'), el = $('#vorschau');
    if (!ta || !el) return;
    var text = ta.value;
    $('#speichern').disabled = !text.trim();
    if (!text.trim()) {
      el.innerHTML = S.cursor && S.einst.anheften && S.cursor.kapitel
        ? th('vorschau.angeheftet', { kapitel: '' }) + '<b>' + h(C.ausschnitt(S.cursor.kapitel, 26)) + '</b>'
        : '<span>' + th('vorschau.tipp') + '</span>';
      return;
    }
    var p = C.parseNotiz(text, C.alleArten(S.einst));
    var a = art(p.art);
    var html;
    if (a.karte) {
      if (!p.name) html = a.icon + ' ' + h(a.name) + ' – <b>' + th('vorschau.nameFehlt') + '</b>';
      else {
        var da = finde(p.art, p.name);
        html = da
          ? th('vorschau.notizZu') + ' ' + a.icon + ' <b>' + h(da.name) + '</b>'
          : a.icon + ' ' + th('vorschau.neueKarte') + ' <b>' + h(p.name) + '</b>';
      }
    } else if (p.art === 'zeit') {
      html = th('vorschau.ereignis') + ' <b>' + h(p.name) + '</b>' +
        (C.parseDatum(p.name, D.jahr) == null ? ' <span title="' + th('vorschau.datum.titel') + '">' + th('vorschau.datum') + '</span>' : '');
    } else if (p.art === 'idee') {
      html = th('vorschau.idee');
    } else if (a.id !== 'notiz') {
      html = a.icon + ' ' + h(a.name);
    } else {
      var namen = [];
      C.findeVerweise(text, D.index).forEach(function (v) {
        var n = v.neu ? '@' + v.text + ' ' + t('vorschau.neu') : eintrag(v.ids[0]).name;
        if (namen.indexOf(n) < 0) namen.push(n);
      });
      html = th('vorschau.notiz') + (namen.length ? ' ' + th('vorschau.zu') + ' <b>' + h(namen.slice(0, 3).join(', ')) + '</b>' + (namen.length > 3 ? ' …' : '') : '');
    }
    el.innerHTML = html;
  }

  var vorschlagListe = [], vorschlagAktiv = 0;

  function aktualisiereVorschlaege() {
    var ta = $('#neu'), box = $('#vorschlaege');
    if (!ta || !box) return;
    var vor = ta.value.slice(0, ta.selectionStart);
    vorschlagListe = [];
    var m = vor.match(/(^|[^\p{L}\p{N}_])@([\p{L}\p{N}_\-]*(?: [\p{L}\p{N}_\-]*)?)$/u);
    var m2 = vor.match(/^\s*#?([\p{L}]{1,14})$/u);
    var m3 = vor.match(/^\s*#?([\p{L}]+)\s+([^:\n]{0,40})$/u);
    if (m) {
      var q = m[2].toLowerCase();
      karten().forEach(function (e) {
        var namen = [e.name].concat(e.aliase || []);
        var treffer = namen.filter(function (n) { return n.toLowerCase().indexOf(q) === 0; })[0] ||
          (q.length > 1 ? namen.filter(function (n) { return n.toLowerCase().indexOf(q) > 0; })[0] : null);
        if (treffer !== undefined && treffer !== null) {
          vorschlagListe.push({
            html: art(e.art).icon + ' ' + h(e.name) + (treffer !== e.name ? ' <small>' + h(treffer) + '</small>' : '<small>' + h(art(e.art).name) + '</small>'),
            einfuegen: function () { ersetzeVorCursor(m[2].length + 1, '@' + e.name + ' '); }
          });
        }
      });
    } else if (m2 && ta.value.trim() === vor.trim()) {
      var w = m2[1].toLowerCase();
      C.alleArten(S.einst).forEach(function (a) {
        (a.woerter || []).forEach(function (wort) {
          if (wort.toLowerCase().indexOf(w) === 0 && wort.toLowerCase() !== w) {
            vorschlagListe.push({
              html: a.icon + ' <b>' + h(wort) + '</b> <small>' + (a.karte ? th('vorschlag.neueKarte') : h(a.name)) + '</small>',
              einfuegen: function () { ersetzeVorCursor(vor.length, wort + (a.karte || a.id === 'zeit' ? ' ' : ': ')); }
            });
          }
        });
      });
    } else if (m3) {
      var a3 = C.alleArten(S.einst).filter(function (a) {
        return a.karte && (a.woerter || []).some(function (x) { return x.toLowerCase() === m3[1].toLowerCase(); });
      })[0];
      if (a3) {
        var q3 = m3[2].toLowerCase();
        karten().filter(function (e) { return e.art === a3.id && e.name.toLowerCase().indexOf(q3) === 0 && e.name.toLowerCase() !== q3.trim(); })
          .forEach(function (e) {
            vorschlagListe.push({
              html: a3.icon + ' ' + h(e.name) + ' <small>' + th('vorschlag.notizDazu') + '</small>',
              einfuegen: function () { ersetzeVorCursor(m3[2].length, e.name + ': '); }
            });
          });
      }
    }
    vorschlagListe = vorschlagListe.slice(0, 6);
    vorschlagAktiv = 0;
    if (!vorschlagListe.length) {
      box.hidden = true;
      return;
    }
    box.innerHTML = vorschlagListe.map(function (v, i) {
      return '<button class="vorschlag' + (i === 0 ? ' aktiv' : '') + '" data-v="' + i + '">' + v.html + '</button>';
    }).join('');
    box.style.top = (ta.offsetHeight + 2) + 'px';
    box.hidden = false;
    box.onmousedown = function (ev) {
      var b = ev.target.closest('[data-v]');
      if (!b) return;
      ev.preventDefault();
      vorschlagListe[Number(b.dataset.v)].einfuegen();
    };
  }

  function ersetzeVorCursor(laenge, neu) {
    var ta = $('#neu');
    var pos = ta.selectionStart;
    ta.value = ta.value.slice(0, pos - laenge) + neu + ta.value.slice(pos);
    var cur = pos - laenge + neu.length;
    ta.setSelectionRange(cur, cur);
    ta.focus();
    ta.dispatchEvent(new Event('input'));
    $('#vorschlaege').hidden = true;
  }

  function tastenImEingabefeld(ev) {
    var box = $('#vorschlaege');
    var offen = box && !box.hidden && vorschlagListe.length;
    if (offen && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) {
      ev.preventDefault();
      vorschlagAktiv = (vorschlagAktiv + (ev.key === 'ArrowDown' ? 1 : -1) + vorschlagListe.length) % vorschlagListe.length;
      $$('.vorschlag', box).forEach(function (b, i) { b.classList.toggle('aktiv', i === vorschlagAktiv); });
      return;
    }
    if (offen && (ev.key === 'Tab' || (ev.key === 'Enter' && !ev.shiftKey))) {
      ev.preventDefault();
      vorschlagListe[vorschlagAktiv].einfuegen();
      return;
    }
    if (offen && ev.key === 'Escape') {
      box.hidden = true;
      return;
    }
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      speichereNeu();
    }
  }

  function speichereNeu() {
    var ta = $('#neu');
    var text = ta.value;
    if (!text.trim()) return;
    var p = C.parseNotiz(text, C.alleArten(S.einst));
    var a = art(p.art);
    var neu, nachher = null;
    if (a.karte) {
      if (!p.name) {
        toast(t('name.angeben', { wort: erstesWort(a.id) }));
        return;
      }
      var da = finde(p.art, p.name);
      if (da && !p.text) {
        leereEingabe();
        oeffneKarte(da.id);
        return;
      }
      if (da) {
        neu = { art: 'notiz', text: p.text, bezug: [da.id] };
      } else {
        neu = { art: p.art, name: p.name, text: p.text, aliase: [], felder: {} };
        nachher = function (e) {
          toast(t('angelegt', { icon: a.icon, name: e.name }), { aktion: t('karte.oeffnen'), beiAktion: function () { oeffneKarte(e.id); } });
        };
      }
    } else if (p.art === 'idee') {
      neu = { art: 'idee', name: p.name, text: p.text, status: 'offen' };
    } else {
      neu = { art: p.art, name: p.name, text: p.text };
    }
    leereEingabe();
    if (S.filter === 'hier' && !S.einst.anheften) S.filter = 'alle';
    speichere(neu, { anheften: S.einst.anheften }).then(function (e) {
      render();
      if (nachher) nachher(e);
      else frageNachUnbekannten(e);
    }, function () {
      ta.value = text;
      aktualisiereVorschau();
    });
    render();
  }

  function leereEingabe() {
    var ta = $('#neu');
    ta.value = '';
    merke('entwurf', '');
    autoHoehe(ta);
    aktualisiereVorschau();
    $('#vorschlaege').hidden = true;
  }

  function frageNachUnbekannten(e) {
    var neu = C.findeVerweise(e.text, D.index).filter(function (v) { return v.neu; });
    if (!neu.length) return;
    toast(t('unbekannt', { name: neu[0].text }), {
      aktion: t('unbekannt.anlegen'), dauer: 7000,
      beiAktion: function () { neuAnlegenMenue(neu[0].text, window.innerWidth / 2 - 90, window.innerHeight - 200); }
    });
  }

  function neuAnlegenMenue(name, x, y) {
    var optionen = S.einst.arten.filter(function (a) { return a.karte; }).map(function (a) {
      return {
        html: a.icon + ' ' + th('anlegen.als', { art: a.name }),
        tun: function () {

  /** Das große Fenster hat etwas gespeichert: die Steckbriefe dieser Einträge neu holen. */
  function fensterAbgleich(stand) {
    if (!stand || stand.zeit === S.fensterZeit) return;
    S.fensterZeit = stand.zeit;
    if (stand.oben) {
      S.einst.arten.forEach(function (x) { if (stand.oben[x.id]) x.oben = stand.oben[x.id]; });
      berechne();
    }
    var ids = stand.ids || [];
    rufe('bwEintraegeLesen', ids).then(function (liste) {
      var gelesen = {};
      liste.forEach(function (neu) {
        gelesen[neu.id] = true;
        var e = eintrag(neu.id);
        if (!e) { S.eintraege.push(neu); berechne(); return; } // im Fenster neu angelegt
        var vorher = verweiseVon(e);
        Object.keys(neu).forEach(function (k) { e[k] = neu[k]; });
        berechne();
        blaetterVormerken(vorher.concat(verweiseVon(e)));

      // Im Fenster gelöscht
      var weg = ids.filter(function (id) { return !gelesen[id] && eintrag(id); });
      if (weg.length) {
        S.eintraege = S.eintraege.filter(function (x) { return weg.indexOf(x.id) < 0; });

  function bildWaehlen(e) {

    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = function () {
      var datei = input.files && input.files[0];
      if (!datei) return;
      var leser = new FileReader();
      leser.onload = function () { bildSpeichern(e.id, leser.result); };
      leser.readAsDataURL(datei);
    };
    input.click();

  /** Lädt ein Bild und liefert ein Canvas mit höchstens max Pixeln Kantenlänge (quadratisch = Mitte ausschneiden). */
  function bildAufCanvas(src, max, quadratisch) {
    return new Promise(function (ok, fehler) {
      var img = new Image();
      img.onload = function () {
        var sx = 0, sy = 0, sb = img.naturalWidth, sh = img.naturalHeight;
        if (quadratisch) {
          var k = Math.min(sb, sh);
          // Bei Hochformat eher oben ausschneiden – dort ist meist das Gesicht.
          sx = (sb - k) / 2; sy = sh > sb ? (sh - k) * 0.2 : (sh - k) / 2; sb = sh = k;
        }
        var f = Math.min(1, max / Math.max(sb, sh));
        var c = document.createElement('canvas');
        c.width = Math.round(sb * f); c.height = Math.round(sh * f);
        var g = c.getContext('2d');
        g.fillStyle = '#fff';
        g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, sx, sy, sb, sh, 0, 0, c.width, c.height);
        ok(c);
      };
      img.onerror = function () { fehler(new Error(t('bild.ungueltig'))); };
      img.src = src;
    });
  }

  function bildSpeichern(id, src) {
    var e = eintrag(id);
    if (!e) return;
    var vorher = S.bilder[id];
    Promise.all([bildAufCanvas(src, 256, true), bildAufCanvas(src, 1600, false)]).then(function (c) {
      var klein = c[0].toDataURL('image/jpeg', 0.85);
      // Eine Tabellenzelle fasst nur 50.000 Zeichen.
      for (var q = 0.75; klein.length > 48000 && q > 0.3; q -= 0.15) klein = c[0].toDataURL('image/jpeg', q);
      var gross = c[1].toDataURL('image/jpeg', 0.88).split(',')[1];
      S.bilder[id] = klein;
      render();
      return sichere('bwBildSetzen', id, { klein: klein, gross: gross, name: e.name }).then(function () {
        blaetterVormerken([id]);
        toast(t('bild.gespeichert'));
      }, function () {
        if (vorher) S.bilder[id] = vorher; else delete S.bilder[id];
        render();
      });
    }, function (err) { toast(fehlertext(err), { fehler: true }); });
  }

  function bildEntfernen(e) {
    var vorher = S.bilder[e.id];
    delete S.bilder[e.id];
    render();
    sichere('bwBildEntfernen', e.id).then(function () { blaetterVormerken([e.id]); }, function () { S.bilder[e.id] = vorher; render(); });
  }

  function bildErzeugen() {
    var v = S.bildKi, e = eintrag(v.id);
    if (!e || v.laeuft) return;
    var hinweis = $('#bild-hinweis');
    v.hinweis = hinweis ? hinweis.value.trim() : '';
    v.laeuft = true;
    render();
    rufe('bwKiBild', { artId: e.art, art: art(e.art).name, name: e.name, felder: e.felder || {}, text: e.text, stil: v.stil, hinweis: v.hinweis })
      .then(function (bild) {
        v.laeuft = false;
        v.vorschlag = bild;
        if (S.bildKi === v) render();
      }, function (err) {
        v.laeuft = false;
        if (S.bildKi === v) render();
        toast(fehlertext(err), { fehler: true });
      });
  }

  function bildKiHtml(e) {
    var v = S.bildKi;
    var stile = ['illustration', 'foto', 'skizze'].map(function (s) {
      return '<button class="knopf klein' + (v.stil === s ? ' primaer' : '') + '" data-aktion="bild-stil" data-stil="' + s + '"' + (v.laeuft ? ' disabled' : '') + '>' + th('bild.stil.' + s) + '</button>';
    }).join('');
    return '<div class="vorschlag-box bild-ki"><h4>' + th('bild.ki.titel', { name: e.name }) + '</h4>' +
      '<div class="ki-leiste" style="margin-top:0">' + stile + '</div>' +
      '<input id="bild-hinweis" class="bild-hinweis" value="' + h(v.hinweis || '') + '" placeholder="' + th('bild.hinweis') + '"' + (v.laeuft ? ' disabled' : '') + '>' +
      (v.laeuft ? '<div class="bild-vorschau"><div class="kreisel"></div><small>' + th('bild.malt') + '</small></div>'
        : v.vorschlag ? '<div class="bild-vorschau"><img src="data:' + h(v.vorschlag.mime) + ';base64,' + v.vorschlag.daten + '" alt=""></div>' : '') +
      '<div class="ki-leiste">' +
      (v.vorschlag && !v.laeuft ? '<button class="knopf primaer klein" data-aktion="bild-nehmen">' + th('bild.nehmen') + '</button>' : '') +
      '<button class="knopf ki klein" data-aktion="bild-erzeugen"' + (v.laeuft ? ' disabled' : '') + '>' + th(v.vorschlag ? 'bild.nochmal' : 'bild.erzeugen') + '</button>' +
      '<button class="knopf klein" data-aktion="bild-ki-zu">' + th('abbrechen') + '</button></div>' +
      '<div class="unter">' + th('bild.ki.info') + '</div></div>';
  }

  function kiVorschlagHtml(e) {
    var v = S.kiVorschlag;
    if (v.laedt) return '<div class="vorschlag-box"><h4>' + th('ki.liest', { name: e.name }) + '</h4><div class="kreisel"></div></div>';
    var zeilen = '';
    Object.keys(v.felder).forEach(function (f) {
      var neu = v.felder[f], alt = (e.felder || {})[f] || '';
      if (!neu || neu === alt) return;
      zeilen += '<label class="vorschlag-feld"><input type="checkbox" data-vf="' + h(f) + '" checked><span><b>' + h(f) + '</b><br>' +
        (alt ? '<span class="alt">' + h(alt) + '</span><br>' : '') + h(neu) + '</span></label>';
    });
    (v.aliase || []).filter(function (x) {
      return x && x !== e.name && (e.aliase || []).indexOf(x) < 0;
    }).forEach(function (x) {
      zeilen += '<label class="vorschlag-feld"><input type="checkbox" data-va="' + h(x) + '" checked><span><b>' + th('ki.auchGenannt') + '</b><br>' + h(x) + '</span></label>';
    });
    (v.beziehungen || []).forEach(function (b, i) {
      var ziel = finde(null, b.name);
      if (!ziel || ziel.id === e.id) return;
      var schonDa = S.beziehungen.some(function (x) { return x.von === e.id && x.nach === ziel.id; });
      if (schonDa) return;
      zeilen += '<label class="vorschlag-feld"><input type="checkbox" data-vb="' + i + '" checked><span><b>' + th('ki.beziehung') + '</b><br>' + h(b.art) + ' ' + art(ziel.art).icon + ' ' + h(ziel.name) + '</span></label>';
    });
    if (!zeilen) {
      return '<div class="vorschlag-box"><h4>' + th('ki.nichtsNeu') + '</h4><div class="unter">' + th('ki.passt') + '</div>' +
        '<div class="ki-leiste"><button class="knopf klein" data-aktion="ki-zu">' + th('ok') + '</button></div></div>';
    }
    return '<div class="vorschlag-box"><h4>' + th('ki.vorschlag') + '</h4><div class="unter" style="margin-top:0">' + th('ki.haken') + '</div>' + zeilen +
      '<div class="ki-leiste"><button class="knopf primaer klein" data-aktion="ki-uebernehmen">' + th('ki.uebernehmen') + '</button><button class="knopf klein" data-aktion="ki-zu">' + th('ki.verwerfen') + '</button></div></div>';
  }

  function kiBefundeHtml() {
    var b = S.kiBefunde;
    if (b.laedt) return '<div class="vorschlag-box"><h4>' + th('ki.prueft') + '</h4><div class="kreisel"></div></div>';
    if (!b.befunde.length) {
      return '<div class="vorschlag-box"><h4>' + th('ki.stimmig') + '</h4><div class="unter">' + th('ki.keine') + '</div><div class="ki-leiste"><button class="knopf klein" data-aktion="ki-zu">' + th('ok') + '</button></div></div>';
    }
    return '<div class="vorschlag-box"><h4>' + th('ki.aufgefallen') + '</h4>' + b.befunde.map(function (x) {
      return '<div class="befund">' + (x.art === 'widerspruch' ? '⚠️ ' : '💬 ') + h(x.text) +
        (x.belege || []).map(function (q) { return '<q>' + h(q) + '</q>'; }).join('') + '</div>';
    }).join('') + '<div class="ki-leiste"><button class="knopf klein" data-aktion="ki-zu">' + th('schliessen') + '</button></div></div>';
  }

  /** Änderungen auf der Karte sofort speichern. */
  function karteFeldGeaendert(el) {
    var e = eintrag(S.karteId);
    if (!e) return;
    var vorher = verweiseVon(e);
    if (el.dataset.feld === 'name') {
      var neu = el.value.trim();
      if (!neu) { el.value = e.name; return; }
      if (neu === e.name) return;
      // Der alte Name bleibt als „Auch genannt“, damit bestehende Notizen verlinkt bleiben.
      if ((e.aliase || []).indexOf(e.name) < 0) e.aliase = (e.aliase || []).concat([e.name]);
      e.name = neu;
      blaetterVormerken(D.graph.rein[e.id] || []);
    } else if (el.dataset.feld === 'aliase') {
      e.aliase = el.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    } else if (el.dataset.steckbrief) {
      e.felder = Object.assign({}, e.felder);
      e.felder[el.dataset.steckbrief] = el.value.trim();
    } else if (el.dataset.freitext) {
      e.text = el.value.trim();
    } else {
      return;
    }
    blaetterVormerken(vorher);
    speichere(e).then(function () {
      if (el.dataset.feld) {
        var al = $('[data-feld="aliase"]');
        if (al && document.activeElement !== al) al.value = (e.aliase || []).join(', ');
      }
    });
  }

  function freitextBearbeiten(box) {
    var e = eintrag(S.karteId);
    var ta = document.createElement('textarea');
    ta.className = 'freitext';
    ta.dataset.freitext = '1';
    ta.value = e.text || '';
    ta.placeholder = t('karte.freitextPlatz');
    box.replaceWith(ta);
    autoHoehe(ta);
    ta.focus();
    ta.addEventListener('input', function () { autoHoehe(ta); });
    ta.addEventListener('blur', function () {
      karteFeldGeaendert(ta);
      render();
    });
  }

  function kiFelder() {
    var e = eintrag(S.karteId);
    if (!kiBereit()) return;
    var a = art(e.art);
    var felder = [], fragen = {};
    C.steckbrief(a.felder, e.felder).forEach(function (g) {
      g.felder.forEach(function (f) {
        felder.push(f.name);
        if (f.frage) fragen[f.name] = f.frage;
      });
    });
    if (!felder.length) { toast(t('ki.keineFelder')); return; }
    S.kiVorschlag = { id: e.id, laedt: true };
    render();
    rufe('bwKiFelder', {
      art: a.name, name: e.name, felder: felder, fragen: fragen, vorhanden: e.felder || {}, text: e.text,
      notizen: notizenZu(e.id).concat(ereignisseZu(e.id)).map(function (n) { return (n.name ? n.name + ': ' : '') + n.text; }),
      namen: karten().filter(function (k) { return k.id !== e.id; }).map(function (k) { return k.name; })
    }).then(function (v) {
      v.id = e.id;
      S.kiVorschlag = v;
      if (S.karteId === e.id) render();
    }, function (err) {
      S.kiVorschlag = null;
      render();
      toast(fehlertext(err), { fehler: true });
    });
  }

  function kiUebernehmen() {
    var e = eintrag(S.karteId), v = S.kiVorschlag;
    var vorher = verweiseVon(e);
    e.felder = Object.assign({}, e.felder);
    $$('[data-vf]').forEach(function (c) { if (c.checked) e.felder[c.dataset.vf] = v.felder[c.dataset.vf]; });
    $$('[data-va]').forEach(function (c) { if (c.checked) e.aliase = (e.aliase || []).concat([c.dataset.va]); });
    $$('[data-vb]').forEach(function (c) {
      if (!c.checked) return;
      var b = v.beziehungen[Number(c.dataset.vb)];
      var ziel = finde(null, b.name);
      if (ziel) neueBeziehung(e.id, ziel.id, b.art);
    });
    S.kiVorschlag = null;
    blaetterVormerken(vorher);
    speichere(e).then(render);
    render();
    toast(t('ki.uebernommen'));
  }

  function kiPruefen() {
    var e = eintrag(S.karteId);
    if (!kiBereit()) return;
    S.kiBefunde = { id: e.id, laedt: true };
    render();
    rufe('bwKiPruefen', {
      art: art(e.art).name, name: e.name, text: e.text, felder: e.felder || {},
      notizen: notizenZu(e.id).map(function (n) { return { kapitel: stelle(n).kapitel, text: n.text }; }),
      ereignisse: ereignisseZu(e.id).map(function (z) { return { datum: z.name, text: z.text }; })
    }).then(function (r) {
      S.kiBefunde = { id: e.id, befunde: r.befunde || [] };
      if (S.karteId === e.id) render();
    }, function (err) {
      S.kiBefunde = null;
      render();
      toast(fehlertext(err), { fehler: true });
    });
  }

  function kiBereit() {
    if (S.ki.aktiv) return true;
    toast(t('ki.fehltKey'), { aktion: t('ki.einrichten'), beiAktion: function () { geheZu('einstellungen'); setTimeout(function () { var k = $('#ki-key'); if (k) { k.scrollIntoView(); k.focus(); } }, 50); } });
    return false;
  }

  function neueBeziehung(von, nach, artText) {
    var b = { id: 'tmp' + (++tmpZaehler), von: von, nach: nach, art: artText };
    S.beziehungen.push(b);
    berechne();
    sichere('bwBeziehungSpeichern', b).then(function (g) {
      b.id = g.id;
      blaetterVormerken([von, nach]);
    });
  }

  function vorkommen() {
    var e = eintrag(S.karteId);
    S.vorkommen = { id: e.id, laedt: true };
    render();
    var begriffe = Object.keys(D.index.namen).filter(function (n) { return D.index.namen[n].ids.indexOf(e.id) >= 0; });
    sichere('bwVorkommen', begriffe).then(function (liste) {
      S.vorkommen = { id: e.id, liste: liste, offen: liste.length === 1 ? { 0: true } : {}, aktiv: {} };
      if (S.karteId === e.id) render();
    }, function () { S.vorkommen = null; render(); });
  }

  /* -------------------------------------------------------------- */
  /* Ansicht: Zeitstrahl                                             */
  /* -------------------------------------------------------------- */

  function ereignisHtml(z) {
    return '<div class="ereignis"><div class="notiz" style="--c:' + art('zeit').farbe + '" data-eintrag="' + h(z.id) + '">' +
      '<div class="notiz-kopf"><span class="datum">' + h(z.name || t('zeit.ohneDatum')) + '</span><span class="rechts">' + stelleKnopf(z) +
      '<button class="mini" data-menue="' + h(z.id) + '" title="' + th('mehr') + '">⋯</button></span></div>' +
      (S.bearbeiten === z.id ? bearbeitenHtml(z) : '<div class="notiz-text">' + textHtml(z.text) + '</div>') + '</div></div>';
  }

  /** Ein Zeitabschnitt („Vor dem Krieg“) – eine Überschrift im Zeitstrahl. */
  function abschnittHtml(z) {
    if (S.bearbeiten === z.id) return '<div class="notiz">' + bearbeitenHtml(z) + '</div>';
    return '<div class="abschnitt" data-eintrag="' + h(z.id) + '"><span>' + h(z.name || z.text || '…') + '</span>' +
      '<button class="mini" data-menue="' + h(z.id) + '" title="' + th('mehr') + '">⋯</button></div>';
  }

  /** Alle Ereignisse und Abschnitte in ihrer Reihenfolge (oder im Vorschlag der KI). */
  function zeitAlle() {
    var alle = C.zeitReihe(S.eintraege.filter(function (e) { return e.art === 'zeit'; }), D.jahr);
    if (!S.zeitKi) return alle;
    var nach = {};
    S.zeitKi.reihenfolge.forEach(function (id, i) { nach[id] = i; });
    return alle.slice().sort(function (a, b) { return (nach[a.id] != null ? nach[a.id] : 1e9) - (nach[b.id] != null ? nach[b.id] : 1e9); });
  }

  function renderZeit() {
    var alle = zeitAlle();
    var ereignisse = alle.filter(function (z) { return z.status !== 'abschnitt'; });
    var personen = {};
    ereignisse.forEach(function (z) { (D.graph.raus[z.id] || []).forEach(function (id) { personen[id] = true; }); });
    var auswahl = Object.keys(personen).map(eintrag).filter(Boolean).sort(function (a, b) { return a.name.localeCompare(b.name, I.locale()); });
    var gefiltert = S.zeitMit ? alle.filter(function (z) { return z.status === 'abschnitt' || (D.graph.raus[z.id] || []).indexOf(S.zeitMit) >= 0; }) : alle;
    var feld = 'border:1px solid var(--linie);border-radius:6px;padding:5px 7px;outline:0';
    var html = '<div class="eingabe" style="padding:8px;display:flex;gap:6px;flex-wrap:wrap">' +
      '<input id="z-datum" placeholder="' + th('zeit.wann') + '" style="flex:1 1 100px;' + feld + '">' +
      '<input id="z-text" placeholder="' + th('zeit.was') + '" style="flex:2 1 140px;' + feld + '">' +
      '<button class="knopf primaer klein" data-aktion="zeit-neu">＋</button></div>';
    if (ereignisse.length > 1 || alle.length > ereignisse.length) {
      html += '<div class="zeit-leiste"><button class="knopf klein" data-aktion="zeit-fenster" title="' + th('zeit.fenster.info') + '">⤢ ' + th('zeit.fenster') + '</button>' +
        (kiSichtbar() && ereignisse.length > 2 ? '<button class="knopf ki klein" data-aktion="zeit-ki"' + (S.zeitKiLaeuft ? ' disabled' : '') + ' title="' + th('zeit.ki.info') + '">' +
          (S.zeitKiLaeuft ? th('zeit.ki.laeuft') : th('zeit.ki')) + '</button>' : '') + '</div>';
    }
    if (S.zeitKi) html += zeitKiHtml(alle);
    if (auswahl.length) {
      html += '<div class="filter"><button class="chip' + (S.zeitMit ? '' : ' aktiv') + '" data-zeitmit="">' + th('filter.alle') + '</button>' +
        auswahl.map(function (k) {
          return '<button class="chip' + (S.zeitMit === k.id ? ' aktiv' : '') + '" data-zeitmit="' + h(k.id) + '">' + art(k.art).icon + ' ' + h(k.name) + '</button>';
        }).join('') + '</div>';
    }
    if (!gefiltert.length) {
      return html + '<div class="leer"><div class="gross">📅</div>' + th('zeit.leer') + '<br>' + th('zeit.tipp') + ' <b>' + th('zeit.beispiel', { wort: erstesWort('zeit') }) + '</b></div>';
    }
    var hinweise = {};
    if (S.zeitKi) S.zeitKi.hinweise.forEach(function (x) { hinweise[x.id] = x.text; });
    // Beim KI-Vorschlag wird nicht gezogen – erst übernehmen oder verwerfen.
    var ziehbar = !S.zeitKi;
    return html + '<div class="zeitstrahl ziehliste" data-liste="zeit" style="margin-top:10px">' + gefiltert.map(function (z) {
      var inhalt = z.status === 'abschnitt' ? abschnittHtml(z) : ereignisHtml(z);
      var neu = S.zeitKi && S.zeitKi.vorher[z.id] !== S.zeitKi.reihenfolge.indexOf(z.id);
      return '<div class="zieh' + (neu ? ' verschoben' : '') + '"' + (ziehbar && S.bearbeiten !== z.id ? ' draggable="true"' : '') + ' data-zieh="' + h(z.id) + '">' +
        (ziehbar ? '<span class="griff" title="' + th('zeit.ziehen') + '">⠿</span>' : '') + inhalt +
        (hinweise[z.id] ? '<div class="ki-hinweis">✨ ' + h(hinweise[z.id]) + '</div>' : '') + '</div>';
    }).join('') + '</div>' +
      (ziehbar && ereignisse.length > 1 && !S.zeitTippGesehen ? '<div class="unter" style="margin-top:8px">' + th('zeit.ordnenTipp') + '</div>' : '');
  }

  function zeitKiHtml(alle) {
    var n = alle.filter(function (z) { return S.zeitKi.vorher[z.id] !== S.zeitKi.reihenfolge.indexOf(z.id); }).length;
    return '<div class="vorschlag-box" style="margin-top:8px"><h4>' + th('ki.vorschlag') + '</h4>' +
      '<div class="unter" style="margin:0 0 6px">' + (n ? th('zeit.ki.verschoben', { n: n }) : th('zeit.ki.passt')) + '</div><div class="ki-leiste">' +
      (n ? '<button class="knopf primaer klein" data-aktion="zeit-ki-ja">' + th('ki.uebernehmen') + '</button>' : '') +
      '<button class="knopf klein" data-aktion="zeit-ki-nein">' + th(n ? 'ki.verwerfen' : 'schliessen') + '</button></div></div>';
  }

  function zeitKiFragen() {
    var alle = C.zeitReihe(S.eintraege.filter(function (e) { return e.art === 'zeit' && !e.provisorisch; }), D.jahr);
    S.zeitKiLaeuft = true;
    render();
    rufe('bwKiZeitOrdnen', alle.map(function (z) { return { id: z.id, datum: z.name, text: z.text, abschnitt: z.status === 'abschnitt' }; }))
      .then(function (v) {
        S.zeitKiLaeuft = false;
        var vorher = {};
        alle.forEach(function (z, i) { vorher[z.id] = i; });
        S.zeitKi = { reihenfolge: v.reihenfolge, hinweise: v.hinweise || [], vorher: vorher };
        S.zeitMit = null;
        render();
      }, function (err) {
        S.zeitKiLaeuft = false;
        render();
        toast(fehlertext(err), { fehler: true });
      });
  }

  /** Neue Reihenfolge merken: Positionen lokal setzen und alle auf einmal speichern. */
  function reihenfolgeSpeichern(ids) {
    ids.forEach(function (id, i) { var e = eintrag(id); if (e) e.reihe = String(i + 1); });
    render();
    return sichere('bwReihenfolgeSetzen', ids.filter(function (id) { return id.indexOf('tmp') !== 0; }));
  }

  /** Ereignis im Zeitstrahl verschieben: vor/hinter ein anderes oder einen Schritt (richtung ±1). */
  function zeitVerschieben(id, zielId, danach) {
    var ids = C.zeitReihe(S.eintraege.filter(function (e) { return e.art === 'zeit'; }), D.jahr).map(function (z) { return z.id; });
    S.zeitTippGesehen = true;
    reihenfolgeSpeichern(C.verschiebe(ids, id, zielId, danach));
  }

  function zeitSchritt(id, richtung) {
    // Im gefilterten Zeitstrahl: am nächsten sichtbaren Nachbarn vorbei.
    var sichtbar = $$('[data-liste="zeit"] [data-zieh]').map(function (x) { return x.dataset.zieh; });
    var i = sichtbar.indexOf(id), ziel = sichtbar[i + richtung];
    if (ziel) zeitVerschieben(id, ziel, richtung > 0);
  }

  /* -------------------------------------------------------------- */
  /* Ansicht: Pinnwand                                               */
  /* -------------------------------------------------------------- */

  function renderPinnwand() {
    var ideen = ideenReihe(S.eintraege.filter(function (e) { return e.art === 'idee'; }));
    var html = '<div class="eingabe" style="padding:8px;display:flex;gap:6px">' +
      '<input id="idee-text" placeholder="' + th('idee.neu') + '" style="flex:1;border:0;outline:0;padding:4px">' +
      '<button class="knopf primaer klein" data-aktion="idee-neu">＋</button></div>';
    [
      { id: 'offen', leer: t('idee.keineOffen') },
      { id: 'verwendet', leer: '' },
      { id: 'verworfen', leer: '' }
    ].forEach(function (s) {
      var liste = ideen.filter(function (e) { return (e.status || 'offen') === s.id; });
      if (!liste.length && !s.leer) return;
      html += '<div class="spalte ziehliste" data-liste="idee:' + s.id + '"><div class="gruppe-kopf" style="margin-top:12px">' + th('idee.' + s.id) + ' <span class="zahl">' + liste.length + '</span></div>' +
        (liste.length ? liste.map(function (e) {
          return '<div class="zieh"' + (S.bearbeiten === e.id ? '' : ' draggable="true"') + ' data-zieh="' + h(e.id) + '"><span class="griff" title="' + th('idee.ziehen') + '">⠿</span>' + ideeHtml(e) + '</div>';
        }).join('') : '<div class="unter">' + h(s.leer) + '</div>') + '</div>';
    });
    return html;
  }

  /** Von Hand geordnete Ideen in ihrer Reihenfolge; neue (noch ohne Position) obenauf, neueste zuerst. */
  function ideenReihe(liste) {
    var ohne = liste.filter(function (e) { return C.reihe(e) == null; })
      .sort(function (a, b) { return String(b.erstellt).localeCompare(String(a.erstellt)); });
    var mit = liste.filter(function (e) { return C.reihe(e) != null; })
      .sort(function (a, b) { return C.reihe(a) - C.reihe(b); });
    return ohne.concat(mit);
  }

  /** Idee in eine Spalte ziehen: Reihenfolge darin speichern, bei anderer Spalte auch den Status. */
  function ideeAblegen(id, status, zielId, danach) {
    var e = eintrag(id);
    if (!e) return;
    var ids = ideenReihe(S.eintraege.filter(function (x) { return x.art === 'idee' && (x.status || 'offen') === status && x !== e; }))
      .map(function (x) { return x.id; });
    var i = zielId ? ids.indexOf(zielId) : -1;
    ids.splice(i < 0 ? ids.length : (danach ? i + 1 : i), 0, id);
    var neuerStatus = (e.status || 'offen') !== status;
    reihenfolgeSpeichern(ids);
    if (neuerStatus) {
      e.status = status;
      speichere(e).then(render);
      render();
    }
  }

  /* Ziehen & Ablegen: Zeitstrahl und Pinnwand */

  var zieh = null;

  function ziehStart(ev) {
    var el = ev.target.closest && ev.target.closest('[data-zieh]');
    if (!el || !el.draggable) return;
    zieh = { id: el.dataset.zieh, liste: el.closest('[data-liste]').dataset.liste };
    ev.dataTransfer.effectAllowed = 'move';
    ev.dataTransfer.setData('text/plain', zieh.id);
    setTimeout(function () { el.classList.add('zieht'); }, 0);
  }

  /** Wohin würde abgelegt? { liste, zielId, danach } – oder null. */
  function ziehZiel(ev) {
    var liste = ev.target.closest && ev.target.closest('[data-liste]');
    if (!zieh || !liste) return null;
    var name = liste.dataset.liste;
    if (name.split(':')[0] !== zieh.liste.split(':')[0]) return null;
    var el = ev.target.closest('[data-zieh]');
    if (!el || el.dataset.zieh === zieh.id) return { liste: name, el: el, zielId: null, danach: true };
    var r = el.getBoundingClientRect();
    return { liste: name, el: el, zielId: el.dataset.zieh, danach: ev.clientY > r.top + r.height / 2 };
  }

  function ziehMarkierungWeg() {
    $$('.ziel-vor, .ziel-nach, .ziel-ende').forEach(function (x) { x.classList.remove('ziel-vor', 'ziel-nach', 'ziel-ende'); });
  }

  function ziehUeber(ev) {
    var z = ziehZiel(ev);
    if (!z) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'move';
    ziehMarkierungWeg();
    if (z.zielId) z.el.classList.add(z.danach ? 'ziel-nach' : 'ziel-vor');
    else if (!z.el) $('[data-liste="' + z.liste + '"]').classList.add('ziel-ende');
  }

  function ziehAblegen(ev) {
    var z = ziehZiel(ev);
    ziehMarkierungWeg();
    if (!z) return;
    ev.preventDefault();
    var id = zieh.id;
    zieh = null;
    if (z.liste === 'zeit') {
      if (z.zielId) zeitVerschieben(id, z.zielId, z.danach);
    } else if (z.zielId || !z.el) {
      ideeAblegen(id, z.liste.split(':')[1], z.zielId, z.danach);
    }
  }

  function ziehEnde() {
    zieh = null;
    ziehMarkierungWeg();
    $$('.zieht').forEach(function (x) { x.classList.remove('zieht'); });
  }

  function ideeHtml(e) {
    var status = e.status || 'offen';
    var knopf = function (neu, text) { return '<button class="knopf klein" data-status="' + neu + '" data-id="' + h(e.id) + '">' + th(text) + '</button>'; };
    var knoepfe = status === 'offen'
      ? knopf('verwendet', 'idee.knopf.verwendet') + knopf('verworfen', 'idee.knopf.verwerfen')
      : knopf('offen', 'idee.knopf.offen');
    return '<div class="idee' + (status === 'verworfen' ? ' verworfen' : '') + '" data-eintrag="' + h(e.id) + '">' +
      '<div class="notiz-kopf">' + (e.name ? '<span class="titel">' + h(e.name) + '</span>' : '') + '<span class="rechts">' + stelleKnopf(e) +
      '<button class="mini" data-menue="' + h(e.id) + '" title="' + th('mehr') + '">⋯</button></span></div>' +
      (S.bearbeiten === e.id ? bearbeitenHtml(e) : '<div class="notiz-text">' + textHtml(e.text) + '</div>') +
      '<div class="idee-fuss">' + knoepfe + '</div></div>';
  }

  /* -------------------------------------------------------------- */
  /* Ansicht: Ziel & Statistik                                       */
  /* -------------------------------------------------------------- */

  function ladeStatistik() {
    return rufe('bwStatistik').then(function (s) {
      S.stat = s;
      zeigeStatus();
      if (S.ansicht === 'ziel') render();
    }, function () {});
  }

  function datumKurz(iso) {
    try {
      return new Date(iso + 'T12:00:00').toLocaleDateString(I.locale(), { day: 'numeric', month: 'numeric' });
    } catch (err) {
      return iso;
    }
  }

  function heuteIso() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  /** Mit Buchziel und Zieldatum: der Plan (sonst null). */
  function schreibplan() {
    if (!S.stat || !S.einst) return null;
    return C.schreibplan({
      gesamtziel: S.einst.gesamtziel, zieldatum: S.einst.zieldatum, schreibtage: S.einst.schreibtage,
      heute: heuteIso(), woerterMorgen: S.stat.gesamt - S.stat.heute
    });
  }

  /** Das Tagesziel für heute – ausgerechnet, wenn es einen Plan gibt, sonst das eingetragene. */
  function tagesziel() {
    var p = schreibplan();
    if (p && !p.vorbei && !p.fertig) return p.heuteSchreibtag ? p.proTag : 0;
    return Number(S.einst.tagesziel) || 0;
  }

  function datumLang(iso) {
    try {
      return new Date(iso + 'T12:00:00').toLocaleDateString(I.locale(), { day: 'numeric', month: 'long', year: 'numeric' });
    } catch (err) {
      return iso;
    }
  }

  function renderZiel() {
    var s = S.stat, ziel = tagesziel(), gesamtziel = Number(S.einst.gesamtziel) || 0;
    if (!s) return '<div class="laden"><div class="kreisel"></div>' + th('ziel.zaehlt') + '</div>';
    var plan = schreibplan(), planAktiv = plan && !plan.vorbei && !plan.fertig;
    var anteil = ziel ? Math.min(1, s.heute / ziel) : 0;
    var u = 2 * Math.PI * 38;
    var ring = '<svg class="ring" viewBox="0 0 92 92"><circle cx="46" cy="46" r="38" fill="none" stroke="#e8eaed" stroke-width="9"/>' +
      '<circle cx="46" cy="46" r="38" fill="none" stroke="' + (anteil >= 1 ? '#34a853' : '#1a73e8') + '" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + (u * anteil) + ' ' + u + '" transform="rotate(-90 46 46)"/>' +
      '<text x="46" y="52" text-anchor="middle" font-size="17" font-weight="700" fill="#202124">' + Math.round(anteil * 100) + '%</text></svg>';
    var tage = s.verlauf.slice(-14);
    var max = Math.max(ziel, 1, Math.max.apply(null, tage.map(function (x) { return x.geschrieben; })));
    var serie = 0;
    for (var i = s.verlauf.length - 1; i >= 0; i--) {
      if (ziel && s.verlauf[i].geschrieben >= ziel) serie++;
      else if (i !== s.verlauf.length - 1) break;
    }
    var html = '<div class="block"><div class="block-titel">' + th('ziel.heute') + '</div><div class="ring-box">' + ring + '<div>' +
      '<div class="zahl-gross">' + I.zahl(s.heute) + '</div><div class="unter" style="margin:0">' + th('ziel.von', { n: I.zahl(ziel) }) + '</div>' +
      (anteil >= 1 ? '<div style="margin-top:4px">' + th('ziel.geschafft') + '</div>' : ziel ? '<div style="margin-top:4px;color:var(--text-2)">' + th('ziel.noch', { n: I.zahl(ziel - s.heute) }) + '</div>' : '') +
      (serie > 1 ? '<div style="margin-top:2px">' + th('ziel.serie', { n: serie }) + '</div>' : '') + '</div></div>' +
      (planAktiv && !plan.heuteSchreibtag ? '<div class="unter">' + th('ziel.freiTag') + '</div>' : '') + '</div>';
    html += '<div class="block"><div class="block-titel">' + th('ziel.letzte') + '<span class="rechts"><button class="link" data-aktion="statistik">↻</button></span></div><div class="balken">' +
      tage.map(function (x, j) {
        return '<div class="' + (ziel && x.geschrieben >= ziel ? 'erreicht' : '') + (j === tage.length - 1 ? ' heute' : '') + '" style="height:' + Math.max(2, x.geschrieben / max * 100) + '%" title="' + th('ziel.tag', { datum: datumKurz(x.datum), n: I.zahl(x.geschrieben) }) + '"></div>';
      }).join('') + '</div><div class="balken-achse"><span>' + (tage[0] ? h(datumKurz(tage[0].datum)) : '') + '</span><span>' + th('ziel.heuteAchse') + '</span></div></div>';
    html += '<div class="block"><div class="block-titel">' + th('ziel.manuskript') + '</div><div class="zahl-gross">' + I.zahl(s.gesamt) + ' <span style="font-size:13px;font-weight:400;color:var(--text-2)">' + th('ziel.woerter') + '</span></div>' +
      '<div class="unter" style="margin:0">' + th('ziel.seiten', { n: I.zahl(Math.round(s.gesamt / 250)) }) + '</div>' +
      (gesamtziel ? '<div class="fortschritt"><div style="width:' + Math.min(100, s.gesamt / gesamtziel * 100) + '%"></div></div><div class="unter">' + th('ziel.anteil', { p: Math.round(s.gesamt / gesamtziel * 100), n: I.zahl(gesamtziel) }) + '</div>' : '') + '</div>';
    var schreibtage = S.einst.schreibtage || [];
    // Montag zuerst; die Namen kommen aus der Sprache des Browsers/der Leiste.
    var wochentage = [1, 2, 3, 4, 5, 6, 0].map(function (n) {
      var name = new Date(Date.UTC(2026, 10, 1 + n)).toLocaleDateString(I.locale(), { weekday: 'short', timeZone: 'UTC' });
      return '<button class="tag-knopf' + (schreibtage.indexOf(n) >= 0 ? ' an' : '') + '" data-aktion="schreibtag" data-tag="' + n + '">' + h(name.replace(/\.$/, '')) + '</button>';
    }).join('');
    var planText = !plan ? th('ziel.planInfo')
      : plan.fertig ? th('ziel.buchFertig')
      : plan.vorbei ? th('ziel.vorbei')
      : th('ziel.plan', { n: I.zahl(plan.rest), tage: plan.tage, datum: datumLang(S.einst.zieldatum), pro: I.zahl(plan.proTag) });
    html += '<div class="block"><div class="block-titel">' + th('ziel.ziele') + '</div><div class="zielfelder">' +
      '<label for="z-ges">' + th('ziel.buch') + '</label><input id="z-ges" type="number" min="0" step="1000" data-ziel="gesamtziel" value="' + (gesamtziel || '') + '" placeholder="' + th('ziel.bsp') + '">' +
      '<label for="z-datum">' + th('ziel.datum') + '</label><input id="z-datum" type="date" data-ziel="zieldatum" value="' + h(S.einst.zieldatum || '') + '" min="' + heuteIso() + '">' +
      '</div><div class="einst-zeile"><label>' + th('ziel.tage') + '</label><div class="tage-wahl">' + wochentage + '</div></div>' +
      '<div class="zielfelder" style="margin-top:8px"><label for="z-tag">' + th('ziel.proTag') + '</label>' +
      (planAktiv
        ? '<span class="ausgerechnet" title="' + th('ziel.automatisch.titel') + '">' + I.zahl(plan.proTag) + '</span>'
        : '<input id="z-tag" type="number" min="0" step="50" data-ziel="tagesziel" value="' + (Number(S.einst.tagesziel) || 0) + '">') +
      '</div><div class="unter">' + planText + '</div></div>';
    return html;
  }

  /* -------------------------------------------------------------- */
