  function aktualisiereSpot() {
    var el = $('#spot');
    var c = S.cursor;
    if (!c || !c.text || !D.index) { el.hidden = true; return; }
    var verweise = C.findeVerweise(c.text, D.index).filter(function (v) { return !v.neu; });
    var amCursor = verweise.filter(function (v) { return c.offset >= v.start && c.offset <= v.ende; })[0];
    if (amCursor) {
      var e = eintrag(amCursor.ids[0]);
      var a = art(e.art);
      var felder = Object.keys(e.felder || {}).map(function (k) { return e.felder[k]; }).filter(Boolean);
      var info = felder.length ? felder.slice(0, 3).join(' · ') : C.ausschnitt(e.text, 80) || a.name;
      el.innerHTML = '<span class="spot-icon' + (S.bilder[e.id] ? ' mit-bild' : '') + '" style="' + stilFarbe(a) + '">' + (S.bilder[e.id] ? avatarHtml(e) : a.icon) + '</span><span class="spot-text"><div class="spot-name">' + h(e.name) + '</div><div class="spot-info">' + h(info) + '</div></span><span class="spot-pfeil">›</span>';
      el.dataset.id = e.id;
      el.title = t('karte.oeffnen');
      el.hidden = false;
      return;
    }
    var ids = [];
    verweise.forEach(function (v) { if (ids.indexOf(v.ids[0]) < 0) ids.push(v.ids[0]); });
    if (!ids.length) { el.hidden = true; return; }
    el.dataset.id = '';
    el.title = '';
    el.innerHTML = '<span style="font-size:11px;color:var(--text-3);white-space:nowrap">' + th('spot.absatz') + '</span><span class="verbunden" style="flex:1;min-width:0">' +
      ids.slice(0, 6).map(function (id) {
        var e = eintrag(id);
        return '<button class="ref" data-id="' + h(id) + '" style="--c:' + art(e.art).farbe + '">' + art(e.art).icon + ' ' + h(e.name) + '</button>';
      }).join('') + '</span>';
    el.hidden = false;
  }

  var cursorLaeuft = false;
  function frageCursor() {
    if (cursorLaeuft || document.hidden) return;
    cursorLaeuft = true;
    rufe('bwCursor').then(function (c) {
      cursorLaeuft = false;
      if (c && c.fenster) fensterAbgleich(c.fenster);
      if (c && c.text == null) c = null;
      var alt = S.cursor;
      S.cursor = c || S.cursor;
      if (!c) return;
      aktualisiereSpot();
      var anders = !alt || alt.kapitel !== c.kapitel || alt.pos !== c.pos || alt.tab !== c.tab;
      if (anders && S.ansicht === 'notizen') {
        if (!S.bearbeiten) renderNotizListe();
        aktualisiereVorschau();
      }
    }, function () {
      cursorLaeuft = false;
    });
  }

  function ladeTextstellen() {
    return rufe('bwTextstellen').then(function (s) {
      S.textstellen = s || {};
      if (S.ansicht === 'notizen' && !S.bearbeiten) renderNotizListe();
    }, function () {});
  }

  /* -------------------------------------------------------------- */
  /* Ereignisse                                                      */
  /* -------------------------------------------------------------- */

  var AKTIONEN = {
    'hilfe-zu': function () { S.einst.hinweisGesehen = true; speichereEinstellungen(); var x = $('#hilfe'); if (x) x.remove(); },
    'hilfe-an': function () { S.einst.hinweisGesehen = false; speichereEinstellungen(); geheZu('notizen'); },
    'zurueck': zurueck,
    'neu-karte': function (b) { S.neuIn = b.dataset.art; render(); var i = $('#neu-name'); if (i) i.focus(); },
    'neu-karte-ok': function (b) { neueKarteAnlegen(b.dataset.art); },
    'freitext': function (b, ev) { if (!ev.target.closest('.ref')) freitextBearbeiten(b); },
    'ki-felder': kiFelder,
    'ki-pruefen': kiPruefen,
    'ki-uebernehmen': kiUebernehmen,
    'ki-zu': function () { S.kiVorschlag = S.kiBefunde = null; render(); },
    'vorkommen': vorkommen,
    'vorkommen-auf': function (b) { var i = Number(b.dataset.i); S.vorkommen.offen[i] = !S.vorkommen.offen[i]; render(); },
    'vorkommen-weiter': function (b) {
      // Jeder Klick: nächste Fundstelle im Kapitel, nach der letzten wieder die erste.
      var i = Number(b.dataset.i), a = S.vorkommen.aktiv[i];
      zuFund(i, a == null ? 0 : (a + 1) % S.vorkommen.liste[i].treffer.length);
    },
    'zu-fund': function (b) { zuFund(Number(b.dataset.i), Number(b.dataset.j)); },
    'notiz-zu': function () {
      var e = eintrag(S.karteId);
      geheZu('notizen');
      var ta = $('#neu');
      ta.value = '@' + e.name + ' ';
      ta.focus();
      ta.dispatchEvent(new Event('input'));
    },
    'karten-menue': function (b) {
      var e = eintrag(S.karteId);
      var r = b.getBoundingClientRect();
      var optionen = [{ html: th('karte.menue.notiz', { name: e.name }), tun: AKTIONEN['notiz-zu'] }];
      if ((art(e.art).felder || []).length) optionen.push({ html: th('karte.ausfuehrlich'), tun: steckbriefFenster });
      if (e.art === 'ort') optionen.push({ html: '🗺️ ' + th('lk.zeigen'), tun: function () { landkarteFenster(e.id); } });
      bildOptionen(e).forEach(function (o) { optionen.push(o); });
      if (e.blatt) optionen.push({ html: th('karte.menue.blattAuf'), tun: function () { window.open('https://docs.google.com/document/d/' + e.blatt + '/edit', '_blank'); } });
      else optionen.push({ html: th('karte.menue.blattNeu'), tun: function () { S.blaetterOffen[e.id] = true; blaetterSenden().then(function () { toast(t('karte.menue.blattFertig')); }); } });
      if (e.anker) optionen.push({ html: th('karte.menue.wo'), tun: function () { springe(e); } });
      optionen.push({ html: gefahr(t('karte.menue.loeschen')), tun: function () { loesche(e, t('loeschen.frage', { name: e.name })); } });
      auswahlMenue(r.right - 190, r.bottom + 2, null, optionen);
    },
    'bez-neu': function () {
      var ziel = $('#bez-ziel').value, artText = $('#bez-art').value.trim();
      if (!ziel) { toast(t('karte.bezWaehlen')); return; }
      neueBeziehung(S.karteId, ziel, artText);
      render();
    },
    'bez-loeschen': function (b) {
      var bz = S.beziehungen.filter(function (x) { return x.id === b.dataset.bez; })[0];
      S.beziehungen = S.beziehungen.filter(function (x) { return x !== bz; });
      berechne();
      render();
      sichere('bwBeziehungLoeschen', bz.id).then(function () { blaetterVormerken([bz.von, bz.nach]); });
    },
    'bearbeiten-ok': function (b) { bearbeitenFertig(b.dataset.id); },
    'bearbeiten-abbruch': function () { S.bearbeiten = null; render(); },
    'zeit-fenster': zeitFenster,
    'landkarte-fenster': function () { landkarteFenster(); },
    'zeit-ki': zeitKiFragen,
    'zeit-ki-ja': function () {
      var ids = S.zeitKi.reihenfolge;
      S.zeitKi = null;
      reihenfolgeSpeichern(ids).then(function () { toast(t('zeit.ki.uebernommen')); });
    },
    'zeit-ki-nein': function () { S.zeitKi = null; render(); },
    'zeit-neu': function () {
      var d = $('#z-datum').value.trim(), x = $('#z-text').value.trim();
      if (!d && !x) return;
      speichere({ art: 'zeit', name: d, text: x }).then(render);
      render();
      $('#z-datum').focus();
    },
    'idee-neu': function () {
      var x = $('#idee-text').value.trim();
      if (!x) return;
      speichere({ art: 'idee', name: '', text: x, status: 'offen' }).then(render);
      render();
      $('#idee-text').focus();
    },
    'statistik': ladeStatistik,
    'blaetter-alle': function () {
      toast(t('einst.blaetterLaeuft'), { dauer: 10000 });
      blaetterSenden(true).then(function () { toast(t('einst.blaetterFertig')); render(); });
    },
    'markieren': markieren,
    'markierung-weg': function () { sichere('bwHervorhebungEntfernen').then(function () { toast(t('einst.markEntfernt')); }); },
    'art-neu': neueArt,
    'art-vorlage': function (b) {
      var i = Number(b.dataset.i), a = S.einst.arten[i];
      var liste = b.dataset.vorlage === 'kurz' ? (S.kurzeArten[I.sprache()] || {})[a.id] : standardArt(a.id).felder;
      a.felder = liste.slice();
      speichereEinstellungen().then(function () { toast(t('einst.art.vorlageGesetzt')); });
      render();
      var d = $$('.einst-art')[i];
      if (d) d.open = true;
    },
    'steckbrief-fenster': steckbriefFenster,
    'bild-menue': function (b) {
      var e = eintrag(S.karteId), r = b.getBoundingClientRect();
      if (e) auswahlMenue(r.left, r.bottom + 2, null, bildOptionen(e));
    },
    'bild-stil': function (b) {
      var hinweis = $('#bild-hinweis');
      if (hinweis) S.bildKi.hinweis = hinweis.value;
      S.bildKi.stil = b.dataset.stil;
      render();
    },
    'bild-erzeugen': bildErzeugen,
    'bild-nehmen': function () {
      var v = S.bildKi;
      bildSpeichern(v.id, 'data:' + v.vorschlag.mime + ';base64,' + v.vorschlag.daten);
      S.bildKi = null;
      render();
    },
    'bild-ki-zu': function () { S.bildKi = null; render(); },
    'schreibtag': function (b) {
      var n = Number(b.dataset.tag), tage = (S.einst.schreibtage || []).slice();
      tage = tage.indexOf(n) >= 0 ? tage.filter(function (x) { return x !== n; }) : tage.concat([n]);
      if (!tage.length) return; // mindestens ein Schreibtag
      S.einst.schreibtage = tage;
      speichereEinstellungen().then(zeigeStatus);
      render();
    },
    'stern': function (b) {
      var e = eintrag(S.karteId), a = e && art(e.art);
      if (!a) return;
      var name = b.dataset.name, liste = sternFelder(a, e);
      var an = liste.indexOf(name) < 0;
      liste = an ? liste.concat([name]) : liste.filter(function (n) { return n !== name; });
      // Die Einstellungen sind eine Kopie – die Art dort ändern, nicht nur die berechnete.
      S.einst.arten.forEach(function (x) { if (x.id === a.id) x.oben = liste; });
      speichereEinstellungen();
      render();
      toast(t(an ? 'karte.stern.gesetzt' : 'karte.stern.entfernt', { feld: name, art: a.mehrzahl || a.name }));
    },
    'art-loeschen': function (b) {
      var a = S.einst.arten[Number(b.dataset.i)];
      if (S.eintraege.some(function (e) { return e.art === a.id; })) { toast(t('einst.art.belegt')); return; }
      S.einst.arten.splice(Number(b.dataset.i), 1);
      speichereEinstellungen();
      render();
    },
    'ki-key': function () {
      var k = $('#ki-key').value.trim();
      if (!k) return;
      sichere('bwKiSchluesselSetzen', k).then(function (st) {
        S.ki = st;
        S.einst.kiAnzeigen = true;
        speichereEinstellungen();
        render();
        toast(t('einst.ki.fertig'));
      });
    },
    'ki-weg': function () { sichere('bwKiSchluesselSetzen', '').then(function (st) { S.ki = st; render(); }); }
  };

  function klick(ev) {
    var z = ev.target;
    var nav = z.closest('[data-nav]');
    if (nav) { geheZu(nav.dataset.nav); return; }
    if (!z.closest('.auswahl-menue')) schliesseMenues();
    var b;
    if ((b = z.closest('.ref.neu'))) {
      var r = b.getBoundingClientRect();
      neuAnlegenMenue(b.dataset.neu, r.left, r.bottom + 4);
      return;
    }
    if ((b = z.closest('[data-ids]'))) {
      var r2 = b.getBoundingClientRect();
      auswahlMenue(r2.left, r2.bottom + 4, t('welcheKarte'), b.dataset.ids.split(',').map(function (id) {
        var e = eintrag(id);
        return { html: art(e.art).icon + ' ' + h(e.name), tun: function () { oeffneKarte(id); } };
      }));
      return;
    }
    if ((b = z.closest('[data-id].ref, .zeile[data-id]'))) { oeffneKarte(b.dataset.id); return; }
    if ((b = z.closest('#spot'))) { if (b.dataset.id) oeffneKarte(b.dataset.id); return; }
    if ((b = z.closest('[data-stelle]'))) { springe(eintrag(b.dataset.stelle)); return; }
    if ((b = z.closest('[data-anheften]'))) { anheften(eintrag(b.dataset.anheften)); return; }
    if ((b = z.closest('[data-menue]'))) { notizMenue(b.dataset.menue, b); return; }
    if ((b = z.closest('[data-filter]'))) {
      S.filter = b.dataset.filter;
      merke('filter', S.filter);
      if (S.filter === 'hier') ladeTextstellen();
      renderNotizListe();
      return;
    }
    if ((b = z.closest('[data-zeitmit]'))) { S.zeitMit = b.dataset.zeitmit; render(); return; }
    if ((b = z.closest('[data-status]'))) {
      var e = eintrag(b.dataset.id);
      e.status = b.dataset.status;
      speichere(e);
      render();
      return;
    }
    if ((b = z.closest('[data-aktion]')) && AKTIONEN[b.dataset.aktion]) {
      AKTIONEN[b.dataset.aktion](b, ev);
    }
  }

  function aenderung(ev) {
    var z = ev.target;
    if (z.dataset.feld || z.dataset.steckbrief) { karteFeldGeaendert(z); return; }
    if (z.dataset.schalter) {
      S.einst[z.dataset.schalter] = z.checked;
      speichereEinstellungen();
      return;
    }
    if (z.dataset.artFeld) { artFeldGeaendert(z); return; }
    if (z.dataset.ziel) {
      S.einst[z.dataset.ziel] = z.dataset.ziel === 'zieldatum' ? z.value : Math.max(0, Number(z.value) || 0);
      speichereEinstellungen().then(function () { zeigeStatus(); if (S.ansicht === 'ziel') render(); });
      return;
    }
    if (z.id === 'sprache') { wechsleSprache(z.value); return; }
    if (z.id === 'ki-modell') { S.einst.kiModell = z.value; speichereEinstellungen(); }
  }

  function tasten(ev) {
    var z = ev.target;
    if (ev.key === 'Enter' && !ev.shiftKey) {
      if (z.id === 'neu-name') { ev.preventDefault(); neueKarteAnlegen(S.neuIn); }
      else if (z.id === 'z-text' || z.id === 'z-datum') { ev.preventDefault(); AKTIONEN['zeit-neu'](); }
      else if (z.id === 'idee-text') { ev.preventDefault(); AKTIONEN['idee-neu'](); }
      else if (z.id === 'ki-key') { ev.preventDefault(); AKTIONEN['ki-key'](); }
      else if (z.dataset.bearbeiten) { ev.preventDefault(); bearbeitenFertig(z.dataset.bearbeiten); }
      else if (z.classList.contains('karte-name') || z.classList.contains('feld-alias')) { ev.preventDefault(); z.blur(); }
    }
    if (ev.key === 'Escape') {
      if (z.dataset.bearbeiten) { S.bearbeiten = null; render(); }
      else if (z.id === 'neu-name') { S.neuIn = null; render(); }
      else schliesseMenues();
    }
  }

  function weltSuche(ev) {
    S.weltSuche = ev.target.value.trim();
    var pos = ev.target.selectionStart;
    render();
    var feld = $('#weltsuche');
    feld.focus();
    feld.setSelectionRange(pos, pos);
  }

  /* -------------------------------------------------------------- */
  /* Start                                                           */
  /* -------------------------------------------------------------- */

  function start() {
    wendeSpracheAn();
    $('#ansicht .laden').lastChild.textContent = t('laden');
    document.addEventListener('click', klick);
    document.addEventListener('change', aenderung);
    document.addEventListener('keydown', tasten);
    document.addEventListener('dragstart', ziehStart);
    document.addEventListener('dragover', ziehUeber);
    document.addEventListener('drop', ziehAblegen);
    document.addEventListener('dragend', ziehEnde);
    // Auf- und zugeklappte Bereiche im Steckbrief merken (toggle steigt nicht auf, daher capture).
    document.addEventListener('toggle', function (ev) {
      var d = ev.target;
      if (!d.dataset || !d.dataset.gruppe) return;
      S.gruppeAuf[d.dataset.gruppe] = d.open;
      merke('gruppen', S.gruppeAuf);
    }, true);
    document.addEventListener('input', function (ev) {
      if (ev.target.matches('textarea[data-auto]')) autoHoehe(ev.target);
      if (ev.target.dataset.steckbrief) gruppeZaehlen(ev.target.closest('.sb-gruppe'));
      if (ev.target.id === 'weltsuche') weltSuche(ev);
    });
    rufe('bwLaden').then(function (d) {
      S.buch = d.buch;
      S.tabelleUrl = d.tabelleUrl;
      S.ordnerUrl = d.ordnerUrl;
      S.kontoSprache = d.kontoSprache;
      S.version = d.version;
      S.bilder = d.bilder || {};
      S.standardArten = d.standardArten || {};
      S.kurzeArten = d.kurzeArten || {};
      S.fensterZeit = d.fensterStand ? d.fensterStand.zeit : 0;
      S.einst = d.einstellungen;
      S.eintraege = d.eintraege;
      S.beziehungen = d.beziehungen;
      S.ki = d.ki;
      wendeSpracheAn();
      $('#buchtitel').textContent = d.buch;
      $('#buchtitel').title = d.buch;
      berechne();
      $('#ansicht').innerHTML = '';
      render();
      if (!S.einst.hinweisGesehen && !S.eintraege.length) setTimeout(function () { var x = $('#neu'); if (x) x.focus(); }, 100);
      ladeTextstellen();
      ladeStatistik();
      frageCursor();
      setInterval(frageCursor, 1500);
      setInterval(ladeTextstellen, 60000);
      setInterval(ladeStatistik, 300000);
    }, function (err) {
      var text = fehlertext(err);
      if (text.indexOf(BW_KEIN_ZUGRIFF) >= 0) { keinZugriff(text.replace(BW_KEIN_ZUGRIFF, '')); return; }
      $('#ansicht').innerHTML = '<div class="leer"><div class="gross">😕</div>' + th('laden.fehler') + '<br><small>' + h(text) + '</small><br><br><button class="knopf" onclick="location.reload()">' + th('nochmal') + '</button></div>';
    });
    window.addEventListener('beforeunload', function () { if (Object.keys(S.blaetterOffen).length) blaetterSenden(); });
  }

  /** Die Tabelle des Buchs gehört jemand anderem und ist nicht freigegeben. */
  var BW_KEIN_ZUGRIFF = '[BW-ZUGRIFF] ';
  function keinZugriff(text) {
    var el = $('#ansicht');
    el.innerHTML = '<div class="leer"><div class="gross">🔒</div>' + h(text) +
      '<br><br><button class="knopf primaer" onclick="location.reload()">' + th('nochmal') + '</button>' +
      '<details class="notfall"><summary>' + th('zugriff.neu') + '</summary><p>' + th('zugriff.neuInfo') + '</p>' +
      '<button class="knopf gefahr" id="tabelle-neu">' + th('zugriff.neuJa') + '</button></details></div>';
    $('#tabelle-neu').onclick = function () {
      this.disabled = true;
      rufe('bwTabelleNeuAnlegen').then(function () { location.reload(); }, function (err) { toast(fehlertext(err), { fehler: true }); });
    };
  }

  start();
})();
</script>
