<script>
/**
 * Oberfläche der Seitenleiste.
 *
 * Aufbau: ein Zustand (S), daraus abgeleitete Verzeichnisse (berechne()),
 * und je Ansicht eine render-Funktion. Gespeichert wird sofort und ohne
 * „Speichern“-Knöpfe – oben rechts steht, ob alles gesichert ist.
 */
(function () {
  var C = BWCore;
  var h = C.escapeHtml;

  var S = {
    buch: '', tabelleUrl: '', ordnerUrl: '',
    einst: null, eintraege: [], beziehungen: [], ki: { aktiv: false },
    cursor: null, textstellen: {}, stat: null,
    ansicht: 'notizen', karteId: null, verlauf: [],
    filter: merke('filter') || 'alle', suche: '', weltSuche: '', zeitMit: '',
    neuIn: null, bearbeiten: null, kiVorschlag: null, kiBefunde: null, vorkommen: null,
    blaetterOffen: {}
  };
  var D = { index: null, artVon: {}, eintragVon: {}, graph: null };
  var tmpZaehler = 0;

  /* -------------------------------------------------------------- */
  /* Server                                                          */
  /* -------------------------------------------------------------- */

  function rufe(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, fehler) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fehler);
      r[fn].apply(r, args);
    });
  }

  var laufend = 0;
  function sichere(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    laufend++;
    zeigeStatus();
    return rufe.apply(null, [fn].concat(args)).then(function (x) {
      laufend--;
      zeigeStatus();
      return x;
    }, function (err) {
      laufend--;
      zeigeStatus();
      toast(fehlertext(err), { fehler: true });
      throw err;
    });
  }

  function fehlertext(err) {
    var t = (err && err.message) || String(err);
    return t.replace(/^Exception:\s*/, '').replace(/^Error:\s*/, '');
  }

  function zeigeStatus() {
    var el = document.getElementById('status');
    if (laufend > 0) {
      el.textContent = 'Speichert …';
    } else if (S.stat) {
      var ziel = S.einst.tagesziel || 0;
      el.textContent = '✍️ ' + S.stat.heute + (ziel ? ' / ' + ziel : '') + ' Wörter';
      el.title = 'Heute geschrieben';
    } else {
      el.textContent = '';
    }
  }

  /* -------------------------------------------------------------- */
  /* Kleine Helfer                                                   */
  /* -------------------------------------------------------------- */

  function merke(k, v) {
    try {
      if (arguments.length > 1) localStorage.setItem('bw-' + k, JSON.stringify(v));
      else return JSON.parse(localStorage.getItem('bw-' + k));
    } catch (err) { return null; }
  }

  function $(sel, wurzel) { return (wurzel || document).querySelector(sel); }
  function $$(sel, wurzel) { return Array.prototype.slice.call((wurzel || document).querySelectorAll(sel)); }

  function art(id) { return D.artVon[id] || C.NOTIZ_ART; }
  function istKarte(e) { return !!(e && art(e.art).karte); }
  function karten() { return S.eintraege.filter(function (e) { return istKarte(e) && e.name; }); }
  function eintrag(id) { return D.eintragVon[id]; }

  function initialen(name) {
    var teile = String(name || '?').trim().split(/\s+/);
    return h((teile[0][0] || '?') + (teile.length > 1 ? teile[teile.length - 1][0] : '')).toUpperCase();
  }

  function stilFarbe(a) { return '--c:' + a.farbe + ';--hell:' + a.hell; }

  function textHtml(text) { return C.textMitVerweisen(text, D.index, D.eintragVon, D.artVon); }

  function stelle(e) {
    var t = e.anker ? S.textstellen[e.anker] : null;
    return { kapitel: t ? t.kapitel : e.kapitel, pos: t ? t.pos : null, tab: t ? t.tab : (e.anker || '').split('|')[0] };
  }

  function stelleKnopf(e) {
    if (!e.anker) return '';
    var k = stelle(e).kapitel || 'Textstelle';
    return '<button class="stelle" data-stelle="' + h(e.id) + '" title="Zur Textstelle springen">📌 ' + h(k) + '</button>';
  }

  function berechne() {
    D.artVon = C.artenMap(S.einst);
    D.eintragVon = {};
    S.eintraege.forEach(function (e) { D.eintragVon[e.id] = e; });
    D.index = C.baueIndex(S.eintraege, C.alleArten(S.einst));
    D.graph = C.verbindungen(S.eintraege, D.index, S.beziehungen);
    D.jahr = C.haeufigstesJahr(S.eintraege.filter(function (e) { return e.art === 'zeit'; }).map(function (e) { return e.name; }));
  }

  function finde(artId, name) {
    var n = String(name || '').trim().toLowerCase();
    return karten().filter(function (e) {
      if (artId && e.art !== artId) return false;
      return e.name.toLowerCase() === n || (e.aliase || []).some(function (a) { return a.toLowerCase() === n; });
    })[0];
  }

  function autoHoehe(ta) {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 2 + 'px';
  }

  /* -------------------------------------------------------------- */
  /* Hinweise                                                        */
  /* -------------------------------------------------------------- */

  var toastTimer = null, toastOpt = null;
  function toast(text, opt) {
    opt = opt || {};
    var el = document.getElementById('toast');
    clearTimeout(toastTimer);
    // Ein verdrängter Hinweis (z. B. „Gelöscht · Rückgängig“) wird jetzt abgeschlossen.
    if (toastOpt && toastOpt.beiEnde) {
      var ende = toastOpt.beiEnde;
      toastOpt.beiEnde = null;
      ende();
    }
    toastOpt = opt;
    el.className = 'toast' + (opt.fehler ? ' fehler' : '');
    el.innerHTML = '<span>' + h(text) + '</span>' +
      (opt.aktion ? '<button data-toast="aktion">' + h(opt.aktion) + '</button>' : '') +
      '<button data-toast="zu" title="Schließen">✕</button>';
    el.hidden = false;
    el.onclick = function (ev) {
      var b = ev.target.closest('[data-toast]');
      if (!b) return;
      if (b.dataset.toast === 'aktion' && opt.beiAktion) opt.beiAktion();
      if (opt.beiEnde && b.dataset.toast === 'zu') opt.beiEnde();
      opt.beiEnde = null;
      el.hidden = true;
    };
    toastTimer = setTimeout(function () {
      el.hidden = true;
      if (opt.beiEnde) opt.beiEnde();
    }, opt.dauer || (opt.fehler ? 7000 : 4000));
  }

  function auswahlMenue(x, y, kopf, optionen) {
    schliesseMenues();
    var m = document.createElement('div');
    m.className = 'auswahl-menue';
    m.innerHTML = (kopf ? '<div class="kopfzeile">' + h(kopf) + '</div>' : '') +
      optionen.map(function (o, i) { return '<button data-i="' + i + '">' + o.html + '</button>'; }).join('');
    document.body.appendChild(m);
    var breite = m.offsetWidth, hoehe = m.offsetHeight;
    m.style.left = Math.max(6, Math.min(x, window.innerWidth - breite - 6)) + 'px';
    m.style.top = Math.max(6, Math.min(y, window.innerHeight - hoehe - 6)) + 'px';
    m.onclick = function (ev) {
      var b = ev.target.closest('[data-i]');
      if (!b) return;
      schliesseMenues();
      optionen[Number(b.dataset.i)].tun();
    };
  }

  function schliesseMenues() {
    $$('.auswahl-menue, .menue').forEach(function (m) { m.remove(); });
  }

  /* -------------------------------------------------------------- */
  /* Speichern                                                       */
  /* -------------------------------------------------------------- */

  /** Speichert einen Eintrag; ist er neu, erscheint er sofort (vorläufig) in der Liste. */
  function speichere(e, optionen) {
    var neu = !e.id;
    if (neu) {
      e.id = 'tmp' + (++tmpZaehler);
      e.provisorisch = true;
      e.erstellt = e.erstellt || jetztText();
      S.eintraege.push(e);
    }
    var vorher = verweiseVon(e);
    berechne();
    var daten = Object.assign({}, e);
    delete daten.provisorisch;
    return sichere('bwSpeichern', daten, optionen || {}).then(function (gespeichert) {
      var altId = e.id;
      Object.keys(gespeichert).forEach(function (k) {
        if (k !== 'pos' && k !== 'tab') e[k] = gespeichert[k];
      });
      delete e.provisorisch;
      if (gespeichert.anker && gespeichert.pos != null) {
        S.textstellen[gespeichert.anker] = { kapitel: gespeichert.kapitel, pos: gespeichert.pos, tab: gespeichert.tab };
      }
      if (altId !== e.id) {
        // vorläufige ID überall ersetzen
        S.beziehungen.forEach(function (b) {
          if (b.von === altId) b.von = e.id;
          if (b.nach === altId) b.nach = e.id;
        });
        if (S.karteId === altId) S.karteId = e.id;
      }
      berechne();
      blaetterVormerken(vorher.concat(verweiseVon(e)));
      return e;
    }, function (err) {
      if (neu) {
        S.eintraege = S.eintraege.filter(function (x) { return x !== e; });
        berechne();
      }
      throw err;
    });
  }

  function verweiseVon(e) {
    var ids = D.index ? C.verweisIds(e, D.index) : [];
    if (istKarte(e)) ids.push(e.id);
    return ids;
  }

  function jetztText() {
    var d = new Date();
    function z(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
  }

  /** Löschen mit „Rückgängig“: erst nach ein paar Sekunden wirklich weg. */
  function loesche(e, frage) {
    var tun = function () {
      var betroffen = verweiseVon(e).concat((D.graph.rein[e.id] || []));
      S.eintraege = S.eintraege.filter(function (x) { return x !== e; });
      var bez = S.beziehungen.filter(function (b) { return b.von === e.id || b.nach === e.id; });
      S.beziehungen = S.beziehungen.filter(function (b) { return bez.indexOf(b) < 0; });
      berechne();
      if (S.karteId === e.id) zurueck();
      else render();
      var rueckgaengig = false;
      toast((istKarte(e) ? '„' + e.name + '“' : art(e.art).name) + ' gelöscht', {
        aktion: 'Rückgängig', dauer: 6000,
        beiAktion: function () {
          rueckgaengig = true;
          S.eintraege.push(e);
          S.beziehungen = S.beziehungen.concat(bez);
          berechne();
          render();
        },
        beiEnde: function () {
          if (rueckgaengig) return;
          sichere('bwLoeschen', e.id).then(function () {
            blaetterVormerken(betroffen.filter(function (id) { return id !== e.id; }));
          });
        }
      });
    };
    if (!frage) return tun();
    auswahlMenue(window.innerWidth / 2 - 90, 120, frage, [
      { html: '🗑️ Ja, löschen', tun: tun },
      { html: 'Abbrechen', tun: function () {} }
    ]);
  }

  function speichereEinstellungen() {
    berechne();
    return sichere('bwEinstellungenSpeichern', S.einst);
  }

  /* -------------------------------------------------------------- */
  /* Personenblätter (Google Docs pro Karte)                         */
  /* -------------------------------------------------------------- */

  var blattTimer = null;
  function blaetterVormerken(ids) {
    if (!S.einst.blaetterAuto) return;
    ids.forEach(function (id) {
      var e = eintrag(id);
      if (e && istKarte(e) && String(id).indexOf('tmp') !== 0) S.blaetterOffen[id] = true;
    });
    clearTimeout(blattTimer);
    blattTimer = setTimeout(blaetterSenden, 8000);
  }

  function blaetterSenden(alle) {
    var ids = alle ? karten().map(function (e) { return e.id; }) : Object.keys(S.blaetterOffen);
    S.blaetterOffen = {};
    var blaetter = ids.map(eintrag).filter(function (e) { return e && istKarte(e); }).map(baueBlatt);
    if (!blaetter.length) return Promise.resolve();
    return sichere('bwBlaetterSync', blaetter).then(function (ergebnis) {
      Object.keys(ergebnis).forEach(function (id) { if (eintrag(id)) eintrag(id).blatt = ergebnis[id]; });
      if (!S.ordnerUrl) rufe('bwLaden').then(function (d) { S.ordnerUrl = d.ordnerUrl; });
      if (S.ansicht === 'karte') renderKopfMenue();
    });
  }

  function stuecke(text) {
    text = String(text || '');
    var out = [], pos = 0;
    C.findeVerweise(text, D.index).forEach(function (v) {
      if (v.start > pos) out.push({ t: text.slice(pos, v.start) });
      out.push(v.neu ? { t: v.text } : { t: v.text, z: v.ids[0] });
      pos = v.ende;
    });
    if (pos < text.length) out.push({ t: text.slice(pos) });
    return out;
  }

  function baueBlatt(e) {
    var a = art(e.art);
    var abschnitte = [];
    var felder = Object.keys(e.felder || {}).filter(function (k) { return e.felder[k]; });
    abschnitte.push({ titel: 'Steckbrief', zeilen: felder.map(function (k) { return [{ t: k + ': ', fett: true }].concat(stuecke(e.felder[k])); }) });
    abschnitte.push({ titel: 'Beschreibung', zeilen: String(e.text || '').split('\n').filter(Boolean).map(stuecke) });
    abschnitte.push({
      titel: 'Beziehungen',
      zeilen: S.beziehungen.filter(function (b) { return b.von === e.id || b.nach === e.id; }).map(function (b) {
        var anderer = eintrag(b.von === e.id ? b.nach : b.von);
        if (!anderer) return [];
        return b.von === e.id
          ? [{ t: (b.art || 'verbunden mit') + ' ' }, { t: anderer.name, z: anderer.id }]
          : [{ t: anderer.name, z: anderer.id }, { t: ' ist ' + (b.art || 'verbunden mit') + ' ' + e.name }];
      }).filter(function (z) { return z.length; })
    });
    var verbunden = verbundeneKarten(e.id);
    abschnitte.push({
      titel: 'Verbunden mit',
      zeilen: verbunden.map(function (v) { return [{ t: art(v.e.art).icon + ' ' }, { t: v.e.name, z: v.e.id }]; })
    });
    abschnitte.push({
      titel: 'Notizen',
      zeilen: notizenZu(e.id).map(function (n) {
        var k = stelle(n).kapitel;
        return (k ? [{ t: k + ' – ', fett: true }] : []).concat(stuecke(n.text));
      })
    });
    abschnitte.push({
      titel: 'Zeitstrahl',
      zeilen: ereignisseZu(e.id).map(function (z) { return [{ t: z.name + ': ', fett: true }].concat(stuecke(z.text)); })
    });
    return {
      id: e.id,
      blattId: e.blatt,
      titel: e.name,
      untertitel: a.name + ((e.aliase || []).length ? ' · auch: ' + e.aliase.join(', ') : ''),
      abschnitte: abschnitte
    };
  }

  /* -------------------------------------------------------------- */
  /* Abfragen                                                        */
  /* -------------------------------------------------------------- */

  /** Notizen und Ideen, die eine Karte erwähnen (älteste zuerst). */
  function notizenZu(id) {
    return (D.graph.rein[id] || []).map(eintrag).filter(function (e) {
      return e && !istKarte(e) && e.art !== 'zeit';
    }).sort(nachStelle);
  }

  function ereignisseZu(id) {
    return (D.graph.rein[id] || []).map(eintrag).filter(function (e) { return e && e.art === 'zeit'; }).sort(nachDatum);
  }

  /** Karten, die mit dieser verbunden sind – direkt oder weil sie gemeinsam erwähnt werden. */
  function verbundeneKarten(id) {
    var punkte = {};
    function zaehle(andereId, gewicht) {
      if (andereId === id) return;
      var e = eintrag(andereId);
      if (!e || !istKarte(e)) return;
      punkte[andereId] = (punkte[andereId] || 0) + gewicht;
    }
    (D.graph.raus[id] || []).forEach(function (x) { zaehle(x, 2); });
    (D.graph.rein[id] || []).forEach(function (x) {
      zaehle(x, 2);
      (D.graph.raus[x] || []).forEach(function (y) { zaehle(y, 1); });
    });
    return Object.keys(punkte).map(function (k) { return { e: eintrag(k), punkte: punkte[k] }; })
      .sort(function (a, b) { return b.punkte - a.punkte || a.e.name.localeCompare(b.e.name); });
  }

  function nachStelle(a, b) {
    var pa = stelle(a).pos, pb = stelle(b).pos;
    if (pa != null && pb != null && pa !== pb) return pa - pb;
    return String(a.erstellt).localeCompare(String(b.erstellt));
  }

  function nachDatum(a, b) {
    var da = C.parseDatum(a.name, D.jahr), db = C.parseDatum(b.name, D.jahr);
    if (da != null && db != null && da !== db) return da - db;
    if (da == null && db != null) return 1;
    if (db == null && da != null) return -1;
    return String(a.erstellt).localeCompare(String(b.erstellt));
  }

  /* -------------------------------------------------------------- */
  /* Navigation                                                      */
  /* -------------------------------------------------------------- */

  function geheZu(ansicht) {
    S.verlauf = [];
    S.ansicht = ansicht;
    S.karteId = null;
    S.kiVorschlag = S.kiBefunde = S.vorkommen = null;
    $$('#leiste button').forEach(function (b) { b.classList.toggle('aktiv', b.dataset.nav === ansicht); });
    render();
    $('#ansicht').scrollTop = 0;
    if (ansicht === 'ziel') ladeStatistik();
  }

  function oeffneKarte(id) {
    if (!eintrag(id)) return;
    S.verlauf.push({ ansicht: S.ansicht, karteId: S.karteId, scroll: $('#ansicht').scrollTop });
    S.ansicht = 'karte';
    S.karteId = id;
    S.kiVorschlag = S.kiBefunde = S.vorkommen = null;
    render();
    $('#ansicht').scrollTop = 0;
  }

  function zurueck() {
    var z = S.verlauf.pop() || { ansicht: 'notizen' };
    S.ansicht = z.ansicht;
    S.karteId = z.karteId;
    S.kiVorschlag = S.kiBefunde = S.vorkommen = null;
    if (S.ansicht === 'karte' && !eintrag(S.karteId)) return zurueck();
    render();
    if (z.scroll) $('#ansicht').scrollTop = z.scroll;
  }

  function springe(e) {
    if (!e.anker) return;
    sichere('bwZuTextstelle', e.anker).then(function (ok) {
      if (!ok) toast('Diese Textstelle gibt es nicht mehr.');
    });
  }

  function render() {
    var el = $('#ansicht');
    var fokus = document.activeElement && document.activeElement.id === 'neu';
    var f = {
      notizen: renderNotizen, welt: renderWelt, karte: renderKarte, zeit: renderZeit,
      pinnwand: renderPinnwand, ziel: renderZiel, einstellungen: renderEinstellungen
    }[S.ansicht];
    $$('#leiste button').forEach(function (b) {
      b.classList.toggle('aktiv', b.dataset.nav === (S.ansicht === 'karte' ? 'welt' : S.ansicht));
    });
    if (S.ansicht === 'notizen' && $('#neu')) {
      // Eingabefeld behalten (Fokus, Text), nur die Liste neu zeichnen.
      renderNotizListe();
      return;
    }
    el.innerHTML = f();
    $$('textarea[data-auto]', el).forEach(autoHoehe);
    if (S.ansicht === 'karte') renderKopfMenue();
    if (S.ansicht === 'notizen') {
      vorbereitenEingabe();
      renderNotizListe();
      if (fokus) $('#neu').focus();
    }
  }

  /* -------------------------------------------------------------- */
  /* Ansicht: Notizen                                                */
  /* -------------------------------------------------------------- */

  function renderNotizen() {
    var hilfe = S.einst.hinweisGesehen ? '' : hilfeHtml();
    return '<div class="eingabe">' +
      '<textarea id="neu" rows="2" placeholder="Notiz schreiben …  (z. B. „Person Lena: 34, Hebamme“)" aria-label="Neue Notiz"></textarea>' +
      '<div id="vorschlaege" class="vorschlaege" hidden></div>' +
      '<div class="eingabe-fuss">' +
      '<div class="vorschau" id="vorschau"></div>' +
      '<button class="pin' + (S.einst.anheften ? ' an' : '') + '" id="pin" title="An die Textstelle heften, an der der Cursor steht">📌</button>' +
      '<button class="knopf primaer klein" id="speichern" disabled>Speichern</button>' +
      '</div></div>' + hilfe +
      '<div class="filter">' +
      '<button class="chip" data-filter="hier">📍 Hier</button>' +
      '<button class="chip" data-filter="alle">Alle</button>' +
      '<input class="suche" id="suche" type="search" placeholder="🔍 Suchen" value="' + h(S.suche) + '">' +
      '</div><div class="liste" id="liste"></div>';
  }

  function hilfeHtml() {
    var a = S.einst.arten;
    var wort = function (id) {
      var x = a.filter(function (y) { return y.id === id; })[0];
      return x && x.woerter[0] ? x.woerter[0] : id;
    };
    return '<div class="hilfe" id="hilfe"><button class="mini" data-aktion="hilfe-zu" title="Ausblenden">✕</button>' +
      '<b>So funktioniert’s:</b> Einfach drauflosschreiben. Das erste Wort entscheidet, was daraus wird:<ul>' +
      '<li><code>' + wort('person') + ' Lena: …</code> neue Figur</li>' +
      '<li><code>' + wort('ort') + ' Hafen: …</code> neuer Ort</li>' +
      '<li><code>' + wort('ding') + ' Taschenuhr: …</code> Gegenstand</li>' +
      '<li><code>' + wort('zeit') + ' 12. März: …</code> Zeitstrahl</li>' +
      '<li><code>' + wort('idee') + ': …</code> Pinnwand</li>' +
      '<li><code>@Lena</code> verweist auf eine Karte</li></ul>' +
      '<div style="margin-top:6px">Bekannte Namen werden automatisch verlinkt. 📌 heftet die Notiz an die Stelle im Text, an der dein Cursor steht.</div></div>';
  }

  function renderNotizListe() {
    var liste = $('#liste');
    if (!liste) return;
    $$('[data-filter]').forEach(function (b) { b.classList.toggle('aktiv', b.dataset.filter === S.filter); });
    var hierChip = $('[data-filter="hier"]');
    if (hierChip) {
      var k = S.cursor && S.cursor.kapitel;
      hierChip.textContent = '📍 ' + (k ? C.ausschnitt(k, 22) : 'Hier');
      hierChip.title = 'Notizen zum Kapitel, in dem der Cursor steht';
    }
    var eintraege = S.eintraege.slice();
    var leerText = '';
    if (S.filter === 'hier') {
      if (!S.cursor) {
        liste.innerHTML = '<div class="leer"><div class="gross">👆</div>Klicke in deinen Text – dann erscheinen hier die Notizen zu diesem Kapitel.</div>';
        return;
      }
      eintraege = eintraege.filter(function (e) {
        if (!e.anker && !e.provisorisch) return false;
        var s = stelle(e);
        return e.provisorisch || (s.kapitel === S.cursor.kapitel && (!S.cursor.tab || !s.tab || s.tab === S.cursor.tab));
      }).sort(nachStelle);
      leerText = 'Zu ' + (S.cursor.kapitel ? '„' + h(S.cursor.kapitel) + '“' : 'dieser Stelle') + ' gibt es noch keine Notizen.';
    } else {
      eintraege.sort(function (a, b) { return String(b.erstellt).localeCompare(String(a.erstellt)); });
      leerText = 'Noch keine Notizen. Schreib oben einfach los!';
    }
    if (S.suche) {
      var q = S.suche.toLowerCase();
      eintraege = eintraege.filter(function (e) {
        return (e.name + ' ' + e.text + ' ' + (e.aliase || []).join(' ') + ' ' + e.kapitel).toLowerCase().indexOf(q) >= 0;
      });
      leerText = 'Nichts gefunden für „' + h(S.suche) + '“.';
    }
    if (!eintraege.length) {
      liste.innerHTML = '<div class="leer"><div class="gross">🗒️</div>' + leerText + '</div>';
      return;
    }
    liste.innerHTML = eintraege.map(notizHtml).join('');
    $$('textarea[data-auto]', liste).forEach(autoHoehe);
  }

  function notizHtml(e) {
    var a = art(e.art);
    var hier = S.cursor && S.filter === 'hier' && stelle(e).pos === S.cursor.pos;
    var kopf = '<span>' + a.icon + '</span><span class="art">' + h(a.name) + '</span>';
    if (istKarte(e)) {
      kopf += '<button class="ref titel" data-id="' + h(e.id) + '" style="--c:' + a.farbe + '">' + h(e.name) + '</button>';
    } else if (e.name) {
      kopf += '<span class="titel">' + h(e.name) + '</span>';
    }
    if (e.art === 'idee' && e.status && e.status !== 'offen') kopf += '<span>· ' + h(e.status) + '</span>';
    var inhalt;
    if (S.bearbeiten === e.id) {
      inhalt = '<textarea data-auto data-bearbeiten="' + h(e.id) + '">' + h(alsEingabe(e)) + '</textarea>' +
        '<div class="ki-leiste"><button class="knopf primaer klein" data-aktion="bearbeiten-ok" data-id="' + h(e.id) + '">Fertig</button>' +
        '<button class="knopf klein" data-aktion="bearbeiten-abbruch">Abbrechen</button></div>';
    } else {
      var text = istKarte(e) ? C.ausschnitt(e.text, 160) : e.text;
      inhalt = '<div class="notiz-text">' + (text ? textHtml(text) : '<span style="color:var(--text-3)">–</span>') + '</div>';
    }
    return '<div class="notiz' + (hier ? ' hier' : '') + (e.provisorisch ? ' provisorisch' : '') + '" style="' + stilFarbe(a) + '" data-eintrag="' + h(e.id) + '">' +
      '<div class="notiz-kopf">' + kopf + '<span class="rechts">' + stelleKnopf(e) +
      '<button class="mini" data-menue="' + h(e.id) + '" title="Mehr">⋯</button></span></div>' + inhalt + '</div>';
  }

  /** So sieht ein Eintrag als Eingabetext aus (zum Bearbeiten). */
  function alsEingabe(e) {
    if (e.art === 'notiz') return e.text;
    var w = (art(e.art).woerter || [])[0] || art(e.art).name;
    return w + (e.name ? ' ' + e.name : '') + ': ' + e.text;
  }

  function notizMenue(id, knopf) {
    var e = eintrag(id);
    if (!e) return;
    var r = knopf.getBoundingClientRect();
    var optionen = [];
    if (istKarte(e)) optionen.push({ html: '🗂️ Karte öffnen', tun: function () { oeffneKarte(id); } });
    else optionen.push({ html: '✏️ Bearbeiten', tun: function () { S.bearbeiten = id; render(); var t = $('[data-bearbeiten]'); if (t) { t.focus(); t.selectionStart = t.value.length; } } });
    if (e.anker) optionen.push({ html: '📌 Zur Textstelle', tun: function () { springe(e); } });
    else optionen.push({ html: '📌 An Cursor-Stelle heften', tun: function () { speichere(e, { anheften: true }).then(render); } });
    if (e.art === 'notiz') {
      optionen.push({ html: '💡 Zur Pinnwand (als Idee)', tun: function () { e.art = 'idee'; e.status = 'offen'; speichere(e).then(render); render(); } });
    }
    optionen.push({ html: '<span style="color:var(--gefahr)">🗑️ Löschen</span>', tun: function () {
      loesche(e, istKarte(e) ? '„' + e.name + '“ wirklich löschen? Notizen bleiben erhalten.' : null);
    } });
    auswahlMenue(r.right - 180, r.bottom + 2, null, optionen);
  }

  function bearbeitenFertig(id) {
    var e = eintrag(id);
    var t = $('[data-bearbeiten="' + id + '"]');
    if (!e || !t) return;
    var p = C.parseNotiz(t.value, C.alleArten(S.einst));
    if (art(p.art).karte) {
      // Aus einer Notiz wird hier keine Karte – der Text bleibt, wie er ist.
      p = { art: e.art === 'notiz' ? 'notiz' : e.art, name: e.art === 'notiz' ? '' : e.name, text: t.value.trim() };
    }
    var vorher = verweiseVon(e);
    e.art = p.art;
    e.name = p.name;
    e.text = p.text;
    if (e.art === 'idee' && !e.status) e.status = 'offen';
    S.bearbeiten = null;
    blaetterVormerken(vorher);
    speichere(e).then(render);
    render();
  }

  /* Eingabefeld: Vorschau, Vorschläge, Speichern */

  function vorbereitenEingabe() {
    var ta = $('#neu');
    var entwurf = merke('entwurf');
    if (entwurf) ta.value = entwurf;
    autoHoehe(ta);
    aktualisiereVorschau();
    ta.addEventListener('input', function () {
      autoHoehe(ta);
      merke('entwurf', ta.value);
      aktualisiereVorschau();
      aktualisiereVorschlaege();
    });
    ta.addEventListener('keydown', tastenImEingabefeld);
    ta.addEventListener('blur', function () { setTimeout(function () { $('#vorschlaege') && ($('#vorschlaege').hidden = true); }, 150); });
    ta.addEventListener('click', aktualisiereVorschlaege);
    $('#speichern').onclick = speichereNeu;
    $('#pin').onclick = function () {
      S.einst.anheften = !S.einst.anheften;
      this.classList.toggle('an', S.einst.anheften);
      aktualisiereVorschau();
      speichereEinstellungen();
      toast(S.einst.anheften ? '📌 Neue Notizen werden an die Cursor-Stelle geheftet.' : 'Neue Notizen werden nicht angeheftet.');
    };
    $('#suche').addEventListener('input', function () {
      S.suche = this.value.trim();
      renderNotizListe();
    });
  }

  function aktualisiereVorschau() {
    var ta = $('#neu'), el = $('#vorschau');
    if (!ta || !el) return;
    var text = ta.value;
    $('#speichern').disabled = !text.trim();
    if (!text.trim()) {
      el.innerHTML = S.cursor && S.einst.anheften && S.cursor.kapitel ? '📌 wird angeheftet an <b>' + h(C.ausschnitt(S.cursor.kapitel, 26)) + '</b>' : '<span>⏎ speichert · ⇧⏎ neue Zeile</span>';
      return;
    }
    var p = C.parseNotiz(text, C.alleArten(S.einst));
    var a = art(p.art);
    var html;
    if (a.karte) {
      if (!p.name) html = a.icon + ' ' + h(a.name) + ' – <b>Name fehlt</b>';
      else {
        var da = finde(p.art, p.name);
        html = da ? '📝 Notiz zu ' + a.icon + ' <b>' + h(da.name) + '</b>' : a.icon + ' Neue Karte: <b>' + h(p.name) + '</b>';
      }
    } else if (p.art === 'zeit') {
      html = '📅 Ereignis am <b>' + h(p.name) + '</b>' + (C.parseDatum(p.name) == null ? ' <span title="Wird ans Ende des Zeitstrahls sortiert">(Datum?)</span>' : '');
    } else if (p.art === 'idee') {
      html = '💡 Idee für die Pinnwand';
    } else if (a.id !== 'notiz') {
      html = a.icon + ' ' + h(a.name);
    } else {
      var namen = [];
      C.findeVerweise(text, D.index).forEach(function (v) {
        var n = v.neu ? '@' + v.text + ' (neu)' : eintrag(v.ids[0]).name;
        if (namen.indexOf(n) < 0) namen.push(n);
      });
      html = '📝 Notiz' + (namen.length ? ' zu <b>' + h(namen.slice(0, 3).join(', ')) + '</b>' + (namen.length > 3 ? ' …' : '') : '');
    }
    el.innerHTML = html;
  }

  var vorschlagListe = [], vorschlagAktiv = 0;

  function aktualisiereVorschlaege() {
    var ta = $('#neu'), box = $('#vorschlaege');
    if (!ta || !box) return;
    var vor = ta.value.slice(0, ta.selectionStart);
    vorschlagListe = [];
    var m = vor.match(/(^|[^\p{L}\p{N}_])@([\p{L}\p{N}_\-]*(?: [\p{L}\p{N}_\-]*)?)$/u);
    var m2 = vor.match(/^\s*#?([\p{L}]{1,14})$/u);
    var m3 = vor.match(/^\s*#?([\p{L}]+)\s+([^:\n]{0,40})$/u);
    if (m) {
      var q = m[2].toLowerCase();
      karten().forEach(function (e) {
        var namen = [e.name].concat(e.aliase || []);
        var treffer = namen.filter(function (n) { return n.toLowerCase().indexOf(q) === 0; })[0] ||
          (q.length > 1 ? namen.filter(function (n) { return n.toLowerCase().indexOf(q) > 0; })[0] : null);
        if (treffer !== undefined && treffer !== null) {
          vorschlagListe.push({
            html: art(e.art).icon + ' ' + h(e.name) + (treffer !== e.name ? ' <small>' + h(treffer) + '</small>' : '<small>' + h(art(e.art).name) + '</small>'),
            einfuegen: function () { ersetzeVorCursor(m[2].length + 1, '@' + e.name + ' '); }
          });
        }
      });
    } else if (m2 && ta.value.trim() === vor.trim()) {
      var w = m2[1].toLowerCase();
      C.alleArten(S.einst).forEach(function (a) {
        (a.woerter || []).forEach(function (wort) {
          if (wort.toLowerCase().indexOf(w) === 0 && wort.toLowerCase() !== w) {
            vorschlagListe.push({
              html: a.icon + ' <b>' + h(wort) + '</b> <small>' + (a.karte ? 'neue Karte' : h(a.name)) + '</small>',
              einfuegen: function () { ersetzeVorCursor(vor.length, wort + (a.karte || a.id === 'zeit' ? ' ' : ': ')); }
            });
          }
        });
      });
    } else if (m3) {
      var a3 = C.alleArten(S.einst).filter(function (a) {
        return a.karte && (a.woerter || []).some(function (w) { return w.toLowerCase() === m3[1].toLowerCase(); });
      })[0];
      if (a3) {
        var q3 = m3[2].toLowerCase();
        karten().filter(function (e) { return e.art === a3.id && e.name.toLowerCase().indexOf(q3) === 0 && e.name.toLowerCase() !== q3.trim(); })
          .forEach(function (e) {
            vorschlagListe.push({
              html: a3.icon + ' ' + h(e.name) + ' <small>Notiz dazu</small>',
              einfuegen: function () { ersetzeVorCursor(m3[2].length, e.name + ': '); }
            });
          });
      }
    }
    vorschlagListe = vorschlagListe.slice(0, 6);
    vorschlagAktiv = 0;
    if (!vorschlagListe.length) {
      box.hidden = true;
      return;
    }
    box.innerHTML = vorschlagListe.map(function (v, i) {
      return '<button class="vorschlag' + (i === 0 ? ' aktiv' : '') + '" data-v="' + i + '">' + v.html + '</button>';
    }).join('');
    box.style.top = (ta.offsetHeight + 2) + 'px';
    box.hidden = false;
    box.onmousedown = function (ev) {
      var b = ev.target.closest('[data-v]');
      if (!b) return;
      ev.preventDefault();
      vorschlagListe[Number(b.dataset.v)].einfuegen();
    };
  }

  function ersetzeVorCursor(laenge, neu) {
    var ta = $('#neu');
    var pos = ta.selectionStart;
    ta.value = ta.value.slice(0, pos - laenge) + neu + ta.value.slice(pos);
    var cur = pos - laenge + neu.length;
    ta.setSelectionRange(cur, cur);
    ta.focus();
    ta.dispatchEvent(new Event('input'));
    $('#vorschlaege').hidden = true;
  }

  function tastenImEingabefeld(ev) {
    var box = $('#vorschlaege');
    var offen = box && !box.hidden && vorschlagListe.length;
    if (offen && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) {
      ev.preventDefault();
      vorschlagAktiv = (vorschlagAktiv + (ev.key === 'ArrowDown' ? 1 : -1) + vorschlagListe.length) % vorschlagListe.length;
      $$('.vorschlag', box).forEach(function (b, i) { b.classList.toggle('aktiv', i === vorschlagAktiv); });
      return;
    }
    if (offen && (ev.key === 'Tab' || (ev.key === 'Enter' && !ev.shiftKey))) {
      ev.preventDefault();
      vorschlagListe[vorschlagAktiv].einfuegen();
      return;
    }
    if (offen && ev.key === 'Escape') {
      box.hidden = true;
      return;
    }
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      speichereNeu();
    }
  }

  function speichereNeu() {
    var ta = $('#neu');
    var text = ta.value;
    if (!text.trim()) return;
    var p = C.parseNotiz(text, C.alleArten(S.einst));
    var a = art(p.art);
    var neu, nachher = null;
    if (a.karte) {
      if (!p.name) {
        toast('Bitte einen Namen angeben, z. B. „' + a.woerter[0] + ' Lena: …“');
        return;
      }
      var da = finde(p.art, p.name);
      if (da && !p.text) {
        leereEingabe();
        oeffneKarte(da.id);
        return;
      }
      if (da) {
        neu = { art: 'notiz', text: p.text, bezug: [da.id] };
      } else {
        neu = { art: p.art, name: p.name, text: p.text, aliase: [], felder: {} };
        nachher = function (e) {
          toast(a.icon + ' „' + e.name + '“ angelegt', { aktion: 'Karte öffnen', beiAktion: function () { oeffneKarte(e.id); } });
        };
      }
    } else if (p.art === 'idee') {
      neu = { art: 'idee', name: p.name, text: p.text, status: 'offen' };
    } else {
      neu = { art: p.art, name: p.name, text: p.text };
    }
    leereEingabe();
    if (S.filter === 'hier' && !S.einst.anheften) S.filter = 'alle';
    speichere(neu, { anheften: S.einst.anheften }).then(function (e) {
      render();
      if (nachher) nachher(e);
      else frageNachUnbekannten(e);
    }, function () {
      ta.value = text;
      aktualisiereVorschau();
    });
    render();
  }

  function leereEingabe() {
    var ta = $('#neu');
    ta.value = '';
    merke('entwurf', '');
    autoHoehe(ta);
    aktualisiereVorschau();
    $('#vorschlaege').hidden = true;
  }

  function frageNachUnbekannten(e) {
    var neu = C.findeVerweise(e.text, D.index).filter(function (v) { return v.neu; });
    if (!neu.length) return;
    toast('„' + neu[0].text + '“ gibt es noch nicht.', {
      aktion: 'Anlegen …', dauer: 7000,
      beiAktion: function () { neuAnlegenMenue(neu[0].text, window.innerWidth / 2 - 90, window.innerHeight - 200); }
    });
  }

  function neuAnlegenMenue(name, x, y) {
    var optionen = S.einst.arten.filter(function (a) { return a.karte; }).map(function (a) {
      return {
        html: a.icon + ' Als ' + h(a.name) + ' anlegen',
        tun: function () {
          speichere({ art: a.id, name: name, text: '', aliase: [], felder: {} }).then(function (e) {
            render();
            toast(a.icon + ' „' + e.name + '“ angelegt', { aktion: 'Karte öffnen', beiAktion: function () { oeffneKarte(e.id); } });
          });
          render();
        }
      };
    });
    auswahlMenue(x, y, '„' + name + '“ ist neu', optionen);
  }

  /* -------------------------------------------------------------- */
  /* Ansicht: Welt (alle Karten)                                     */
  /* -------------------------------------------------------------- */

  function renderWelt() {
    var q = S.weltSuche.toLowerCase();
    var html = '<div class="filter"><input class="suche" id="weltsuche" type="search" placeholder="🔍 Figuren, Orte, Gegenstände suchen" value="' + h(S.weltSuche) + '"></div>';
    S.einst.arten.filter(function (a) { return a.karte; }).forEach(function (a) {
      var liste = karten().filter(function (e) {
        if (e.art !== a.id) return false;
        if (!q) return true;
        return (e.name + ' ' + (e.aliase || []).join(' ') + ' ' + e.text).toLowerCase().indexOf(q) >= 0;
      }).sort(function (x, y) { return x.name.localeCompare(y.name, 'de'); });
      if (q && !liste.length) return;
      html += '<div class="gruppe"><div class="gruppe-kopf">' + a.icon + ' ' + h(a.mehrzahl || a.name) + ' <span class="zahl">' + liste.length + '</span>' +
        '<button class="knopf klein" data-aktion="neu-karte" data-art="' + a.id + '">＋ Neu</button></div>';
      if (S.neuIn === a.id) {
        html += '<div class="neu-zeile"><input id="neu-name" placeholder="Name der/des neuen ' + h(a.name) + '"><button class="knopf primaer klein" data-aktion="neu-karte-ok" data-art="' + a.id + '">Anlegen</button></div>';
      }
      if (!liste.length && S.neuIn !== a.id) {
        html += '<div class="unter" style="padding:0 2px 6px">Noch leer. Im Notizfeld: <b>' + h(a.woerter[0] || a.name) + ' Name: …</b></div>';
      }
      html += liste.map(function (e) { return karteZeile(e, a); }).join('') + '</div>';
    });
    return html;
  }

  function karteZeile(e, a) {
    var felder = Object.keys(e.felder || {}).map(function (k) { return e.felder[k]; }).filter(Boolean);
    var info = felder.length ? felder.slice(0, 3).join(' · ') : (e.text || (e.aliase || []).join(', '));
    var n = (D.graph.rein[e.id] || []).length;
    return '<button class="zeile" data-id="' + h(e.id) + '" style="' + stilFarbe(a) + '">' +
      '<span class="avatar">' + initialen(e.name) + '</span>' +
      '<span class="zeile-text"><div class="zeile-name">' + h(e.name) + '</div>' +
      '<div class="zeile-info">' + h(C.ausschnitt(info, 80)) + '</div></span>' +
      (n ? '<span class="zahl" title="Erwähnungen in Notizen und Karten">' + n + '×</span>' : '') + '</button>';
  }

  function neueKarteAnlegen(artId) {
    var input = $('#neu-name');
    var name = input ? input.value.trim() : '';
    if (!name) { S.neuIn = null; render(); return; }
    var da = finde(artId, name);
    S.neuIn = null;
    if (da) { oeffneKarte(da.id); return; }
    var e = { art: artId, name: name, text: '', aliase: [], felder: {} };
    speichere(e).then(function () { if (S.karteId === e.id) render(); });
    oeffneKarte(e.id);
  }

  /* -------------------------------------------------------------- */
  /* Ansicht: Karte                                                  */
  /* -------------------------------------------------------------- */

  function renderKarte() {
    var e = eintrag(S.karteId);
    if (!e) return '';
    var a = art(e.art);
    var html = '<div style="display:flex;align-items:center;position:relative">' +
      '<button class="zurueck" data-aktion="zurueck">← Zurück</button><span style="flex:1"></span>' +
      '<span id="kopfmenue"></span><button class="mini" data-aktion="karten-menue" title="Mehr" style="font-size:16px">⋯</button></div>';
    html += '<div class="karte-kopf" style="' + stilFarbe(a) + '"><span class="avatar">' + initialen(e.name) + '</span><div style="flex:1;min-width:0">' +
      '<div class="karte-art">' + a.icon + ' ' + h(a.name) + '</div>' +
      '<input class="karte-name" data-feld="name" value="' + h(e.name) + '" aria-label="Name">' +
      '<input class="feld-alias" data-feld="aliase" value="' + h((e.aliase || []).join(', ')) + '" placeholder="Auch genannt: Spitzname, „der Vater“ …" title="Weitere Namen, durch Komma getrennt. Auch sie werden im Text erkannt.">' +
      '</div></div>';

    if (S.kiVorschlag && S.kiVorschlag.id === e.id) html += kiVorschlagHtml(e);
    if (S.kiBefunde && S.kiBefunde.id === e.id) html += kiBefundeHtml();

    // Steckbrief
    var felder = (a.felder || []).slice();
    Object.keys(e.felder || {}).forEach(function (k) { if (felder.indexOf(k) < 0) felder.push(k); });
    if (felder.length) {
      html += '<div class="block"><div class="block-titel">Steckbrief</div><div class="felder">' +
        felder.map(function (f) {
          return '<label>' + h(f) + '</label><textarea data-auto rows="1" data-steckbrief="' + h(f) + '" placeholder="–">' + h((e.felder || {})[f] || '') + '</textarea>';
        }).join('') + '</div></div>';
    }

    // Freitext
    html += '<div class="block"><div class="block-titel">Beschreibung</div>' +
      '<div class="freitext-ansicht' + (e.text ? '' : ' leer-text') + '" data-aktion="freitext" title="Klicken zum Bearbeiten">' +
      (e.text ? textHtml(e.text) : 'Hier frei über ' + h(e.name) + ' schreiben – Aussehen, Geschichte, Eigenheiten …') + '</div>' +
      '<div class="ki-leiste"><button class="knopf ki klein" data-aktion="ki-felder" title="Die KI liest Beschreibung und alle Notizen und füllt den Steckbrief aus">✨ Steckbrief ausfüllen</button>' +
      '<button class="knopf ki klein" data-aktion="ki-pruefen" title="Die KI sucht nach Widersprüchen in allem, was zu dieser Karte notiert ist">🔍 Widersprüche prüfen</button></div></div>';

    // Beziehungen
    var bez = S.beziehungen.filter(function (b) { return b.von === e.id || b.nach === e.id; });
    html += '<div class="block"><div class="block-titel">Beziehungen</div>' +
      (bez.length ? bez.map(function (b) {
        var anderer = eintrag(b.von === e.id ? b.nach : b.von);
        if (!anderer) return '';
        var ref = '<button class="ref" data-id="' + h(anderer.id) + '" style="--c:' + art(anderer.art).farbe + '">' + h(anderer.name) + '</button>';
        return '<div class="bez">' + (b.von === e.id
          ? '<span class="art-text">' + h(b.art || 'verbunden mit') + '</span> ' + ref
          : ref + ' <span class="art-text">ist ' + h(b.art || 'verbunden mit') + ' ' + h(e.name) + '</span>') +
          '<button class="mini" data-aktion="bez-loeschen" data-bez="' + h(b.id) + '" title="Beziehung entfernen">✕</button></div>';
      }).join('') : '<div class="unter" style="margin-top:0">Noch keine. Z. B. „Tochter von“ Heinrich.</div>') +
      '<div class="bez-neu"><input id="bez-art" list="bez-arten" placeholder="z. B. Tochter von">' +
      '<select id="bez-ziel"><option value="">… wem?</option>' + karten().filter(function (k) { return k.id !== e.id; })
        .sort(function (x, y) { return x.name.localeCompare(y.name, 'de'); })
        .map(function (k) { return '<option value="' + h(k.id) + '">' + art(k.art).icon + ' ' + h(k.name) + '</option>'; }).join('') + '</select>' +
      '<button class="knopf klein" data-aktion="bez-neu">＋</button></div>' +
      '<datalist id="bez-arten">' + ['Tochter von', 'Sohn von', 'Mutter von', 'Vater von', 'Schwester von', 'Bruder von', 'verheiratet mit', 'befreundet mit', 'verliebt in', 'Feind von', 'arbeitet für', 'wohnt in', 'gehört', 'besitzt', 'liegt in']
        .map(function (x) { return '<option value="' + x + '">'; }).join('') + '</datalist></div>';

    // Automatisch verbunden
    var verbunden = verbundeneKarten(e.id);
    if (verbunden.length) {
      html += '<div class="block"><div class="block-titel">Verbunden mit</div><div class="verbunden">' +
        verbunden.map(function (v) {
          return '<button class="ref" data-id="' + h(v.e.id) + '" style="--c:' + art(v.e.art).farbe + '">' + art(v.e.art).icon + ' ' + h(v.e.name) + '</button>';
        }).join('') + '</div></div>';
    }

    // Vorkommen im Manuskript
    html += '<div class="block"><div class="block-titel">Im Manuskript<span class="rechts"><button class="link" data-aktion="vorkommen">' +
      (S.vorkommen && S.vorkommen.id === e.id ? 'aktualisieren' : 'Wo kommt ' + h(C.ausschnitt(e.name, 18)) + ' vor?') + '</button></span></div>' +
      vorkommenHtml(e) + '</div>';

    // Notizen
    var notizen = notizenZu(e.id);
    html += '<div class="block"><div class="block-titel">Notizen <span style="font-weight:400">' + notizen.length + '</span>' +
      '<span class="rechts"><button class="link" data-aktion="notiz-zu">＋ Notiz</button></span></div>' +
      (notizen.length ? '<div class="liste">' + notizen.map(notizHtml).join('') + '</div>' : '<div class="unter" style="margin-top:0">Erwähne ' + h(e.name) + ' in einer Notiz, dann erscheint sie hier.</div>') + '</div>';

    // Zeitstrahl
    var ereignisse = ereignisseZu(e.id);
    if (ereignisse.length) {
      html += '<div class="block"><div class="block-titel">Zeitstrahl</div><div class="zeitstrahl">' + ereignisse.map(ereignisHtml).join('') + '</div></div>';
    }
    return html;
  }

  function renderKopfMenue() {
    var el = $('#kopfmenue');
    var e = eintrag(S.karteId);
    if (!el || !e) return;
    el.innerHTML = e.blatt ? '<a class="link" style="font-size:12px;text-decoration:none;margin-right:6px" target="_blank" href="https://docs.google.com/document/d/' + h(e.blatt) + '/edit" title="Personenblatt als Google Doc – auch am Handy mit @' + h(e.name) + ' erreichbar">📄 Blatt</a>' : '';
  }

  function vorkommenHtml(e) {
    if (!S.vorkommen || S.vorkommen.id !== e.id) return '<div class="unter" style="margin-top:0">Zählt, in welchen Kapiteln ' + h(e.name) + ' (oder ein anderer Name dafür) vorkommt.</div>';
    if (S.vorkommen.laedt) return '<div class="unter" style="margin-top:0">Suche im Manuskript …</div>';
    var liste = S.vorkommen.liste;
    if (!liste.length) return '<div class="unter" style="margin-top:0">Im Manuskript noch nicht gefunden.</div>';
    var gesamt = liste.reduce(function (s, k) { return s + k.anzahl; }, 0);
    return '<div class="unter" style="margin-top:0">' + gesamt + '× in ' + liste.length + ' ' + (liste.length === 1 ? 'Abschnitt' : 'Abschnitten') + '</div>' +
      liste.map(function (k, i) {
        return '<div class="bez"><button class="stelle" style="max-width:none" data-aktion="zu-absatz" data-i="' + i + '">📖 ' + h(k.kapitel || 'Anfang') + '</button><span class="art-text" style="margin-left:auto">' + k.anzahl + '×</span></div>';
      }).join('');
  }

  function kiVorschlagHtml(e) {
    var v = S.kiVorschlag;
    if (v.laedt) return '<div class="vorschlag-box"><h4>✨ Die KI liest alles über ' + h(e.name) + ' …</h4><div class="kreisel"></div></div>';
    var zeilen = '';
    Object.keys(v.felder).forEach(function (f, i) {
      var neu = v.felder[f], alt = (e.felder || {})[f] || '';
      if (!neu || neu === alt) return;
      zeilen += '<label class="vorschlag-feld"><input type="checkbox" data-vf="' + h(f) + '" checked><span><b>' + h(f) + '</b><br>' +
        (alt ? '<span class="alt">' + h(alt) + '</span><br>' : '') + h(neu) + '</span></label>';
    });
    var neueAliase = (v.aliase || []).filter(function (x) {
      return x && x !== e.name && (e.aliase || []).indexOf(x) < 0;
    });
    neueAliase.forEach(function (x) {
      zeilen += '<label class="vorschlag-feld"><input type="checkbox" data-va="' + h(x) + '" checked><span><b>Auch genannt</b><br>' + h(x) + '</span></label>';
    });
    (v.beziehungen || []).forEach(function (b, i) {
      var ziel = finde(null, b.name);
      if (!ziel || ziel.id === e.id) return;
      var schonDa = S.beziehungen.some(function (x) { return x.von === e.id && x.nach === ziel.id; });
      if (schonDa) return;
      zeilen += '<label class="vorschlag-feld"><input type="checkbox" data-vb="' + i + '" checked><span><b>Beziehung</b><br>' + h(b.art) + ' ' + art(ziel.art).icon + ' ' + h(ziel.name) + '</span></label>';
    });
    if (!zeilen) {
      return '<div class="vorschlag-box"><h4>✨ Nichts Neues gefunden</h4><div class="unter">Der Steckbrief passt schon zu Beschreibung und Notizen.</div>' +
        '<div class="ki-leiste"><button class="knopf klein" data-aktion="ki-zu">OK</button></div></div>';
    }
    return '<div class="vorschlag-box"><h4>✨ Vorschlag der KI</h4><div class="unter" style="margin-top:0">Häkchen weg bei allem, was nicht stimmt.</div>' + zeilen +
      '<div class="ki-leiste"><button class="knopf primaer klein" data-aktion="ki-uebernehmen">Übernehmen</button><button class="knopf klein" data-aktion="ki-zu">Verwerfen</button></div></div>';
  }

  function kiBefundeHtml() {
    var b = S.kiBefunde;
    if (b.laedt) return '<div class="vorschlag-box"><h4>🔍 Die KI prüft auf Widersprüche …</h4><div class="kreisel"></div></div>';
    if (!b.befunde.length) {
      return '<div class="vorschlag-box"><h4>🔍 Alles stimmig</h4><div class="unter">Keine Widersprüche gefunden.</div><div class="ki-leiste"><button class="knopf klein" data-aktion="ki-zu">OK</button></div></div>';
    }
    return '<div class="vorschlag-box"><h4>🔍 Das ist der KI aufgefallen</h4>' + b.befunde.map(function (x) {
      return '<div class="befund">' + (x.art === 'widerspruch' ? '⚠️ ' : '💬 ') + h(x.text) +
        (x.belege || []).map(function (q) { return '<q>' + h(q) + '</q>'; }).join('') + '</div>';
    }).join('') + '<div class="ki-leiste"><button class="knopf klein" data-aktion="ki-zu">Schließen</button></div></div>';
  }

  /** Änderungen auf der Karte sofort speichern. */
  function karteFeldGeaendert(el) {
    var e = eintrag(S.karteId);
    if (!e) return;
    var vorher = verweiseVon(e);
    if (el.dataset.feld === 'name') {
      var neu = el.value.trim();
      if (!neu) { el.value = e.name; return; }
      if (neu === e.name) return;
      // Der alte Name bleibt als „Auch genannt“, damit bestehende Notizen verlinkt bleiben.
      if ((e.aliase || []).indexOf(e.name) < 0) e.aliase = (e.aliase || []).concat([e.name]);
      e.name = neu;
      blaetterVormerken(D.graph.rein[e.id] || []);
    } else if (el.dataset.feld === 'aliase') {
      e.aliase = el.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    } else if (el.dataset.steckbrief) {
      e.felder = Object.assign({}, e.felder);
      e.felder[el.dataset.steckbrief] = el.value.trim();
    } else if (el.dataset.freitext) {
      e.text = el.value.trim();
    } else {
      return;
    }
    blaetterVormerken(vorher);
    speichere(e).then(function () {
      if (el.dataset.feld) {
        var al = $('[data-feld="aliase"]');
        if (al && document.activeElement !== al) al.value = (e.aliase || []).join(', ');
      }
    });
  }

  function freitextBearbeiten(box) {
    var e = eintrag(S.karteId);
    var ta = document.createElement('textarea');
    ta.className = 'freitext';
    ta.dataset.freitext = '1';
    ta.value = e.text || '';
    ta.placeholder = 'Frei schreiben – die KI kann daraus später den Steckbrief füllen.';
    box.replaceWith(ta);
    autoHoehe(ta);
    ta.focus();
    ta.addEventListener('input', function () { autoHoehe(ta); });
    ta.addEventListener('blur', function () {
      karteFeldGeaendert(ta);
      render();
    });
  }

  function kiFelder() {
    var e = eintrag(S.karteId);
    if (!kiBereit()) return;
    var a = art(e.art);
    var felder = (a.felder || []).slice();
    Object.keys(e.felder || {}).forEach(function (k) { if (felder.indexOf(k) < 0) felder.push(k); });
    if (!felder.length) { toast('Diese Art hat keine Felder. Felder lassen sich unter „Mehr“ festlegen.'); return; }
    S.kiVorschlag = { id: e.id, laedt: true };
    render();
    rufe('bwKiFelder', {
      art: a.name, name: e.name, felder: felder, vorhanden: e.felder || {}, text: e.text,
      notizen: notizenZu(e.id).concat(ereignisseZu(e.id)).map(function (n) { return (n.name ? n.name + ': ' : '') + n.text; }),
      namen: karten().filter(function (k) { return k.id !== e.id; }).map(function (k) { return k.name; })
    }).then(function (v) {
      v.id = e.id;
      S.kiVorschlag = v;
      if (S.karteId === e.id) render();
    }, function (err) {
      S.kiVorschlag = null;
      render();
      toast(fehlertext(err), { fehler: true });
    });
  }

  function kiUebernehmen() {
    var e = eintrag(S.karteId), v = S.kiVorschlag;
    var vorher = verweiseVon(e);
    e.felder = Object.assign({}, e.felder);
    $$('[data-vf]').forEach(function (c) { if (c.checked) e.felder[c.dataset.vf] = v.felder[c.dataset.vf]; });
    $$('[data-va]').forEach(function (c) { if (c.checked) e.aliase = (e.aliase || []).concat([c.dataset.va]); });
    $$('[data-vb]').forEach(function (c) {
      if (!c.checked) return;
      var b = v.beziehungen[Number(c.dataset.vb)];
      var ziel = finde(null, b.name);
      if (ziel) neueBeziehung(e.id, ziel.id, b.art);
    });
    S.kiVorschlag = null;
    blaetterVormerken(vorher);
    speichere(e).then(render);
    render();
    toast('✨ Übernommen');
  }

  function kiPruefen() {
    var e = eintrag(S.karteId);
    if (!kiBereit()) return;
    S.kiBefunde = { id: e.id, laedt: true };
    render();
    rufe('bwKiPruefen', {
      art: art(e.art).name, name: e.name, text: e.text, felder: e.felder || {},
      notizen: notizenZu(e.id).map(function (n) { return { kapitel: stelle(n).kapitel, text: n.text }; }),
      ereignisse: ereignisseZu(e.id).map(function (z) { return { datum: z.name, text: z.text }; })
    }).then(function (r) {
      S.kiBefunde = { id: e.id, befunde: r.befunde || [] };
      if (S.karteId === e.id) render();
    }, function (err) {
      S.kiBefunde = null;
      render();
      toast(fehlertext(err), { fehler: true });
    });
  }

  function kiBereit() {
    if (S.ki.aktiv) return true;
    toast('Für die KI-Hilfe fehlt noch ein API-Schlüssel.', { aktion: 'Einrichten', beiAktion: function () { geheZu('einstellungen'); setTimeout(function () { var k = $('#ki-key'); if (k) { k.scrollIntoView(); k.focus(); } }, 50); } });
    return false;
  }

  function neueBeziehung(von, nach, artText) {
    var b = { id: 'tmp' + (++tmpZaehler), von: von, nach: nach, art: artText };
    S.beziehungen.push(b);
    berechne();
    sichere('bwBeziehungSpeichern', b).then(function (g) {
      b.id = g.id;
      blaetterVormerken([von, nach]);
    });
  }

  function vorkommen() {
    var e = eintrag(S.karteId);
    S.vorkommen = { id: e.id, laedt: true };
    render();
    var begriffe = Object.keys(D.index.namen).filter(function (n) { return D.index.namen[n].ids.indexOf(e.id) >= 0; });
    sichere('bwVorkommen', begriffe).then(function (liste) {
      S.vorkommen = { id: e.id, liste: liste };
      if (S.karteId === e.id) render();
    }, function () { S.vorkommen = null; render(); });
  }

  /* -------------------------------------------------------------- */
  /* Ansicht: Zeitstrahl                                             */
  /* -------------------------------------------------------------- */

  function ereignisHtml(z) {
    return '<div class="ereignis"><div class="notiz" style="--c:' + art('zeit').farbe + '" data-eintrag="' + h(z.id) + '">' +
      '<div class="notiz-kopf"><span class="datum">' + h(z.name || 'ohne Datum') + '</span><span class="rechts">' + stelleKnopf(z) +
      '<button class="mini" data-menue="' + h(z.id) + '" title="Mehr">⋯</button></span></div>' +
      (S.bearbeiten === z.id
        ? '<textarea data-auto data-bearbeiten="' + h(z.id) + '">' + h(alsEingabe(z)) + '</textarea><div class="ki-leiste"><button class="knopf primaer klein" data-aktion="bearbeiten-ok" data-id="' + h(z.id) + '">Fertig</button><button class="knopf klein" data-aktion="bearbeiten-abbruch">Abbrechen</button></div>'
        : '<div class="notiz-text">' + textHtml(z.text) + '</div>') + '</div></div>';
  }

  function renderZeit() {
    var alle = S.eintraege.filter(function (e) { return e.art === 'zeit'; }).sort(nachDatum);
    var personen = {};
    alle.forEach(function (z) { (D.graph.raus[z.id] || []).forEach(function (id) { personen[id] = true; }); });
    var auswahl = Object.keys(personen).map(eintrag).filter(Boolean).sort(function (a, b) { return a.name.localeCompare(b.name, 'de'); });
    var gefiltert = S.zeitMit ? alle.filter(function (z) { return (D.graph.raus[z.id] || []).indexOf(S.zeitMit) >= 0; }) : alle;
    var zw = (art('zeit').woerter || ['Zeit'])[0];
    var html = '<div class="eingabe" style="padding:8px;display:flex;gap:6px;flex-wrap:wrap">' +
      '<input id="z-datum" placeholder="Wann? z. B. 12. März" style="flex:1 1 100px;border:1px solid var(--linie);border-radius:6px;padding:5px 7px;outline:0">' +
      '<input id="z-text" placeholder="Was passiert?" style="flex:2 1 140px;border:1px solid var(--linie);border-radius:6px;padding:5px 7px;outline:0">' +
      '<button class="knopf primaer klein" data-aktion="zeit-neu">＋</button></div>';
    if (auswahl.length) {
      html += '<div class="filter"><button class="chip' + (S.zeitMit ? '' : ' aktiv') + '" data-zeitmit="">Alle</button>' +
        auswahl.map(function (k) {
          return '<button class="chip' + (S.zeitMit === k.id ? ' aktiv' : '') + '" data-zeitmit="' + h(k.id) + '">' + art(k.art).icon + ' ' + h(k.name) + '</button>';
        }).join('') + '</div>';
    }
    if (!gefiltert.length) {
      return html + '<div class="leer"><div class="gross">📅</div>Noch keine Ereignisse.<br>Tipp: Im Notizfeld <b>' + h(zw) + ' 12. März: Lena trifft Jonas</b></div>';
    }
    return html + '<div class="zeitstrahl" style="margin-top:10px">' + gefiltert.map(ereignisHtml).join('') + '</div>';
  }

  /* -------------------------------------------------------------- */
  /* Ansicht: Pinnwand                                               */
  /* -------------------------------------------------------------- */

  function renderPinnwand() {
    var ideen = S.eintraege.filter(function (e) { return e.art === 'idee'; })
      .sort(function (a, b) { return String(b.erstellt).localeCompare(String(a.erstellt)); });
    var html = '<div class="eingabe" style="padding:8px;display:flex;gap:6px">' +
      '<input id="idee-text" placeholder="💡 Neue Idee …" style="flex:1;border:0;outline:0;padding:4px">' +
      '<button class="knopf primaer klein" data-aktion="idee-neu">＋</button></div>';
    var spalten = [
      { id: 'offen', titel: '💭 Offen', leer: 'Keine offenen Ideen.' },
      { id: 'verwendet', titel: '✅ Verwendet', leer: '' },
      { id: 'verworfen', titel: '🗑️ Verworfen', leer: '' }
    ];
    spalten.forEach(function (s) {
      var liste = ideen.filter(function (e) { return (e.status || 'offen') === s.id; });
      if (!liste.length && !s.leer) return;
      html += '<div class="spalte"><div class="gruppe-kopf" style="margin-top:12px">' + s.titel + ' <span class="zahl">' + liste.length + '</span></div>' +
        (liste.length ? liste.map(ideeHtml).join('') : '<div class="unter">' + s.leer + '</div>') + '</div>';
    });
    return html;
  }

  function ideeHtml(e) {
    var status = e.status || 'offen';
    var knoepfe = status === 'offen'
      ? '<button class="knopf klein" data-status="verwendet" data-id="' + h(e.id) + '">✓ Verwendet</button><button class="knopf klein" data-status="verworfen" data-id="' + h(e.id) + '">Verwerfen</button>'
      : '<button class="knopf klein" data-status="offen" data-id="' + h(e.id) + '">↺ Wieder offen</button>';
    return '<div class="idee' + (status === 'verworfen' ? ' verworfen' : '') + '" data-eintrag="' + h(e.id) + '">' +
      '<div class="notiz-kopf">' + (e.name ? '<span class="titel">' + h(e.name) + '</span>' : '') + '<span class="rechts">' + stelleKnopf(e) +
      '<button class="mini" data-menue="' + h(e.id) + '">⋯</button></span></div>' +
      (S.bearbeiten === e.id
        ? '<textarea data-auto data-bearbeiten="' + h(e.id) + '">' + h(alsEingabe(e)) + '</textarea><div class="ki-leiste"><button class="knopf primaer klein" data-aktion="bearbeiten-ok" data-id="' + h(e.id) + '">Fertig</button><button class="knopf klein" data-aktion="bearbeiten-abbruch">Abbrechen</button></div>'
        : '<div class="notiz-text">' + textHtml(e.text) + '</div>') +
      '<div class="idee-fuss">' + knoepfe + '</div></div>';
  }

  /* -------------------------------------------------------------- */
  /* Ansicht: Ziel & Statistik                                       */
  /* -------------------------------------------------------------- */

  function ladeStatistik() {
    return rufe('bwStatistik').then(function (s) {
      S.stat = s;
      zeigeStatus();
      if (S.ansicht === 'ziel') render();
    }, function () {});
  }

  function renderZiel() {
    var s = S.stat, ziel = Number(S.einst.tagesziel) || 0, gesamtziel = Number(S.einst.gesamtziel) || 0;
    if (!s) return '<div class="laden"><div class="kreisel"></div>Wörter werden gezählt …</div>';
    var anteil = ziel ? Math.min(1, s.heute / ziel) : 0;
    var u = 2 * Math.PI * 38;
    var ring = '<svg class="ring" viewBox="0 0 92 92"><circle cx="46" cy="46" r="38" fill="none" stroke="#e8eaed" stroke-width="9"/>' +
      '<circle cx="46" cy="46" r="38" fill="none" stroke="' + (anteil >= 1 ? '#34a853' : '#1a73e8') + '" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + (u * anteil) + ' ' + u + '" transform="rotate(-90 46 46)"/>' +
      '<text x="46" y="52" text-anchor="middle" font-size="17" font-weight="700" fill="#202124">' + Math.round(anteil * 100) + '%</text></svg>';
    var tage = s.verlauf.slice(-14);
    var max = Math.max(ziel, 1, Math.max.apply(null, tage.map(function (t) { return t.geschrieben; })));
    var serie = 0;
    for (var i = s.verlauf.length - 1; i >= 0; i--) {
      if (ziel && s.verlauf[i].geschrieben >= ziel) serie++;
      else if (i !== s.verlauf.length - 1) break;
    }
    var html = '<div class="block"><div class="block-titel">Heute</div><div class="ring-box">' + ring + '<div>' +
      '<div class="zahl-gross">' + s.heute.toLocaleString('de-DE') + '</div><div class="unter" style="margin:0">von ' + ziel.toLocaleString('de-DE') + ' Wörtern</div>' +
      (anteil >= 1 ? '<div style="margin-top:4px">🎉 Tagesziel geschafft!</div>' : ziel ? '<div style="margin-top:4px;color:var(--text-2)">Noch ' + (ziel - s.heute).toLocaleString('de-DE') + ' Wörter</div>' : '') +
      (serie > 1 ? '<div style="margin-top:2px">🔥 ' + serie + ' Tage in Folge</div>' : '') + '</div></div></div>';
    html += '<div class="block"><div class="block-titel">Letzte 14 Tage<span class="rechts"><button class="link" data-aktion="statistik">↻</button></span></div><div class="balken">' +
      tage.map(function (t, j) {
        return '<div class="' + (ziel && t.geschrieben >= ziel ? 'erreicht' : '') + (j === tage.length - 1 ? ' heute' : '') + '" style="height:' + Math.max(2, t.geschrieben / max * 100) + '%" title="' + t.datum + ': ' + t.geschrieben + ' Wörter"></div>';
      }).join('') + '</div><div class="balken-achse"><span>' + (tage[0] ? tage[0].datum.slice(5).split('-').reverse().join('.') + '.' : '') + '</span><span>heute</span></div></div>';
    html += '<div class="block"><div class="block-titel">Manuskript</div><div class="zahl-gross">' + s.gesamt.toLocaleString('de-DE') + ' <span style="font-size:13px;font-weight:400;color:var(--text-2)">Wörter</span></div>' +
      '<div class="unter" style="margin:0">≈ ' + Math.round(s.gesamt / 250) + ' Normseiten</div>' +
      (gesamtziel ? '<div class="fortschritt"><div style="width:' + Math.min(100, s.gesamt / gesamtziel * 100) + '%"></div></div><div class="unter">' + Math.round(s.gesamt / gesamtziel * 100) + ' % von ' + gesamtziel.toLocaleString('de-DE') + ' Wörtern</div>' : '') + '</div>';
    html += '<div class="block"><div class="block-titel">Ziele</div><div class="zielfelder">' +
      '<label for="z-tag">Wörter pro Tag</label><input id="z-tag" type="number" min="0" step="50" data-ziel="tagesziel" value="' + ziel + '">' +
      '<label for="z-ges">Ziel fürs ganze Buch</label><input id="z-ges" type="number" min="0" step="1000" data-ziel="gesamtziel" value="' + (gesamtziel || '') + '" placeholder="z. B. 80000">' +
      '</div></div>';
    return html;
  }

  /* -------------------------------------------------------------- */
  /* Ansicht: Einstellungen                                          */
  /* -------------------------------------------------------------- */

  function renderEinstellungen() {
    var e = S.einst;
    var html = '<div class="block"><div class="block-titel">Dein Buch</div><div class="links">' +
      '<a href="' + h(S.tabelleUrl) + '" target="_blank">📊 Tabelle mit allen Einträgen öffnen</a>' +
      (S.ordnerUrl ? '<a href="' + h(S.ordnerUrl) + '" target="_blank">📁 Ordner mit den Personenblättern</a>' : '') +
      '</div><div class="unter">Die Tabelle lässt sich auch in der Google-Tabellen-App am Handy lesen.</div></div>';

    html += '<div class="block"><div class="block-titel">Verhalten</div>' +
      schalter('anheften', '📌 Neue Notizen an die Cursor-Stelle heften', 'Unsichtbar am Absatz verankert – „Hier“ zeigt dann die Notizen zum aktuellen Kapitel.') +
      schalter('blaetterAuto', '📄 Personenblätter als Google Docs', 'Für jede Karte ein Doc im Ordner „' + h(S.buch) + ' – Welt“. Im Text oder am iPhone einfach @Name tippen und das Blatt einfügen.') +
      '<div class="ki-leiste"><button class="knopf klein" data-aktion="blaetter-alle">📄 Alle Blätter jetzt erstellen</button></div>' +
      '<div class="ki-leiste"><button class="knopf klein" data-aktion="markieren">🖍️ Namen im Text markieren</button><button class="knopf klein" data-aktion="markierung-weg">Markierungen entfernen</button></div>' +
      '<div class="unter">Färbt alle Namen im Manuskript in der Farbe ihrer Art ein. Entfernt werden nur diese Markierungen.</div></div>';

    html += '<div class="block"><div class="block-titel">Schlüsselwörter & Felder</div>' +
      '<div class="unter" style="margin-top:0">Das erste Wort einer Notiz entscheidet, was daraus wird. Mehrere Wörter mit Komma trennen.</div>' +
      e.arten.map(function (a, i) {
        return '<details class="einst-art"><summary>' + a.icon + ' ' + h(a.name) + ' <span style="font-weight:400;color:var(--text-3)">' + h((a.woerter || []).join(', ')) + '</span></summary>' +
          '<div class="einst-zeile"><label>Name</label><input data-art-i="' + i + '" data-art-feld="name" value="' + h(a.name) + '"></div>' +
          '<div class="einst-zeile"><label>Symbol</label><input data-art-i="' + i + '" data-art-feld="icon" value="' + h(a.icon) + '" maxlength="4"></div>' +
          '<div class="einst-zeile"><label>Schlüsselwörter</label><input data-art-i="' + i + '" data-art-feld="woerter" value="' + h((a.woerter || []).join(', ')) + '"></div>' +
          (a.karte ? '<div class="einst-zeile"><label>Felder im Steckbrief (eins pro Zeile)</label><textarea rows="5" data-art-i="' + i + '" data-art-feld="felder">' + h((a.felder || []).join('\n')) + '</textarea></div>' : '') +
          (['person', 'ort', 'ding', 'zeit', 'idee'].indexOf(a.id) < 0 ? '<div class="ki-leiste"><button class="knopf klein gefahr" data-aktion="art-loeschen" data-i="' + i + '">Art entfernen</button></div>' : '') +
          '</details>';
      }).join('') +
      '<button class="knopf klein" data-aktion="art-neu">＋ Eigene Art (z. B. Organisation, Tier)</button></div>';

    html += '<div class="block"><div class="block-titel">KI-Hilfe (Claude)</div>' +
      (S.ki.aktiv
        ? '<div>✅ Eingerichtet (Schlüssel endet auf …' + h(S.ki.ende) + ')</div><div class="ki-leiste"><button class="knopf klein gefahr" data-aktion="ki-weg">Schlüssel entfernen</button></div>'
        : '<div class="unter" style="margin-top:0">Für „Steckbrief ausfüllen“ und „Widersprüche prüfen“ braucht es einen API-Schlüssel von <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a>. Pro Karte kostet das meist weniger als einen Cent.</div>' +
          '<div class="einst-zeile"><input id="ki-key" type="password" placeholder="sk-ant-…" autocomplete="off"></div><div class="ki-leiste"><button class="knopf primaer klein" data-aktion="ki-key">Speichern</button></div>') +
      '<div class="einst-zeile"><label>Modell</label><select id="ki-modell">' +
      [['claude-opus-5-5', 'Claude Opus 5.5 (beste Qualität)'], ['claude-sonnet-5-5', 'Claude Sonnet 5.5 (günstiger)'], ['claude-haiku-5-5', 'Claude Haiku 5.5 (am günstigsten)']]
        .map(function (m) { return '<option value="' + m[0] + '"' + (e.kiModell === m[0] ? ' selected' : '') + '>' + m[1] + '</option>'; }).join('') +
      '</select></div><div class="unter">Der Schlüssel wird nur in deinem Google-Konto gespeichert, nicht im Dokument.</div></div>';

    html += '<div class="block"><div class="block-titel">Hilfe</div><button class="knopf klein" data-aktion="hilfe-an">Kurzanleitung wieder anzeigen</button></div>';
    return html;
  }

  function schalter(feld, titel, text) {
    return '<label class="schalter"><input type="checkbox" data-schalter="' + feld + '"' + (S.einst[feld] ? ' checked' : '') + '><span>' + titel + '<small>' + text + '</small></span></label>';
  }

  function artFeldGeaendert(el) {
    var a = S.einst.arten[Number(el.dataset.artI)];
    var f = el.dataset.artFeld;
    if (f === 'woerter') a.woerter = el.value.split(',').map(function (s) { return s.trim().replace(/^#/, ''); }).filter(Boolean);
    else if (f === 'felder') a.felder = el.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    else a[f] = el.value.trim() || a[f];
    speichereEinstellungen().then(function () { toast('Gespeichert'); });
  }

  var FARBEN = [['#00796b', '#d7efec'], ['#5e35b1', '#ebe5f6'], ['#ad1457', '#f8e1ec'], ['#455a64', '#e3e8eb'], ['#ef6c00', '#fde9d9']];

  function neueArt() {
    var nr = S.einst.arten.length;
    var farbe = FARBEN[nr % FARBEN.length];
    S.einst.arten.push({ id: 'art' + Date.now().toString(36), name: 'Neue Art', mehrzahl: 'Neue Art', icon: '⭐', farbe: farbe[0], hell: farbe[1], woerter: [], karte: true, felder: ['Beschreibung'] });
    speichereEinstellungen();
    render();
    var d = $$('.einst-art');
    if (d.length) { d[d.length - 1].open = true; $('input', d[d.length - 1]).select(); }
  }

  function markieren() {
    var begriffe = [];
    Object.keys(D.index.namen).forEach(function (n) {
      var e = eintrag(D.index.namen[n].ids[0]);
      if (e && !D.index.namen[n].schwach) begriffe.push({ text: n, farbe: art(e.art).hell });
    });
    if (!begriffe.length) { toast('Noch keine Namen zum Markieren.'); return; }
    sichere('bwHervorheben', begriffe).then(function (n) { toast('🖍️ ' + n + ' Stellen markiert'); });
  }

  /* -------------------------------------------------------------- */
  /* Karte unter dem Cursor                                          */
  /* -------------------------------------------------------------- */

  function aktualisiereSpot() {
    var el = $('#spot');
    var c = S.cursor;
    if (!c || !c.text || !D.index) { el.hidden = true; return; }
    var verweise = C.findeVerweise(c.text, D.index).filter(function (v) { return !v.neu; });
    var amCursor = verweise.filter(function (v) { return c.offset >= v.start && c.offset <= v.ende; })[0];
    if (amCursor) {
      var e = eintrag(amCursor.ids[0]);
      var a = art(e.art);
      var felder = Object.keys(e.felder || {}).map(function (k) { return e.felder[k]; }).filter(Boolean);
      var info = felder.length ? felder.slice(0, 3).join(' · ') : C.ausschnitt(e.text, 80) || a.name;
      el.innerHTML = '<span class="spot-icon" style="' + stilFarbe(a) + '">' + a.icon + '</span><span class="spot-text"><div class="spot-name">' + h(e.name) + '</div><div class="spot-info">' + h(info) + '</div></span><span class="spot-pfeil">›</span>';
      el.dataset.id = e.id;
      el.title = 'Karte öffnen';
      el.hidden = false;
      return;
    }
    var ids = [];
    verweise.forEach(function (v) { if (ids.indexOf(v.ids[0]) < 0) ids.push(v.ids[0]); });
    if (!ids.length) { el.hidden = true; return; }
    el.dataset.id = '';
    el.title = '';
    el.innerHTML = '<span style="font-size:11px;color:var(--text-3);white-space:nowrap">Im Absatz:</span><span class="verbunden" style="flex:1;min-width:0">' +
      ids.slice(0, 6).map(function (id) {
        var e = eintrag(id);
        return '<button class="ref" data-id="' + h(id) + '" style="--c:' + art(e.art).farbe + '">' + art(e.art).icon + ' ' + h(e.name) + '</button>';
      }).join('') + '</span>';
    el.hidden = false;
  }

  var cursorLaeuft = false, cursorFehler = 0;
  function frageCursor() {
    if (cursorLaeuft || document.hidden) return;
    cursorLaeuft = true;
    rufe('bwCursor').then(function (c) {
      cursorLaeuft = false;
      cursorFehler = 0;
      var alt = S.cursor;
      S.cursor = c || S.cursor;
      if (!c) return;
      aktualisiereSpot();
      var anders = !alt || alt.kapitel !== c.kapitel || alt.pos !== c.pos || alt.tab !== c.tab;
      if (anders && S.ansicht === 'notizen') {
        if (!S.bearbeiten) renderNotizListe();
        aktualisiereVorschau();
      }
    }, function () {
      cursorLaeuft = false;
      cursorFehler++;
    });
  }

  function ladeTextstellen() {
    return rufe('bwTextstellen').then(function (t) {
      S.textstellen = t || {};
      if (S.ansicht === 'notizen' && !S.bearbeiten) renderNotizListe();
    }, function () {});
  }

  /* -------------------------------------------------------------- */
  /* Ereignisse                                                      */
  /* -------------------------------------------------------------- */

  var AKTIONEN = {
    'hilfe-zu': function () { S.einst.hinweisGesehen = true; speichereEinstellungen(); var x = $('#hilfe'); if (x) x.remove(); },
    'hilfe-an': function () { S.einst.hinweisGesehen = false; speichereEinstellungen(); geheZu('notizen'); },
    'zurueck': zurueck,
    'neu-karte': function (b) { S.neuIn = b.dataset.art; render(); var i = $('#neu-name'); if (i) i.focus(); },
    'neu-karte-ok': function (b) { neueKarteAnlegen(b.dataset.art); },
    'freitext': function (b, ev) { if (!ev.target.closest('.ref')) freitextBearbeiten(b); },
    'ki-felder': kiFelder,
    'ki-pruefen': kiPruefen,
    'ki-uebernehmen': kiUebernehmen,
    'ki-zu': function () { S.kiVorschlag = S.kiBefunde = null; render(); },
    'vorkommen': vorkommen,
    'zu-absatz': function (b) { var k = S.vorkommen.liste[Number(b.dataset.i)]; sichere('bwZuAbsatz', k.tab, k.index); },
    'notiz-zu': function () {
      var e = eintrag(S.karteId);
      geheZu('notizen');
      var ta = $('#neu');
      ta.value = '@' + e.name + ' ';
      ta.focus();
      ta.dispatchEvent(new Event('input'));
    },
    'karten-menue': function (b) {
      var e = eintrag(S.karteId);
      var r = b.getBoundingClientRect();
      var optionen = [{ html: '📝 Notiz zu ' + h(e.name), tun: AKTIONEN['notiz-zu'] }];
      if (e.blatt) optionen.push({ html: '📄 Personenblatt öffnen', tun: function () { window.open('https://docs.google.com/document/d/' + e.blatt + '/edit', '_blank'); } });
      else optionen.push({ html: '📄 Personenblatt erstellen', tun: function () { S.blaetterOffen[e.id] = true; blaetterSenden().then(function () { toast('📄 Blatt erstellt'); }); } });
      if (e.anker) optionen.push({ html: '📌 Wo ich sie angelegt habe', tun: function () { springe(e); } });
      optionen.push({ html: '<span style="color:var(--gefahr)">🗑️ Karte löschen</span>', tun: function () { loesche(e, '„' + e.name + '“ wirklich löschen? Notizen bleiben erhalten.'); } });
      auswahlMenue(r.right - 190, r.bottom + 2, null, optionen);
    },
    'bez-neu': function () {
      var ziel = $('#bez-ziel').value, artText = $('#bez-art').value.trim();
      if (!ziel) { toast('Bitte auswählen, mit wem.'); return; }
      neueBeziehung(S.karteId, ziel, artText);
      render();
    },
    'bez-loeschen': function (b) {
      var bz = S.beziehungen.filter(function (x) { return x.id === b.dataset.bez; })[0];
      S.beziehungen = S.beziehungen.filter(function (x) { return x !== bz; });
      berechne();
      render();
      sichere('bwBeziehungLoeschen', bz.id).then(function () { blaetterVormerken([bz.von, bz.nach]); });
    },
    'bearbeiten-ok': function (b) { bearbeitenFertig(b.dataset.id); },
    'bearbeiten-abbruch': function () { S.bearbeiten = null; render(); },
    'zeit-neu': function () {
      var d = $('#z-datum').value.trim(), t = $('#z-text').value.trim();
      if (!d && !t) return;
      speichere({ art: 'zeit', name: d, text: t }).then(render);
      render();
      $('#z-datum').focus();
    },
    'idee-neu': function () {
      var t = $('#idee-text').value.trim();
      if (!t) return;
      speichere({ art: 'idee', name: '', text: t, status: 'offen' }).then(render);
      render();
      $('#idee-text').focus();
    },
    'statistik': ladeStatistik,
    'blaetter-alle': function () {
      toast('📄 Blätter werden erstellt – das kann etwas dauern …', { dauer: 10000 });
      blaetterSenden(true).then(function () { toast('📄 Alle Personenblätter sind aktuell.'); render(); });
    },
    'markieren': markieren,
    'markierung-weg': function () { sichere('bwHervorhebungEntfernen').then(function (n) { toast('Markierungen entfernt'); }); },
    'art-neu': neueArt,
    'art-loeschen': function (b) {
      var a = S.einst.arten[Number(b.dataset.i)];
      if (S.eintraege.some(function (e) { return e.art === a.id; })) { toast('Es gibt noch Einträge dieser Art.'); return; }
      S.einst.arten.splice(Number(b.dataset.i), 1);
      speichereEinstellungen();
      render();
    },
    'ki-key': function () {
      var k = $('#ki-key').value.trim();
      if (!k) return;
      sichere('bwKiSchluesselSetzen', k).then(function (st) { S.ki = st; render(); toast('✨ KI-Hilfe ist eingerichtet'); });
    },
    'ki-weg': function () { sichere('bwKiSchluesselSetzen', '').then(function (st) { S.ki = st; render(); }); }
  };

  function klick(ev) {
    var t = ev.target;
    var nav = t.closest('[data-nav]');
    if (nav) { geheZu(nav.dataset.nav); return; }
    if (!t.closest('.auswahl-menue')) schliesseMenues();
    var b;
    if ((b = t.closest('.ref.neu'))) {
      var r = b.getBoundingClientRect();
      neuAnlegenMenue(b.dataset.neu, r.left, r.bottom + 4);
      return;
    }
    if ((b = t.closest('[data-ids]'))) {
      var r2 = b.getBoundingClientRect();
      auswahlMenue(r2.left, r2.bottom + 4, 'Welche Karte?', b.dataset.ids.split(',').map(function (id) {
        var e = eintrag(id);
        return { html: art(e.art).icon + ' ' + h(e.name), tun: function () { oeffneKarte(id); } };
      }));
      return;
    }
    if ((b = t.closest('[data-id].ref, .zeile[data-id]'))) { oeffneKarte(b.dataset.id); return; }
    if ((b = t.closest('#spot'))) { if (b.dataset.id) oeffneKarte(b.dataset.id); return; }
    if ((b = t.closest('[data-stelle]'))) { springe(eintrag(b.dataset.stelle)); return; }
    if ((b = t.closest('[data-menue]'))) { notizMenue(b.dataset.menue, b); return; }
    if ((b = t.closest('[data-filter]'))) {
      S.filter = b.dataset.filter;
      merke('filter', S.filter);
      if (S.filter === 'hier') ladeTextstellen();
      renderNotizListe();
      return;
    }
    if ((b = t.closest('[data-zeitmit]'))) { S.zeitMit = b.dataset.zeitmit; render(); return; }
    if ((b = t.closest('[data-status]'))) {
      var e = eintrag(b.dataset.id);
      e.status = b.dataset.status;
      speichere(e);
      render();
      return;
    }
    if ((b = t.closest('[data-aktion]')) && AKTIONEN[b.dataset.aktion]) {
      AKTIONEN[b.dataset.aktion](b, ev);
    }
  }

  function aenderung(ev) {
    var t = ev.target;
    if (t.dataset.feld || t.dataset.steckbrief) { karteFeldGeaendert(t); return; }
    if (t.dataset.schalter) {
      S.einst[t.dataset.schalter] = t.checked;
      speichereEinstellungen();
      return;
    }
    if (t.dataset.artFeld) { artFeldGeaendert(t); return; }
    if (t.dataset.ziel) {
      S.einst[t.dataset.ziel] = Math.max(0, Number(t.value) || 0);
      speichereEinstellungen().then(function () { zeigeStatus(); if (S.ansicht === 'ziel') render(); });
      return;
    }
    if (t.id === 'ki-modell') { S.einst.kiModell = t.value; speichereEinstellungen(); }
  }

  function tasten(ev) {
    var t = ev.target;
    if (ev.key === 'Enter' && !ev.shiftKey) {
      if (t.id === 'neu-name') { ev.preventDefault(); neueKarteAnlegen(S.neuIn); }
      else if (t.id === 'z-text' || t.id === 'z-datum') { ev.preventDefault(); AKTIONEN['zeit-neu'](); }
      else if (t.id === 'idee-text') { ev.preventDefault(); AKTIONEN['idee-neu'](); }
      else if (t.id === 'ki-key') { ev.preventDefault(); AKTIONEN['ki-key'](); }
      else if (t.dataset.bearbeiten) { ev.preventDefault(); bearbeitenFertig(t.dataset.bearbeiten); }
      else if (t.classList.contains('karte-name') || t.classList.contains('feld-alias')) { ev.preventDefault(); t.blur(); }
    }
    if (ev.key === 'Escape') {
      if (t.dataset.bearbeiten) { S.bearbeiten = null; render(); }
      else if (t.id === 'neu-name') { S.neuIn = null; render(); }
      else schliesseMenues();
    }
    if (ev.key === 'Backspace' && S.ansicht === 'karte' && !/INPUT|TEXTAREA|SELECT/.test(t.tagName) && ev.altKey) zurueck();
  }

  /* -------------------------------------------------------------- */
  /* Start                                                           */
  /* -------------------------------------------------------------- */

  function start() {
    document.addEventListener('click', klick);
    document.addEventListener('change', aenderung);
    document.addEventListener('keydown', tasten);
    document.addEventListener('input', function (ev) { if (ev.target.matches('textarea[data-auto]')) autoHoehe(ev.target); });
    rufe('bwLaden').then(function (d) {
      S.buch = d.buch;
      S.tabelleUrl = d.tabelleUrl;
      S.ordnerUrl = d.ordnerUrl;
      S.einst = d.einstellungen;
      S.eintraege = d.eintraege;
      S.beziehungen = d.beziehungen;
      S.ki = d.ki;
      $('#buchtitel').textContent = d.buch;
      $('#buchtitel').title = d.buch;
      berechne();
      $('#ansicht').innerHTML = '';
      render();
      if (!S.einst.hinweisGesehen && !S.eintraege.length) setTimeout(function () { var t = $('#neu'); if (t) t.focus(); }, 100);
      ladeTextstellen();
      ladeStatistik();
      frageCursor();
      setInterval(frageCursor, 1500);
      setInterval(ladeTextstellen, 60000);
      setInterval(ladeStatistik, 300000);
    }, function (err) {
      $('#ansicht').innerHTML = '<div class="leer"><div class="gross">😕</div>Die Buchwerkstatt konnte nicht geladen werden.<br><small>' + h(fehlertext(err)) + '</small><br><br><button class="knopf" onclick="location.reload()">Nochmal versuchen</button></div>';
    });
    window.addEventListener('beforeunload', function () { if (Object.keys(S.blaetterOffen).length) blaetterSenden(); });
  }

  start();
})();
</script>
